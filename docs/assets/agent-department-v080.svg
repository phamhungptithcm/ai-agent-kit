<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Department orchestration flow</title>
  <desc id="desc">A task reaches the Team Lead, which selects a single agent, product workcell, bug workcell, or assurance workcell. Every path enters an independent review, fix, and verify loop before final evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1727"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#6d5dfc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627b98"/></marker>
    <style>.node{fill:#0f2032;stroke:#294158;stroke-width:2}.team{fill:#11263a;stroke:#365c7c;stroke-width:2}.label{fill:#f5f8fc;font:600 17px system-ui,-apple-system,sans-serif}.sub{fill:#91a7bd;font:500 12px system-ui,-apple-system,sans-serif;letter-spacing:.08em}.icon{font:22px system-ui,-apple-system,sans-serif}.line{fill:none;stroke:#627b98;stroke-width:2;marker-end:url(#arrow)}.route{fill:#8ea3b8;font:600 13px system-ui,-apple-system,sans-serif}.badge{fill:#9fc4ff;font:700 11px system-ui,-apple-system,sans-serif;letter-spacing:.1em}</style>
  </defs>
  <rect width="1440" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="80" cy="70" r="240" fill="#183e77" opacity=".16"/><circle cx="1380" cy="590" r="260" fill="#5034a9" opacity=".12"/>
  <text x="72" y="72" class="badge">RIGHT-SIZED ENGINEERING TEAM</text>
  <text x="72" y="112" fill="#f7f9fc" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="750" letter-spacing="-.8">One task in. The smallest safe team takes it from there.</text>

  <path class="line" d="M202 321H284"/><path class="line" d="M480 321H548"/>
  <path class="line" d="M644 292C704 206 740 182 798 182"/><path class="line" d="M650 310C714 274 748 270 798 270"/><path class="line" d="M650 332C714 366 748 358 798 358"/><path class="line" d="M644 351C702 436 742 446 798 446"/>
  <path class="line" d="M1030 182C1094 182 1096 270 1140 300"/><path class="line" d="M1030 270H1128"/><path class="line" d="M1030 358H1128"/><path class="line" d="M1030 446C1094 446 1096 360 1140 330"/><path class="line" d="M1324 321H1362"/>

  <g filter="url(#shadow)"><rect class="node" x="72" y="278" width="130" height="86" rx="16"/><text x="94" y="314" class="icon">🎯</text><text x="126" y="315" class="label">Task</text><text x="94" y="342" class="sub">GOAL · SCOPE</text></g>
  <g filter="url(#shadow)"><rect class="node" x="284" y="270" width="196" height="102" rx="18"/><text x="308" y="311" class="icon">🧭</text><text x="343" y="312" class="label">Team Lead</text><text x="308" y="342" class="sub">DECIDE · OWN · SYNTHESIZE</text></g>
  <g filter="url(#shadow)"><path d="M606 260L674 321L606 382L538 321Z" fill="url(#blue)"/><text x="574" y="316" fill="#fff" font-family="system-ui" font-size="15" font-weight="700">TASK</text><text x="570" y="337" fill="#fff" font-family="system-ui" font-size="15" font-weight="700">SHAPE</text></g>

  <text x="727" y="174" class="route">FEATURE</text><text x="747" y="262" class="route">BUG</text><text x="716" y="350" class="route">HIGH RISK</text><text x="738" y="438" class="route">SMALL</text>
  <g filter="url(#shadow)"><rect class="team" x="798" y="140" width="232" height="84" rx="16"/><text x="823" y="176" class="icon">🏗️</text><text x="859" y="177" class="label">Product workcell</text><text x="823" y="203" class="sub">DOMAIN · BUILD · QA</text></g>
  <g filter="url(#shadow)"><rect class="team" x="798" y="228" width="232" height="84" rx="16"/><text x="823" y="264" class="icon">🩺</text><text x="859" y="265" class="label">Bug workcell</text><text x="823" y="291" class="sub">TRACE · FIX · REGRESS</text></g>
  <g filter="url(#shadow)"><rect class="team" x="798" y="316" width="232" height="84" rx="16"/><text x="823" y="352" class="icon">🛡️</text><text x="859" y="353" class="label">Assurance workcell</text><text x="823" y="379" class="sub">SECURITY · DATA · SRE</text></g>
  <g filter="url(#shadow)"><rect class="team" x="798" y="404" width="232" height="84" rx="16"/><text x="823" y="440" class="icon">👤</text><text x="859" y="441" class="label">Single agent</text><text x="823" y="467" class="sub">FAST · BOUNDED</text></g>

  <g filter="url(#shadow)"><rect x="1128" y="260" width="196" height="122" rx="20" fill="#14253b" stroke="#537cb2" stroke-width="2"/><text x="1153" y="301" class="icon">🔁</text><text x="1189" y="302" class="label">Review loop</text><text x="1153" y="333" class="sub">REVIEW · FIX · VERIFY</text><text x="1153" y="357" fill="#65d8a5" font-family="system-ui" font-size="12" font-weight="700">INDEPENDENT · EVIDENCED</text></g>
  <g filter="url(#shadow)"><rect class="node" x="1362" y="281" width="1" height="80" rx="16" opacity="0"/><text x="1368" y="309" class="icon">📦</text><text x="1368" y="337" fill="#f5f8fc" font-family="system-ui" font-size="15" font-weight="700">Evidence</text></g>

  <text x="72" y="565" fill="#8ca2b8" font-family="system-ui,-apple-system,sans-serif" font-size="13">Native subagents on supported hosts · serial-persona fallback everywhere else · one write owner · no autonomous release</text>
</svg>
