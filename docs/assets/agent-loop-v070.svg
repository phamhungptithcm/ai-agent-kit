<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Kit workflow</title>
  <desc id="desc">Understand, inspect, plan, approve, execute, verify, review until ready, and report with evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111d32"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020617" flood-opacity=".55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f59e0b"/></marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step { font-size: 17px; font-weight: 820; fill: #f8fafc; }
      .sub { font-size: 10.5px; font-weight: 820; fill: #94a3b8; letter-spacing: .65px; }
      .num { font-size: 10px; font-weight: 850; fill: #64748b; letter-spacing: 1.2px; }
      .badge { font-size: 9.5px; font-weight: 850; letter-spacing: .7px; }
      .icon { fill: none; stroke: #fff; stroke-width: 3.7; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="440" rx="30" fill="url(#bg)"/>
  <circle cx="40" cy="420" r="180" fill="#7c3aed" opacity=".06"/>
  <circle cx="1560" cy="20" r="180" fill="#2563eb" opacity=".07"/>

  <g class="sans">
    <path d="M110 210H1490" stroke="#253449" stroke-width="8" stroke-linecap="round"/>
    <path class="flow" d="M202 210H225"/><path class="flow" d="M395 210H418"/>
    <path class="flow" d="M588 210H611"/><path class="flow" d="M781 210H804"/>
    <path class="flow" d="M974 210H997"/><path class="flow" d="M1167 210H1190"/>
    <path d="M1360 210H1383" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Understand -->
    <g filter="url(#shadow)">
      <rect x="32" y="92" width="170" height="236" rx="27" fill="#0d203a" stroke="#3b82f6" stroke-width="2.4"/>
      <text x="53" y="120" class="num">01</text>
      <circle cx="117" cy="177" r="40" fill="url(#blue)"/>
      <g class="icon"><circle cx="117" cy="177" r="21"/><circle cx="117" cy="177" r="7"/><path d="M117 143V155M117 199V211M83 177H95M139 177H151"/></g>
      <text x="117" y="258" text-anchor="middle" class="step">Understand</text>
      <text x="117" y="286" text-anchor="middle" class="sub">GOAL · SCOPE · RISK</text>
    </g>

    <!-- Inspect -->
    <g filter="url(#shadow)">
      <rect x="225" y="92" width="170" height="236" rx="27" fill="#0d203a" stroke="#3b82f6" stroke-width="2.4"/>
      <text x="246" y="120" class="num">02</text>
      <circle cx="310" cy="177" r="40" fill="url(#blue)"/>
      <g class="icon"><circle cx="303" cy="170" r="18"/><path d="M316 183 332 199M292 170H314M303 159V181" opacity=".8"/></g>
      <text x="310" y="258" text-anchor="middle" class="step">Inspect</text>
      <text x="310" y="286" text-anchor="middle" class="sub">CODE · DOCS · IMPACT</text>
      <rect x="258" y="343" width="104" height="25" rx="12.5" fill="#172554" stroke="#3b82f6"/>
      <text x="310" y="360" text-anchor="middle" class="badge" fill="#bfdbfe">READY / DEGRADED</text>
    </g>

    <!-- Plan -->
    <g filter="url(#shadow)">
      <rect x="418" y="92" width="170" height="236" rx="27" fill="#201637" stroke="#8b5cf6" stroke-width="2.4"/>
      <text x="439" y="120" class="num">03</text>
      <circle cx="503" cy="177" r="40" fill="url(#violet)"/>
      <g class="icon"><rect x="483" y="154" width="40" height="48" rx="5"/><path d="M495 154V149H511V154M493 167H513M493 179H513M493 191H507"/></g>
      <text x="503" y="258" text-anchor="middle" class="step">Plan</text>
      <text x="503" y="286" text-anchor="middle" class="sub">CHANGE · TEST · ROLLBACK</text>
    </g>

    <!-- Approve -->
    <g filter="url(#shadow)">
      <rect x="611" y="92" width="170" height="236" rx="27" fill="#201637" stroke="#a78bfa" stroke-width="2.4"/>
      <text x="632" y="120" class="num">04</text>
      <circle cx="696" cy="177" r="40" fill="url(#violet)"/>
      <g class="icon"><path d="M696 150 719 158V176C719 190 710 201 696 207 682 201 673 190 673 176V158Z"/><path d="m685 177 8 8 16-18"/></g>
      <text x="696" y="258" text-anchor="middle" class="step">Approve</text>
      <text x="696" y="286" text-anchor="middle" class="sub">HUMAN GATE</text>
    </g>

    <!-- Execute -->
    <g filter="url(#shadow)">
      <rect x="804" y="92" width="170" height="236" rx="27" fill="#201637" stroke="#8b5cf6" stroke-width="2.4"/>
      <text x="825" y="120" class="num">05</text>
      <circle cx="889" cy="177" r="40" fill="url(#violet)"/>
      <g class="icon"><path d="m878 160-17 17 17 17M900 160l17 17-17 17M895 151l-12 52"/></g>
      <text x="889" y="258" text-anchor="middle" class="step">Execute</text>
      <text x="889" y="286" text-anchor="middle" class="sub">ALLOW · ASK · DENY</text>
    </g>

    <!-- Verify -->
    <g filter="url(#shadow)">
      <rect x="997" y="92" width="170" height="236" rx="27" fill="#352209" stroke="#f59e0b" stroke-width="2.8"/>
      <text x="1018" y="120" class="num">06</text>
      <circle cx="1082" cy="177" r="40" fill="url(#amber)"/>
      <g class="icon"><path d="M1067 150H1097M1072 150V166L1059 193A8 8 0 0 0 1066 204H1098A8 8 0 0 0 1105 193L1092 166V150"/><path d="m1070 190 8 8 17-18"/></g>
      <text x="1082" y="258" text-anchor="middle" class="step">Verify</text>
      <text x="1082" y="286" text-anchor="middle" class="sub">TEST · SECURITY · SCOPE</text>
    </g>

    <!-- Review loop: a real node in the flow -->
    <g filter="url(#shadow)">
      <rect x="1190" y="92" width="170" height="236" rx="27" fill="#352209" stroke="#f59e0b" stroke-width="3"/>
      <text x="1211" y="120" class="num">06B</text>
      <circle cx="1275" cy="177" r="44" fill="#f59e0b" opacity=".16" filter="url(#glow)"/>
      <circle cx="1275" cy="177" r="40" fill="url(#amber)"/>
      <g class="icon"><path d="M1252 172A25 25 0 0 1 1293 159"/><path d="m1288 149 8 11-13 3"/><path d="M1298 182A25 25 0 0 1 1257 195"/><path d="m1262 205-8-11 13-3"/><path d="m1265 177 7 7 14-16"/></g>
      <text x="1275" y="258" text-anchor="middle" class="step">Review loop</text>
      <text x="1275" y="286" text-anchor="middle" class="sub">FIX · RETEST · REPEAT</text>
      <path d="M1222 313C1222 388 1328 388 1328 313" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowAmber)"/>
      <rect x="1236" y="343" width="78" height="25" rx="12.5" fill="#78350f"/>
      <text x="1275" y="360" text-anchor="middle" class="badge" fill="#fef3c7">UNTIL PASS</text>
    </g>

    <!-- Report -->
    <g filter="url(#shadow)">
      <rect x="1383" y="92" width="170" height="236" rx="27" fill="#0c3029" stroke="#10b981" stroke-width="2.5"/>
      <text x="1404" y="120" class="num">07</text>
      <circle cx="1468" cy="177" r="40" fill="url(#green)"/>
      <g class="icon"><path d="M1449 150H1478L1488 160V207H1449Z"/><path d="M1478 150V162H1488M1459 174H1478M1459 186H1478M1459 198H1471"/></g>
      <text x="1468" y="258" text-anchor="middle" class="step">Report</text>
      <text x="1468" y="286" text-anchor="middle" class="sub">EVIDENCE · READINESS</text>
      <rect x="1413" y="343" width="110" height="25" rx="12.5" fill="#064e3b" stroke="#10b981"/>
      <text x="1468" y="360" text-anchor="middle" class="badge" fill="#d1fae5">READY / NOT READY</text>
    </g>
  </g>
</svg>
