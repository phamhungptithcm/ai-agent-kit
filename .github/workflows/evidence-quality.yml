name: Evidence Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run eval:gate
      - run: npm run eval:routing
      - run: npm run evidence:verify
      - run: node --test test/v070-evidence.test.mjs
