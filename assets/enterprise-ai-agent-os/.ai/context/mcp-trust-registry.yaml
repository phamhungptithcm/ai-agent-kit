version: 2
default_trust: deny
canonical_machine_registry: ".ai/context/mcp-trust-registry.json"
required_fields:
  - id
  - owner
  - version
  - source
  - executable_or_image_digest
  - transport
  - authentication
  - allowed_tools_and_resources
  - data_classification
  - network_destinations
  - write_capability
  - approval_requirement
  - last_security_review
  - review_expires
  - configuration_sha256
  - filesystem_roots
  - network_domains
  - timeout_ms
  - rate_limit_per_minute
servers: []
