version: 2
defaults:
  filesystem: approved-paths-only
  network: deny
  subprocess: policy-gateway-only
  secrets: unavailable
medium_and_high_risk:
  prefer_ephemeral_worktree_or_container: true
  resource_limits_required: true
  network_domain_allowlist_required: true
secret_broker:
  short_lived_scoped_credentials_only: true
  expose_to_prompt: false
  expose_to_evidence_or_telemetry: false
  environment_dump_forbidden: true
mcp_broker:
  default_trust: deny
  exact_server_identity_required: true
  trust_registry: ".ai/context/mcp-trust-registry.json"
  credential_provider_after_authorization_only: true
  prompt_supplied_token_passthrough: deny
  private_or_loopback_network_destinations: deny
  unsafe_shell_startup: deny
critical_operations:
  execution: forbidden
  allowed_output: reviewed_human_procedure
