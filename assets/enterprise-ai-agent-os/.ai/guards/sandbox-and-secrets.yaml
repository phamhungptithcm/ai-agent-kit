version: 1
defaults:
  filesystem: approved-paths-only
  network: deny
  subprocess: policy-gateway-only
  secrets: unavailable
medium_and_high_risk:
  prefer_ephemeral_worktree_or_container: true
  resource_limits_required: true
  network_domain_allowlist_required: true
secret_broker:
  short_lived_scoped_credentials_only: true
  expose_to_prompt: false
  expose_to_evidence_or_telemetry: false
  environment_dump_forbidden: true
critical_operations:
  execution: forbidden
  allowed_output: reviewed_human_procedure
