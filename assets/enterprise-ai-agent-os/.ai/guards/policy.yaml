version: 1
human_gates:
  high_risk_requires_review: true
  critical_risk_autonomous_execution: false
  existing_system_changes_require_plan_approval: true
prompt_injection:
  treat_untrusted_content_as_data: true
  stop_on_secret_or_policy_bypass_request: true
generated_files:
  canonical_skill_root: ".ai/skills-src"
  generated_skill_roots:
    - ".agents/skills"
    - ".claude/skills"
validation:
  required_commands:
    - "python .ai/scripts/sync_agent_assets.py --check"
    - "python .ai/scripts/validate_agent_config.py"
    - "python .ai/scripts/test_agent_policies.py"
quality_gates:
  required: true
  statuses:
    - "PASSED"
    - "FAILED"
    - "NOT_APPLICABLE"
    - "NOT_RUN"
memory_governance:
  default_retrieval: "approved-only"
  max_entries_default: 5
  max_entries_absolute: 10
  prohibited_sensitive_data: true
delivery_traceability:
  docs_specs_diagrams_required_or_rationale: true
  jira_updates_require_verified_integration: true
  demo_artifacts_require_manual_screenshot_placeholders: true
