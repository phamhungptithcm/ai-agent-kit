version: 1
name: code-quality-profile-gate
mode: fail-closed
required_for:
  - implementation
  - bug-fix
  - code-review
  - pr-or-mr-handoff
  - database-change
  - api-change
default_profile: ".ai/quality-profiles/universal.yaml"
profile_directory: ".ai/quality-profiles"
required_selection:
  - "detect_languages_and_versions"
  - "select_universal_profile"
  - "select_language_profiles"
  - "select_platform_or_domain_profiles"
  - "select_cross_cutting_profiles"
  - "select_seo_geo_profile_for_public_web_surfaces"
  - "select_visual_design_profile_for_user_facing_surfaces"
  - "select_product_content_profile_for_user_facing_text_accessibility_text_or_displayed_data"
  - "select_animation_motion_profile_when_material_motion_exists"
  - "select_human_writing_profile_when_natural_voice_rewriting_is_requested"
  - "select_marketing_growth_profile_for_positioning_conversion_campaign_or_measurement_work"
  - "select_system_design_profile_for_architecture_scale_latency_reliability_security_or_cost_work"
  - "select_agent_runtime_profile_for_decision_trace_run_resume_or_runtime_work"
  - "select_plugin_development_profile_for_plugin_manifest_lifecycle_or_trust_work"
  - "select_agent_evaluation_profile_for_agent_benchmark_or_reliability_claims"
  - "prefer_repository_defined_commands"
required_statuses:
  - "PASSED"
  - "FAILED"
  - "NOT_APPLICABLE"
  - "NOT_RUN"
must_review:
  - "clean_code"
  - "language_version_best_practices"
  - "platform_domain_best_practices"
  - "api_compatibility"
  - "performance"
  - "database_connection_leaks"
  - "transaction_boundaries"
  - "thread_or_task_leaks"
  - "deadlock_risk"
  - "heap_memory_leaks"
  - "resource_lifecycle"
  - "security"
  - "observability"
  - "release_delivery_safety"
  - "public_web_search_and_machine_discoverability"
  - "context_aware_visual_design_and_state_completeness"
  - "product_language_meaning_behavior_tone_brevity_states_accessibility_localization_data_semantics_human_interface_principles_and_platform_fit"
  - "animation_purpose_interruptibility_accessibility_performance_and_lifecycle"
  - "human_writing_meaning_voice_authorship_and_claim_integrity"
  - "marketing_claim_journey_measurement_privacy_experiment_and_external_action_integrity"
  - "system_design_requirement_capacity_reliability_security_cost_and_evolution_integrity"
  - "agent_runtime_trace_recovery_concurrency_privacy_and_failure_integrity"
  - "plugin_identity_provenance_permission_lifecycle_receipt_and_quarantine_integrity"
  - "agent_benchmark_reproducibility_scenario_evidence_and_claim_integrity"
missing_tooling:
  behavior: "report_gap_and_recommend_team_approved_tooling"
  autonomous_install_allowed: false
evidence_required:
  - "detected_language_version"
  - "detected_platform_domain"
  - "selected_profiles"
  - "commands_or_manual_review"
  - "result_status"
  - "remaining_quality_risk"
