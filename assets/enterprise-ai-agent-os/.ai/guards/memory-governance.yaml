version: 3
name: memory-governance
default_retrieval: "approved-only"
approval_required: true
allowed_status_for_default_retrieval:
  - "APPROVED"
blocked_status:
  - "PROPOSED"
  - "REJECTED"
  - "STALE"
  - "SUPERSEDED"
  - "REVOKED"
  - "EXPIRED"
confidence:
  preferred_minimum: 0.8
  below_minimum_requires_source_reverification: true
retrieval:
  default_max_entries: 5
  absolute_max_entries: 10
  scoring_factors:
    - "source_priority"
    - "scope_match"
    - "confidence"
    - "recency"
    - "stale_review_status"
source_priority:
  - "current_source_code"
  - "tests"
  - "approved_architecture_docs"
  - "approved_memory"
  - "historical_discussion"
  - "agent_inference"
prohibited_content:
  - "secrets"
  - "credentials"
  - "tokens"
  - "private_keys"
  - "pii"
  - "phi"
  - "pci"
  - "production_customer_data"
  - "unapproved_sensitive_logs"
  - "raw_prompts"
  - "chat_history"
  - "chain_of_thought"
  - "source_bodies"
  - "raw_tool_output"
review:
  stale_review_required: true
  cadence: "quarterly"
  future_review_date_required: true
source_commit:
  required_for_approval: true
  must_be_reachable_from_head: true
lifecycle:
  revocation_tombstones: true
  supersession_replacement_required: true
  deterministic_retrieval_first: true
  health_report: true
storage:
  default_backend: "local-sqlite"
  wal: true
  transactions: true
  optimistic_revisions: true
  jsonl_role: "audit-interchange-and-v2-compatibility"
migration:
  preview_required: true
  backup_required: true
  conflict_policy: "fail-closed"
  rollback_requires_unchanged_revision: true
retrieval_hard_filters:
  - "organization_identity"
  - "repository_identity"
  - "lifecycle"
  - "acl"
  - "visibility_scope"
  - "source_reachability"
  - "conflicts"
receipt:
  include_content: false
  include_hidden_reasoning: false
  include_selected_ids_hashes_scores: true
  include_exclusion_reason_codes: true
subagent_promotion:
  candidate_limit_per_handoff: 10
  candidate_trust: "untrusted"
  team_lead_review_required: true
  independent_memory_approver_required: true
  self_approval: false
  failed_or_orphaned_run_promotion: false
remote:
  opt_in: true
  write_authorization_required: true
  signed_repository_bound_packs: true
  replay_protection: true
  required_capabilities:
    - "repository_binding"
    - "acl"
    - "audit_receipts"
    - "transport_encryption"
    - "at_rest_encryption"
    - "retention"
    - "replay_protection"
  outage_mode: "DEGRADED_LOCAL_FALLBACK"
trust_tiers:
  - "verified"
  - "reviewed"
  - "provisional"
roles:
  memory_approver: "Approves, rejects, supersedes, or marks memory stale."
  module_context_owner: "Verifies module-scoped memory against current ownership and source."
  skill_maintainer: "Keeps skills and prompts aligned with approved memory policy."
