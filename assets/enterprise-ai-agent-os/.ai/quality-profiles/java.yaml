version: 1

id: java

name: Java Engineering Quality Profile

description: 
  Mandatory engineering standards for Java applications, Spring Boot services,
  shared libraries, batch jobs, schedulers, message consumers, and integration
  components. Optimize for correctness, maintainability, runtime safety,
  backward compatibility, performance, security, and production operability.

applies_when:
  - "Java source, JVM configuration, Maven, Gradle, dependency, module, or build behavior changes"
  - "Spring Boot, Spring Framework, Quarkus, Micronaut, Jakarta EE, JPA, Hibernate, JDBC, or persistence behavior changes"
  - "REST APIs, event consumers, scheduled jobs, batch processing, transactions, caching, serialization, or concurrency changes"
  - "JVM memory, garbage collection, thread pools, connection pools, startup, shutdown, or container runtime configuration changes"
  - "public Java APIs, shared libraries, serialized contracts, database mappings, or configuration properties change"

goals:
  - "correctness"
  - "clear domain modeling"
  - "runtime and resource safety"
  - "backward-compatible evolution"
  - "bounded concurrency and memory use"
  - "heap retention reviewed"
  - "secure defaults"
  - "predictable transactional behavior"
  - "production observability"
  - "reproducible builds"
  - "operational resilience"

detect:

  files:
    - "pom.xml"
    - "*.pom"
    - "build.gradle"
    - "build.gradle.kts"
    - "settings.gradle"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "gradlew"
    - "gradle/wrapper/gradle-wrapper.properties"
    - ".java-version"
    - ".sdkmanrc"
    - "module-info.java"
    - "*.java"
    - "application.yml"
    - "application.yaml"
    - "application.properties"
    - "bootstrap.yml"
    - "bootstrap.yaml"
    - "logback.xml"
    - "logback-spring.xml"
    - "Dockerfile"
    - "Dockerfile.*"
    - "jib*.xml"
    - "jib*.gradle"
    - "lombok.config"
    - "checkstyle.xml"
    - "pmd.xml"
    - "spotbugs*.xml"
    - "sonar-project.properties"

  frameworks:
    - "Spring Boot"
    - "Spring Framework"
    - "Spring Cloud"
    - "Spring Batch"
    - "Spring Security"
    - "Spring Data"
    - "Hibernate"
    - "Jakarta Persistence"
    - "Jakarta EE"
    - "Quarkus"
    - "Micronaut"

  version_sources:
    - "Maven compiler release"
    - "Maven compiler source and target"
    - "Maven toolchains"
    - "Gradle Java toolchain"
    - "Gradle sourceCompatibility and targetCompatibility"
    - ".java-version"
    - ".sdkmanrc"
    - "CI JDK setup"
    - "Docker build image"
    - "Docker runtime image"
    - "Kubernetes runtime configuration"
    - "Spring Boot parent or plugin version"
    - "dependency management platform or BOM"

preferred_commands:

  maven:
    - "./mvnw clean verify"
    - "./mvnw test"
    - "./mvnw dependency:tree"
    - "./mvnw dependency:analyze"
    - "./mvnw versions:display-dependency-updates"
    - "./mvnw help:effective-pom"

  gradle:
    - "./gradlew clean check"
    - "./gradlew test"
    - "./gradlew dependencies"
    - "./gradlew dependencyInsight"
    - "./gradlew javaToolchains"
    - "./gradlew buildEnvironment"

  compilation:
    - "compile with warnings enabled"
    - "treat selected compiler warnings as errors"
    - "validate annotation processing output"
    - "validate generated sources"

  static_analysis:
    - "SpotBugs"
    - "PMD"
    - "Checkstyle"
    - "Error Prone"
    - "SonarQube or SonarCloud"
    - "ArchUnit"
    - "jdeps"
    - "forbidden-apis"

  security:
    - "OWASP Dependency-Check"
    - "Snyk or equivalent SCA"
    - "Trivy filesystem scan"
    - "secret scanning"
    - "SBOM generation"

  testing:
    - "JUnit 5"
    - "Mockito"
    - "AssertJ"
    - "Testcontainers"
    - "Spring Boot integration tests"
    - "contract tests"
    - "mutation testing where appropriate"

  performance:
    - "JMH"
    - "Java Flight Recorder"
    - "jcmd"
    - "jstack"
    - "jmap"
    - "async-profiler"
    - "GC log analysis"

required_review:

  toolchain_and_build:
    - "Java version is explicit and consistent across local build, CI, containers, and production"
    - "compiler release is preferred over independently configured source and target"
    - "build tool and wrapper versions are pinned"
    - "Maven or Gradle wrapper is committed and used in CI"
    - "build is reproducible"
    - "dependency resolution is deterministic"
    - "annotation processors are explicitly declared"
    - "generated sources are not manually modified"
    - "preview language features are prohibited unless explicitly approved"
    - "multi-release JAR behavior is reviewed where applicable"
    - "module-path and classpath behavior are intentional"
    - "build profiles do not silently change production behavior"
    - "test skipping cannot occur accidentally in release pipelines"
    - "compiler warnings introduced by the change are reviewed"
    - "Docker build and runtime JDK versions are compatible"

  dependencies:
    - "new dependencies are justified"
    - "dependency versions are managed centrally where practical"
    - "Spring, Jakarta, Netty, Jackson, logging, and database driver versions are aligned"
    - "dependency convergence is validated"
    - "duplicate or conflicting transitive dependencies are reviewed"
    - "dependency exclusions are documented"
    - "SNAPSHOT and dynamic versions are prohibited in production releases"
    - "deprecated or unmaintained dependencies are avoided"
    - "known vulnerabilities are assessed for exploitability"
    - "security exceptions have an owner and expiration"
    - "dependency licenses are compatible"
    - "large dependencies are reviewed for startup, memory, and image-size impact"
    - "framework BOMs are preferred over ad hoc version combinations"
    - "major upgrades include migration and compatibility analysis"

  package_and_architecture:
    - "package boundaries reflect domain and ownership"
    - "business logic is not concentrated in controllers, listeners, or repositories"
    - "domain, application, infrastructure, and interface concerns remain separated"
    - "dependency direction follows the intended architecture"
    - "cyclic package and module dependencies are prohibited"
    - "shared utility packages do not become unbounded dependency hubs"
    - "framework-specific code is isolated from core domain logic where practical"
    - "public classes and methods are minimized"
    - "implementation details are package-private where possible"
    - "static mutable state is avoided"
    - "service locator patterns are prohibited"
    - "reflection-heavy designs require justification"
    - "architecture rules are enforced with tests where practical"

  language_and_type_safety:
    - "nullability is explicit at boundaries"
    - "Optional is used for return values where absence is expected"
    - "Optional is not used as an entity field, method parameter, or serialization field without justification"
    - "raw types are prohibited"
    - "unchecked casts are minimized and justified"
    - "generic bounds preserve type safety"
    - "equals and hashCode contracts are correct"
    - "compareTo is consistent with equals where required"
    - "mutable objects are not used as map keys"
    - "records are considered for immutable data carriers"
    - "sealed types are considered for closed hierarchies"
    - "switches over closed hierarchies are exhaustive"
    - "primitive types are preferred where boxing adds no value"
    - "BigDecimal is used for monetary values"
    - "BigDecimal scale and rounding mode are explicit"
    - "floating-point equality is not used incorrectly"
    - "date and time APIs use java.time"
    - "timezone semantics are explicit"
    - "legacy Date and Calendar APIs are avoided in new code"
    - "mutable collections are not exposed directly from public APIs"

  domain_modeling:
    - "domain invariants are enforced at creation and mutation boundaries"
    - "entities are not used as API request or response models"
    - "DTO, command, event, and persistence models have explicit responsibilities"
    - "identifiers use domain-specific types where valuable"
    - "value objects are immutable"
    - "business state transitions are explicit"
    - "invalid states are difficult to represent"
    - "domain services are used only when behavior does not belong to an entity or value object"
    - "business rules are testable without framework startup"
    - "persistence annotations do not dictate external API contracts"

  dependency_injection:
    - "constructor injection is used"
    - "field injection is prohibited"
    - "dependencies are explicit"
    - "optional dependencies are modeled intentionally"
    - "bean scopes are appropriate"
    - "singleton beans do not hold unsafe request-specific mutable state"
    - "circular dependencies are prohibited"
    - "conditional beans have deterministic activation"
    - "multiple implementations use explicit qualification"
    - "configuration classes do not perform heavy runtime work"
    - "bean initialization does not make uncontrolled network calls"
    - "framework proxies and self-invocation behavior are understood"
    - "lifecycle ownership of injected resources is clear"

  spring_framework:
    - "controller responsibilities are limited to protocol concerns"
    - "service methods own application use cases"
    - "repositories own persistence operations only"
    - "configuration properties are type-safe and validated"
    - "profile-based behavior is minimized"
    - "environment-specific behavior is explicit"
    - "Spring proxy limitations are considered"
    - "final methods and private methods are not assumed to be proxied"
    - "self-invocation does not bypass transactions, caching, security, or async behavior"
    - "@Async execution uses explicit managed executors"
    - "@Scheduled methods have overlap, failure, and idempotency behavior defined"
    - "application events are not mistaken for durable messaging"
    - "transaction-bound events use correct transaction phase"
    - "bean validation is applied at appropriate boundaries"
    - "actuator endpoints expose only approved information"
    - "graceful shutdown is configured and tested"

  configuration:
    - "configuration properties are validated at startup"
    - "required configuration fails fast"
    - "secrets are sourced from approved secret management"
    - "secret values are not committed"
    - "configuration precedence is understood"
    - "environment variables do not silently override critical behavior unexpectedly"
    - "defaults are safe for production"
    - "timeouts, pool sizes, retry counts, and limits are configurable"
    - "configuration units are explicit"
    - "duration and data-size types are used instead of ambiguous integers"
    - "deprecated configuration properties are not introduced"
    - "configuration changes are backward-compatible where required"
    - "sensitive configuration is not exposed through actuator or logs"

  persistence:
    - "JDBC, JPA, Hibernate, and repository operations have explicit ownership"
    - "database access occurs within appropriate service boundaries"
    - "entities do not escape persistence context unintentionally"
    - "session and EntityManager lifecycle is correct"
    - "Open Session in View is disabled or explicitly justified"
    - "lazy-loading behavior is understood"
    - "N+1 queries are prevented"
    - "fetch joins, entity graphs, projections, or batch fetching are used intentionally"
    - "eager associations are justified"
    - "repository methods return bounded result sets"
    - "pagination has deterministic ordering"
    - "repository.save inside large loops is prohibited unless evidence justifies it"
    - "bulk inserts and updates use batching"
    - "flush and clear frequency are controlled for large writes"
    - "batch jobs do not retain entire persistence contexts"
    - "JDBC resources are closed on every path"
    - "ResultSet, Statement, and Connection lifecycle is safe"
    - "database connection pool usage is bounded and observable"
    - "SQL and ORM-generated query plans are reviewed for critical paths"

  entity_modeling:
    - "entity identity strategy is explicit"
    - "equals and hashCode implementations are safe for transient and persisted entities"
    - "bidirectional associations are minimized"
    - "association ownership is correct"
    - "cascade behavior is explicitly reviewed"
    - "CascadeType.ALL is not used by default"
    - "orphanRemoval behavior is intentional"
    - "collections are initialized safely"
    - "entity constructors preserve invariants"
    - "entities do not expose public setters unnecessarily"
    - "database constraints back critical application invariants"
    - "enum persistence strategy is explicit"
    - "EnumType.STRING is preferred over ordinal persistence"
    - "large object loading is controlled"
    - "auditing fields are populated consistently"
    - "optimistic locking is considered for concurrent updates"

  transactions:
    - "transaction boundaries align with application use cases"
    - "transactions are as short as practical"
    - "external HTTP, messaging, or filesystem operations are avoided inside database transactions"
    - "transaction propagation is explicit when non-default behavior is used"
    - "REQUIRES_NEW usage is justified"
    - "readOnly transactions are not treated as an enforcement mechanism"
    - "transaction isolation matches business requirements"
    - "lock duration and contention are minimized"
    - "deadlock risk is evaluated"
    - "rollback behavior is explicit"
    - "checked and unchecked exception rollback behavior is understood"
    - "exceptions are not swallowed before transaction rollback"
    - "self-invocation does not bypass transactional proxies"
    - "transactional methods have appropriate visibility"
    - "bulk operations account for persistence-context staleness"
    - "flush timing is understood"
    - "nested transaction assumptions match the database and framework"
    - "transaction timeout is configured for long-running operations"
    - "distributed transactions are avoided unless explicitly required"

  data_consistency:
    - "concurrent updates cannot silently overwrite data"
    - "optimistic or pessimistic locking choice is justified"
    - "unique constraints prevent duplicates where required"
    - "idempotency is enforced at a durable boundary"
    - "check-then-act race conditions are avoided"
    - "database constraints remain authoritative"
    - "event publication and database commits cannot diverge silently"
    - "outbox pattern is considered for transactional message publication"
    - "eventual consistency behavior is documented"
    - "compensation behavior exists where atomicity is impossible"
    - "duplicate message processing is safe"
    - "retry behavior preserves consistency"

  concurrency:
    - "thread ownership is explicit"
    - "manual thread creation is avoided"
    - "managed ExecutorService or framework-managed executors are used"
    - "executor lifecycle and shutdown are defined"
    - "thread pools are not created per request"
    - "pool sizing reflects CPU-bound or I/O-bound workload"
    - "queue capacity is bounded"
    - "rejection policy is explicit"
    - "unbounded CompletableFuture execution on the common pool is avoided"
    - "blocking calls are not placed on event-loop threads"
    - "parallel streams are not used on request paths without justification"
    - "shared mutable state is synchronized or eliminated"
    - "lock ordering is consistent"
    - "lock scope is minimized"
    - "deadlock and starvation risks are evaluated"
    - "ThreadLocal values are removed"
    - "request context does not leak across pooled threads"
    - "interrupt status is preserved"
    - "InterruptedException is not swallowed"
    - "timeouts and cancellation propagate"
    - "virtual threads are evaluated only with library and pinning behavior understood"

  async_and_reactive:
    - "CompletableFuture failures are observed"
    - "async pipelines propagate exceptions"
    - "timeouts are explicit"
    - "cancellation behavior is defined"
    - "detached work has an owner"
    - "reactive pipelines do not contain blocking calls"
    - "blocking integrations use bounded schedulers"
    - "backpressure is preserved"
    - "reactive subscriptions are owned and disposed"
    - "context propagation is verified"
    - "reactive transactions use compatible transaction management"
    - "empty publisher, error publisher, and cancellation behavior are tested"
    - "reactive programming is not introduced where synchronous code is simpler and sufficient"

  scheduling_and_batch:
    - "scheduled job overlap is controlled"
    - "jobs are idempotent"
    - "job ownership is safe in multi-instance deployments"
    - "distributed locking is used only when necessary"
    - "missed and delayed executions have defined behavior"
    - "retry and backoff are bounded"
    - "batch size and chunk size are configurable"
    - "large datasets are processed in bounded chunks"
    - "checkpoint and restart behavior are defined"
    - "partial failure behavior is explicit"
    - "job metadata and execution status are observable"
    - "poison records do not block entire jobs indefinitely"
    - "job cancellation and shutdown behavior are supported"

  messaging:
    - "consumer delivery semantics are explicit"
    - "consumers tolerate duplicate delivery"
    - "idempotency is durable"
    - "acknowledgement timing is correct"
    - "message processing time aligns with visibility or session timeout"
    - "retry count and backoff are bounded"
    - "dead-letter behavior is configured"
    - "poison message behavior is explicit"
    - "ordering and partition assumptions are documented"
    - "consumer concurrency is bounded"
    - "consumer lag is observable"
    - "message schema compatibility is preserved"
    - "deserialization failures are handled safely"
    - "PII and secrets are not exposed in messages or logs"
    - "database and message operations do not assume unsupported atomicity"

  HTTP_clients:
    - "HTTP client instances are reused"
    - "connection pools are bounded"
    - "connection acquisition timeout is configured"
    - "connect, read, write, and overall request timeouts are explicit"
    - "response bodies are consumed or closed"
    - "retry behavior is limited to safe or idempotent operations"
    - "retries use bounded backoff with jitter"
    - "downstream status codes are mapped intentionally"
    - "TLS verification is enabled"
    - "redirect behavior is controlled"
    - "request and response sizes are bounded"
    - "sensitive headers and bodies are not logged"
    - "circuit breaker and bulkhead behavior are considered"
    - "client metrics expose pool saturation, errors, latency, and retries"

  API_and_serialization:
    - "request and response DTOs are separate from persistence entities"
    - "public schema changes are reviewed for backward compatibility"
    - "required fields are not added to existing contracts without versioning"
    - "field removal, rename, retype, or semantic change is treated as breaking"
    - "Jackson configuration is controlled centrally"
    - "unknown property behavior is intentional"
    - "null and absent field semantics are explicit"
    - "enum evolution is consumer-safe"
    - "date, time, timezone, and numeric formats are explicit"
    - "polymorphic deserialization is not enabled unsafely"
    - "Java native serialization is prohibited for untrusted data"
    - "serialVersionUID is managed for Serializable contracts where still required"
    - "error response shape is stable"
    - "internal exception details are not exposed"
    - "pagination and result sizes are bounded"

  validation:
    - "external input is validated at the boundary"
    - "Bean Validation constraints match documented contracts"
    - "validation groups are used only when they remain understandable"
    - "nested objects are validated"
    - "collection size and nesting depth are bounded"
    - "business validation is separate from syntactic validation"
    - "validation failures return stable machine-readable codes"
    - "database constraints reinforce critical validation"
    - "validation does not rely only on client-side behavior"
    - "untrusted serialized data is never assumed valid"

  exception_handling:
    - "exceptions are not swallowed"
    - "exceptions preserve cause"
    - "domain, validation, integration, and system failures remain distinguishable"
    - "exception translation occurs at clear boundaries"
    - "catching Exception or Throwable requires justification"
    - "Error types are not caught except at controlled process boundaries"
    - "interrupted exceptions preserve interrupt status"
    - "retryable errors are distinguishable"
    - "error messages do not expose secrets or internal details"
    - "global exception handlers produce consistent responses"
    - "fatal startup failures fail fast"
    - "partial success and cleanup failures are surfaced appropriately"

  resource_lifecycle:
    - "AutoCloseable resources use try-with-resources"
    - "streams, readers, writers, sockets, and files are closed"
    - "database connections and cursors are released"
    - "executors are shut down"
    - "scheduled tasks are cancelled on shutdown"
    - "listeners and callbacks are deregistered"
    - "ThreadLocal state is cleared"
    - "temporary files are removed"
    - "HTTP and messaging clients are closed only by their owning lifecycle"
    - "resources are not recreated per request unnecessarily"
    - "shutdown ordering prevents use-after-close"
    - "cleanup errors are handled when they affect correctness"

  memory_and_gc:
    - "collections, queues, buffers, and caches have bounds"
    - "static collections do not grow without lifecycle control"
    - "cache maximum size and expiration are explicit"
    - "cache keys and values do not retain unnecessary object graphs"
    - "listeners, classloaders, ThreadLocals, and executors do not leak"
    - "large byte arrays and strings are not retained unnecessarily"
    - "large request or response bodies are streamed"
    - "unbounded grouping or collecting operations are prohibited"
    - "heap impact of batching and parallel processing is reviewed"
    - "off-heap and direct buffer usage is bounded"
    - "finalizers are prohibited"
    - "Cleaner usage requires explicit ownership reasoning"
    - "GC tuning is based on production evidence"
    - "memory leak claims are supported by heap or allocation evidence"

  collections_and_streams:
    - "collection mutability is explicit"
    - "immutable collections are preferred for published state"
    - "stream pipelines remain readable"
    - "streams are not reused"
    - "side effects inside stream operations are avoided"
    - "parallel streams require evidence"
    - "large streams do not materialize unnecessary intermediate collections"
    - "collectors handle duplicate keys intentionally"
    - "ordering requirements are explicit"
    - "null elements are handled intentionally"
    - "concurrent collections are used only when their compound-operation semantics are correct"
    - "iteration over mutable collections is concurrency-safe"

  security:
    - "authentication is enforced at trusted server-side boundaries"
    - "authorization is enforced for every protected operation"
    - "object-level and tenant-level authorization are verified"
    - "Spring Security matcher ordering is reviewed"
    - "method security proxy limitations are understood"
    - "CSRF configuration matches application architecture"
    - "CORS is restrictive"
    - "SQL, JPQL, command, expression-language, template, path, LDAP, and header injection risks are reviewed"
    - "queries use parameters"
    - "untrusted input is not passed to shell execution"
    - "path traversal is prevented"
    - "SSRF is prevented"
    - "redirect targets are validated"
    - "unsafe deserialization is prohibited"
    - "XML external entities are disabled"
    - "TLS verification is enabled"
    - "approved cryptographic algorithms and providers are used"
    - "SecureRandom is used for security-sensitive randomness"
    - "passwords use approved adaptive hashing"
    - "tokens, credentials, cookies, authorization headers, PII, and regulated data are not logged"
    - "secrets are not embedded in source, configuration defaults, artifacts, or images"
    - "actuator and management endpoints are protected"
    - "rate limits and abuse controls are considered for public endpoints"

  logging:
    - "structured parameterized logging is used"
    - "string concatenation is avoided in log statements"
    - "expensive log arguments are guarded where needed"
    - "log levels match operational severity"
    - "exceptions are logged once at the correct boundary"
    - "stack traces are preserved for unexpected failures"
    - "correlation and trace identifiers are included"
    - "business identifiers are included only when safe"
    - "PII and secrets are redacted"
    - "high-cardinality or large payload logging is avoided"
    - "success paths do not generate excessive logs"
    - "audit logs are separated from diagnostic logs where required"
    - "logging configuration cannot expose debug data in production accidentally"

  observability:
    - "metrics cover throughput, latency, errors, and saturation"
    - "metrics include thread pools, executor queues, database pools, HTTP pools, and message lag where applicable"
    - "metric tags have bounded cardinality"
    - "distributed trace context propagates across synchronous and asynchronous boundaries"
    - "database and downstream spans are available"
    - "timeouts, retries, circuit-breaker transitions, and rejected work are observable"
    - "batch and scheduled job progress is observable"
    - "cache hit, miss, eviction, and size are observable"
    - "JVM heap, GC, CPU, threads, class loading, and safepoint behavior are observable"
    - "health and readiness indicators reflect actual service readiness"
    - "dependency failure does not always mark the process unhealthy unless required"
    - "startup and shutdown events are observable"
    - "alerts are actionable and linked to operational guidance"

  performance:
    - "performance-sensitive paths are identified"
    - "algorithmic complexity is appropriate"
    - "database round trips are minimized"
    - "remote calls are batched or parallelized safely"
    - "serialization cost is considered"
    - "reflection, proxies, and dynamic mapping overhead are considered in hot paths"
    - "object allocation is bounded on high-throughput paths"
    - "boxing and temporary collection creation are minimized where material"
    - "synchronization and contention are measured where relevant"
    - "connection and thread pool settings are coordinated"
    - "startup time and memory impact are reviewed for new dependencies"
    - "performance claims require benchmark, profile, or production telemetry evidence"
    - "JMH benchmarks follow correct benchmark methodology"
    - "microbenchmark results are not treated as end-to-end performance proof"

  JVM_runtime:
    - "heap settings align with container memory limits"
    - "MaxRAMPercentage and related container-aware settings are reviewed"
    - "memory is reserved for metaspace, threads, direct buffers, code cache, and native libraries"
    - "thread stack size impact is considered for high thread counts"
    - "garbage collector selection is justified"
    - "GC pause and throughput objectives are defined for critical services"
    - "OutOfMemoryError behavior is operationally defined"
    - "heap dumps are stored securely and have sufficient disk capacity"
    - "GC logging is enabled where operationally appropriate"
    - "JFR is available for production diagnostics where permitted"
    - "JVM flags are compatible with the deployed Java version"
    - "obsolete or experimental flags are not introduced"
    - "container CPU limits and available processors behavior are considered"

  startup_and_shutdown:
    - "startup validates required dependencies and configuration"
    - "startup does not block indefinitely"
    - "readiness is not reported before initialization completes"
    - "shutdown stops accepting new work"
    - "in-flight requests and jobs receive bounded drain time"
    - "message consumers stop receiving before dependency teardown"
    - "executors and schedulers shut down cleanly"
    - "database, HTTP, messaging, and telemetry resources close in safe order"
    - "shutdown is idempotent"
    - "shutdown hooks do not perform unbounded work"
    - "Kubernetes termination grace period matches application behavior"

  testing:
    - "unit tests cover meaningful business logic"
    - "integration tests cover framework and external boundaries"
    - "Testcontainers or production-compatible services are preferred over behaviorally incompatible mocks"
    - "transaction behavior is tested"
    - "rollback behavior is tested"
    - "database mappings and queries are tested"
    - "N+1 behavior is checked for critical paths"
    - "concurrency, duplicate execution, and idempotency are tested where applicable"
    - "timeouts, cancellation, retry, and circuit-breaker behavior are tested"
    - "authorization and tenant isolation are tested"
    - "serialization and contract compatibility are tested"
    - "resource cleanup and shutdown behavior are tested"
    - "tests do not rely on arbitrary Thread.sleep synchronization"
    - "time-dependent code uses Clock or controlled time"
    - "tests do not share unsafe mutable state"
    - "parallel test execution behavior is understood"
    - "production profile or production-like configuration is validated"
    - "build and static analysis pass before approval"

conditional_checks:

  - condition: "Spring Boot or Spring Framework changes"
    checks:
      - "application context startup test"
      - "bean scope and lifecycle review"
      - "configuration property validation"
      - "proxy and self-invocation review"
      - "actuator exposure review"
      - "graceful shutdown test"

  - condition: "JPA or Hibernate changes"
    checks:
      - "query-count and N+1 review"
      - "fetch strategy review"
      - "entity lifecycle review"
      - "transaction and flush behavior"
      - "batch persistence test"
      - "optimistic locking review"
      - "database execution plan review"

  - condition: "JDBC changes"
    checks:
      - "try-with-resources verification"
      - "transaction commit and rollback paths"
      - "connection pool behavior"
      - "statement timeout"
      - "result-set boundedness"
      - "SQL injection review"

  - condition: "transactional code changes"
    checks:
      - "propagation analysis"
      - "isolation analysis"
      - "rollback rules"
      - "self-invocation review"
      - "external-call-inside-transaction review"
      - "deadlock and lock-duration review"

  - condition: "concurrency, async, scheduler, or executor changes"
    checks:
      - "thread and task lifecycle review"
      - "pool and queue sizing rationale"
      - "shutdown and cancellation tests"
      - "deadlock and race analysis"
      - "ThreadLocal cleanup"
      - "blocking-call analysis"
      - "stress or concurrency tests"

  - condition: "virtual threads are introduced"
    checks:
      - "library compatibility review"
      - "synchronized and native pinning review"
      - "ThreadLocal usage review"
      - "database and downstream concurrency limits"
      - "load test with realistic blocking behavior"
      - "observability and thread dump behavior"

  - condition: "HTTP client or downstream integration changes"
    checks:
      - "connection pool review"
      - "timeout matrix"
      - "retry and idempotency analysis"
      - "response-body cleanup"
      - "circuit breaker and bulkhead review"
      - "dependency failure tests"

  - condition: "Kafka, ActiveMQ, RabbitMQ, SQS, or other messaging changes"
    checks:
      - "delivery and acknowledgement semantics"
      - "consumer concurrency"
      - "idempotency"
      - "retry and dead-letter handling"
      - "ordering assumptions"
      - "schema compatibility"
      - "consumer lag observability"

  - condition: "Spring Batch or large data-processing changes"
    checks:
      - "chunk size and transaction scope"
      - "restartability"
      - "checkpoint behavior"
      - "memory boundedness"
      - "flush and clear behavior"
      - "partial failure and skip policy"
      - "job concurrency control"

  - condition: "cache changes"
    checks:
      - "key design"
      - "maximum size"
      - "expiration"
      - "invalidation"
      - "stampede protection"
      - "multi-instance consistency"
      - "sensitive-data retention"

  - condition: "public API, event contract, or shared library changes"
    checks:
      - "binary compatibility"
      - "source compatibility"
      - "serialization compatibility"
      - "semantic versioning"
      - "consumer impact"
      - "deprecation and migration plan"

  - condition: "Java version, Spring Boot version, or major dependency changes"
    checks:
      - "release notes and migration guide review"
      - "removed and deprecated API review"
      - "Jakarta namespace compatibility"
      - "bytecode and runtime compatibility"
      - "dependency convergence"
      - "container and CI version alignment"
      - "full regression test"

  - condition: "memory, throughput, or latency-sensitive changes"
    checks:
      - "before-and-after benchmark"
      - "JFR or profiler evidence"
      - "allocation analysis"
      - "GC impact"
      - "thread and lock contention analysis"
      - "database and downstream contribution"
      - "load test"

  - condition: "security-sensitive or public-facing changes"
    checks:
      - "authentication tests"
      - "authorization and tenant-isolation tests"
      - "dependency vulnerability scan"
      - "injection and deserialization review"
      - "secret and PII logging review"
      - "rate-limit and abuse review"

reject_if:
  - "Java version conflicts across build, CI, container, or runtime"
  - "Maven or Gradle build fails"
  - "tests fail"
  - "static analysis reports unresolved correctness or security findings"
  - "dependency convergence is broken"
  - "SNAPSHOT or dynamic dependency is introduced into a production release"
  - "known exploitable dependency vulnerability is accepted without approved exception"
  - "field injection is introduced"
  - "circular dependency is introduced"
  - "business logic is placed directly in controllers or repositories without justification"
  - "static mutable state is introduced without safe lifecycle and concurrency control"
  - "entity is exposed directly through a public API"
  - "raw type or unsafe cast is introduced at a public or external boundary"
  - "monetary value uses double or float"
  - "timezone-dependent behavior relies on system default without explicit intent"
  - "database query result is unbounded"
  - "pagination lacks deterministic ordering"
  - "N+1 query is introduced"
  - "repository.save is used inside a large loop without measured justification"
  - "large persistence operation lacks batching and flush-clear control"
  - "JDBC resource can leak"
  - "transaction can complete without defined commit or rollback behavior"
  - "external network call is added inside a database transaction without justification"
  - "transactional self-invocation bypasses required behavior"
  - "deadlock or lost-update risk is unresolved"
  - "unbounded executor queue or concurrency is introduced"
  - "executor or scheduler can leak"
  - "common ForkJoinPool is used unintentionally for blocking work"
  - "InterruptedException is swallowed"
  - "ThreadLocal value can leak across pooled threads"
  - "blocking call is introduced on an event-loop or reactive scheduler"
  - "CompletableFuture or reactive failure can be silently ignored"
  - "scheduled or message-processing operation is non-idempotent where duplicate execution is possible"
  - "retry is unbounded"
  - "HTTP client lacks bounded timeouts"
  - "response body or connection can leak"
  - "cache, static collection, queue, buffer, or listener can grow without bound"
