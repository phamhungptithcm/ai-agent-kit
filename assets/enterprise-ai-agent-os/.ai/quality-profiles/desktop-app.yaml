version: 1

id: desktop-app

name: Desktop Application Quality Profile

description: 
  Mandatory engineering standards for desktop applications, native shells,
  installers, updaters, operating-system integrations, local persistence,
  background processes, and cross-platform desktop runtimes.
  Optimize for security, responsiveness, native platform behavior,
  update integrity, resource safety, accessibility, supportability,
  and predictable installation and rollback.

applies_when:
  - "desktop UI, application shell, window, dialog, tray, dock, menu, shortcut, notification, or desktop navigation changes"
  - "installer, package, auto-update, code signing, notarization, entitlement, sandbox, permission, or distribution changes"
  - "local filesystem, clipboard, drag-and-drop, protocol handler, deep link, file association, native process, shell command, IPC, or plugin integration changes"
  - "local settings, credentials, database, cache, migration, backup, restore, import, export, or user-data behavior changes"
  - "Electron, Tauri, WPF, WinUI, Windows App SDK, macOS SwiftUI, AppKit, Qt, JavaFX, or other native desktop runtime changes"
  - "startup, shutdown, background service, single-instance, crash recovery, suspend, resume, lock-screen, or operating-system lifecycle behavior changes"

goals:
  - "secure operating-system integration"
  - "responsive and accessible user experience"
  - "trusted installation and update delivery"
  - "explicit process and resource ownership"
  - "safe local data evolution"
  - "native platform consistency"
  - "cross-platform compatibility"
  - "long-running stability"
  - "diagnosable production behavior"
  - "reversible release and migration"

detect:

  files:
    - "package.json"
    - "electron.*"
    - "electron-builder.*"
    - "electron-forge.*"
    - "forge.config.*"
    - "tauri.conf.json"
    - "tauri.conf.json5"
    - "src-tauri/Cargo.toml"
    - "src-tauri/capabilities/**"
    - "*.csproj"
    - "*.fsproj"
    - "*.vbproj"
    - "*.sln"
    - "*.slnx"
    - "Directory.Build.props"
    - "Directory.Build.targets"
    - "Package.appxmanifest"
    - "app.manifest"
    - "Package.swift"
    - "*.xcodeproj"
    - "*.xcworkspace"
    - "Info.plist"
    - "*.entitlements"
    - "ExportOptions.plist"
    - "Cargo.toml"
    - "Cargo.lock"
    - "CMakeLists.txt"
    - "*.pro"
    - "*.pri"
    - "pom.xml"
    - "build.gradle"
    - "build.gradle.kts"
    - "module-info.java"
    - "jpackage.*"
    - "installer/**"
    - "packaging/**"

  frameworks:
    - "Electron"
    - "Tauri"
    - ".NET WPF"
    - ".NET WinUI"
    - "Windows App SDK"
    - "Windows Forms"
    - "macOS SwiftUI"
    - "AppKit"
    - "Qt"
    - "JavaFX"
    - "GTK"
    - "Avalonia"
    - "Flutter Desktop"
    - "native Windows"
    - "native macOS"
    - "native Linux"

  version_sources:
    - "package.json engines and dependencies"
    - "Electron runtime version"
    - "Tauri and Rust toolchain versions"
    - ".NET target framework"
    - "Windows App SDK version"
    - "Swift tools version"
    - "macOS deployment target"
    - "Xcode project settings"
    - "Qt version"
    - "Java toolchain and JavaFX version"
    - "CI build environment"
    - "installer toolchain"
    - "container or build image"
    - "distribution target configuration"

preferred_commands:

  repository:
    - "repository-defined build command"
    - "repository-defined test command"
    - "repository-defined packaging command"
    - "repository-defined lint and static-analysis command"

  electron:
    - "npm ci"
    - "npm test"
    - "npm run build"
    - "electron-builder --dir"
    - "electron-forge package"
    - "Electron security lint or audit"
    - "packaged application smoke test"

  tauri:
    - "cargo fmt --check"
    - "cargo clippy --all-targets --all-features"
    - "cargo test"
    - "cargo audit"
    - "tauri build"
    - "capability and permission review"

  dotnet:
    - "dotnet restore"
    - "dotnet build"
    - "dotnet test"
    - "dotnet publish"
    - "package manifest validation"
    - "MSIX packaging validation"

  macos:
    - "swift build"
    - "swift test"
    - "xcodebuild build"
    - "xcodebuild test"
    - "codesign --verify"
    - "spctl assessment"
    - "notarization status validation"
    - "entitlement inspection"

  qt:
    - "CMake configure and build"
    - "CTest"
    - "Qt Test"
    - "deployment tool validation"
    - "platform plugin packaging check"

  javafx:
    - "Maven or Gradle verification"
    - "JavaFX module validation"
    - "jlink image build"
    - "jpackage installer build"
    - "packaged runtime smoke test"

  packaging:
    - "installer dry run"
    - "upgrade over previous supported version"
    - "uninstall test"
    - "repair or reinstall test where supported"
    - "signature verification"
    - "package-content inspection"
    - "fresh-machine smoke test"

  runtime:
    - "manual UI smoke test"
    - "startup and shutdown test"
    - "multi-window lifecycle test"
    - "suspend and resume test where applicable"
    - "long-running memory and handle test"
    - "crash and recovery test"

required_review:

  platform_and_runtime:
    - "supported operating systems, architectures, and minimum versions are explicit"
    - "runtime and framework versions match build, CI, packaging, and distribution targets"
    - "platform-specific APIs are guarded appropriately"
    - "unsupported operating systems fail clearly"
    - "x64, ARM64, and other supported architecture behavior is validated"
    - "native dependencies are available for every supported platform and architecture"
    - "runtime redistribution requirements are understood"
    - "framework and OS end-of-support dates are considered"
    - "platform-specific differences are documented"
    - "shared implementation does not force non-native behavior without justification"

  architecture:
    - "presentation, application, domain, platform, and infrastructure concerns remain separated"
    - "UI code does not own low-level process, filesystem, or network implementation directly"
    - "platform integrations are isolated behind explicit adapters"
    - "cross-platform abstractions do not hide security-sensitive behavior"
    - "process boundaries are explicit"
    - "privileged operations are isolated"
    - "plugins and extensions have constrained interfaces"
    - "native API wrappers expose safe ownership semantics"
    - "shared state across windows or processes has clear ownership"
    - "business behavior remains testable independently of desktop shell startup"

  UI_thread:
    - "UI or main thread remains responsive"
    - "file, database, network, process, cryptographic, and heavy serialization work is not performed synchronously on the UI thread"
    - "CPU-intensive work uses appropriate background execution"
    - "background completion returns safely to the UI thread"
    - "cancellation is supported for long-running user operations"
    - "progress indication exists for perceptible operations"
    - "reentrancy is considered"
    - "nested event loops are avoided"
    - "modal operations do not create deadlock or starvation"
    - "synchronous IPC from the UI thread is avoided"
    - "render loops and layout operations remain bounded"
    - "UI freezes are observable or diagnosable"

  async_operations:
    - "background work has an explicit owner"
    - "task failures are observed"
    - "exceptions cross UI and background boundaries safely"
    - "cancellation propagates"
    - "timeouts exist for external operations"
    - "duplicate user actions do not start uncontrolled concurrent operations"
    - "commands and actions expose running and disabled states correctly"
    - "async shutdown does not abandon owned work"
    - "background work does not update destroyed windows or components"
    - "operation results are ignored safely when the initiating view no longer exists"

  windows_and_navigation:
    - "window ownership is explicit"
    - "child windows and dialogs have correct parent relationships"
    - "window creation and destruction do not leak resources"
    - "multi-window state remains consistent"
    - "close, minimize, hide, tray, and quit behavior is intentional"
    - "application exit behavior is consistent across platforms"
    - "window geometry restoration is bounded to visible displays"
    - "removed or disconnected monitor behavior is handled"
    - "full-screen and multi-monitor behavior is reviewed"
    - "focus restoration is predictable"
    - "unsaved work prompts are consistent"
    - "duplicate dialogs and windows are prevented"
    - "single-instance behavior is explicit"

  visual_behavior:
    - "layout supports supported display sizes"
    - "high-DPI and display scaling behavior is correct"
    - "text does not clip at increased font scale"
    - "window resizing preserves usability"
    - "minimum window size is justified"
    - "dark mode and system theme changes are handled"
    - "high-contrast mode is supported where applicable"
    - "reduced-motion preferences are respected"
    - "platform-native typography and spacing are considered"
    - "animations do not block interaction"
    - "rendering avoids excessive repaints, layout passes, or GPU usage"

  accessibility:
    - "keyboard-only operation is supported"
    - "tab and focus order are logical"
    - "visible focus indication exists"
    - "controls expose accessible names, roles, states, and values"
    - "screen-reader behavior is validated"
    - "menus, dialogs, toolbars, trees, tables, and custom controls are accessible"
    - "keyboard shortcuts have discoverable alternatives"
    - "shortcut conflicts with operating-system conventions are avoided"
    - "color is not the only status indicator"
    - "contrast is sufficient"
    - "dynamic changes are announced where appropriate"
    - "focus is restored after dialog and navigation changes"
    - "accessibility does not depend solely on embedded web content"

  keyboard_shortcuts:
    - "shortcuts follow platform conventions"
    - "system-reserved shortcuts are not overridden"
    - "shortcut scope is explicit"
    - "duplicate shortcut registration is prevented"
    - "shortcuts are disabled when their action is invalid"
    - "global shortcuts are justified"
    - "global shortcuts are unregistered during shutdown"
    - "user-configurable shortcuts validate conflicts"
    - "keyboard layout differences are considered"
    - "menu labels expose shortcut information correctly"

  menus_tray_and_dock:
    - "menus reflect current application state"
    - "disabled actions cannot execute through alternate paths"
    - "context menus validate selected target and permissions"
    - "tray behavior is consistent with quit behavior"
    - "tray resources are released"
    - "dock or taskbar integration is platform-appropriate"
    - "recent-document behavior does not expose sensitive paths"
    - "jump lists and dock menus do not retain stale commands"
    - "menu rebuilding does not leak native handles or listeners"
    - "background-only mode is explicit to the user"

  notifications:
    - "notifications require appropriate user permission"
    - "notification contents do not expose sensitive information unexpectedly"
    - "notification actions validate current application state"
    - "click handling does not trust unvalidated payloads"
    - "duplicate notifications are controlled"
    - "notification behavior while the app is closed or suspended is understood"
    - "platform notification identifiers are stable and bounded"
    - "notifications respect user and operating-system preferences"

  filesystem:
    - "platform-safe path APIs are used"
    - "path separators and case sensitivity are not assumed incorrectly"
    - "user-selected paths are treated as untrusted"
    - "path traversal is prevented"
    - "symbolic links and junctions are handled safely"
    - "canonicalization behavior is understood"
    - "file access is scoped to required locations"
    - "application data, cache, logs, temporary files, and user documents use correct OS directories"
    - "portable and installed modes do not mix storage unexpectedly"
    - "writes are atomic where corruption would matter"
    - "temporary files are created securely"
    - "temporary files and directories are cleaned up"
    - "file locking behavior is considered"
    - "concurrent reads and writes are coordinated"
    - "permissions and ownership are preserved appropriately"
    - "network and removable drives are treated as slow or unreliable"
    - "long paths and unsupported characters are handled"

  file_operations:
    - "large files are streamed"
    - "file size is validated before expensive processing"
    - "file format is validated by content where required, not only extension"
    - "malformed files fail safely"
    - "partial files and interrupted writes are handled"
    - "overwrite behavior requires intentional confirmation where appropriate"
    - "save operations use safe temporary-write and replace patterns"
    - "automatic recovery is considered for editable user content"
    - "recent files do not reference deleted or inaccessible content indefinitely"
    - "file watchers are disposed"
    - "watcher overflow and duplicate event behavior are handled"
    - "drag-and-drop files receive the same validation as file-picker input"

  file_associations:
    - "registered file types are explicitly scoped"
    - "open-with behavior handles malformed and malicious files"
    - "file association changes are reversible"
    - "installation and uninstall behavior is defined"
    - "multiple installed versions do not conflict"
    - "file-open events during startup are queued safely"
    - "file paths passed through shell integration are parsed safely"
    - "file association ownership is not stolen silently from other applications"

  clipboard:
    - "clipboard reads and writes are user-initiated where appropriate"
    - "sensitive values are not copied unintentionally"
    - "clipboard contents are validated before processing"
    - "HTML and rich-text clipboard formats are sanitized"
    - "clipboard polling is avoided or bounded"
    - "clipboard listeners are removed"
    - "large clipboard payloads do not cause excessive memory use"
    - "clipboard access failure does not block the UI"
    - "automatic clearing of highly sensitive values is considered"

  drag_and_drop:
    - "dropped files, URLs, text, and custom payloads are treated as untrusted"
    - "drop targets validate type and count"
    - "directory traversal and recursive expansion are bounded"
    - "large or remote file drops do not block the UI"
    - "drop effects accurately communicate behavior"
    - "drag sources do not expose sensitive internal data"
    - "temporary drag resources are released"

  URLs_and_navigation:
    - "untrusted URLs are parsed with a standard URL parser"
    - "allowed protocols are explicitly allowlisted"
    - "javascript, data, file, shell, and custom protocols are blocked unless explicitly required"
    - "external links open through a controlled OS integration"
    - "embedded browser navigation is constrained"
    - "redirect targets are validated"
    - "local file URLs do not expose arbitrary filesystem access"
    - "credentials and tokens are not placed in URLs"
    - "URL logging removes sensitive query and fragment data"
    - "download behavior is controlled"

  deep_links_and_protocol_handlers:
    - "custom protocol names are unique and stable"
    - "all deep-link payloads are treated as untrusted"
    - "host, path, query, fragment, size, and encoding are validated"
    - "deep links do not directly execute privileged actions"
    - "sensitive actions require user confirmation or authenticated application state"
    - "deep links received before initialization are queued safely"
    - "single-instance forwarding validates message origin and payload"
    - "protocol registration and removal are tested"
    - "multiple installed versions do not route links unpredictably"
    - "deep-link replay behavior is considered"

  shell_and_process_execution:
    - "shell invocation is avoided when direct process APIs are available"
    - "commands and arguments are separated"
    - "untrusted input is never concatenated into command text"
    - "executable paths are absolute or resolved through a trusted allowlist"
    - "PATH search behavior is not trusted for privileged operations"
    - "working directory is explicit"
    - "environment variables passed to child processes are minimized"
    - "secrets are not exposed through arguments or inherited environment"
    - "stdout and stderr are consumed without deadlock"
    - "output size is bounded"
    - "process timeout and cancellation are supported"
    - "child-process ownership is explicit"
    - "process trees are terminated when required"
    - "detached processes are justified"
    - "exit code and signal behavior are handled"
    - "privilege elevation requires explicit user interaction and justification"
    - "terminal or shell windows do not appear unexpectedly"

  IPC:
    - "IPC endpoints and message types are explicit"
    - "all IPC payloads are validated"
    - "requesting process or context is authenticated where possible"
    - "authorization is enforced per IPC operation"
    - "privileged capabilities are not exposed through generic invoke or execute endpoints"
    - "method names are allowlisted"
    - "arbitrary reflection or dynamic method invocation is prohibited"
    - "serialization size and depth are bounded"
    - "timeouts and cancellation exist"
    - "response and error shapes are stable"
    - "one-way messages have failure observability"
    - "subscriptions and handlers are removed"
    - "IPC channels do not leak internal objects"
    - "process crashes and restarts do not leave stale channels"
    - "cross-user IPC exposure is prevented"

  process_model:
    - "main, renderer, helper, plugin, worker, and service process responsibilities are explicit"
    - "privileged and unprivileged processes are separated"
    - "crash isolation is considered"
    - "process count is bounded"
    - "background process startup is justified"
    - "zombie and orphaned processes are prevented"
    - "process restart policy is bounded"
    - "process communication failure is handled"
    - "application quit terminates owned processes"
    - "separate user sessions cannot interfere"
    - "process-level logs include role and correlation context"

  Electron:
    - "contextIsolation is enabled"
    - "nodeIntegration is disabled in untrusted renderer content"
    - "sandboxing is enabled where compatible"
    - "remote module usage is prohibited"
    - "preload scripts expose a minimal typed API"
    - "contextBridge exposes no generic execution capability"
    - "webSecurity is not disabled"
    - "allowRunningInsecureContent is not enabled"
    - "navigation is restricted"
    - "new-window and external-open behavior is controlled"
    - "session permissions are explicitly handled"
    - "webview usage is avoided or tightly constrained"
    - "untrusted content cannot access privileged IPC"
    - "content security policy is restrictive"
    - "renderer crashes and reloads do not duplicate handlers"
    - "main-process synchronous blocking is avoided"
    - "Electron fuses and security hardening are reviewed"
    - "ASAR unpacking is minimized"
    - "DevTools are disabled or appropriately restricted in production"
    - "source maps do not expose sensitive source unintentionally"

  Tauri:
    - "capabilities follow least privilege"
    - "commands expose narrowly scoped operations"
    - "invoke payloads are validated"
    - "shell plugin permissions are minimized"
    - "filesystem scopes are restricted"
    - "URL and protocol permissions are restricted"
    - "allowlists or capability manifests do not expose unused APIs"
    - "Rust command errors are mapped safely"
    - "frontend input is not trusted because it originates locally"
    - "sidecar binaries are signed and integrity-checked"
    - "webview navigation is constrained"
    - "updater public keys and endpoints are protected"
    - "native plugins have explicit ownership and auditability"

  Windows:
    - "application manifest requirements are correct"
    - "requested execution level follows least privilege"
    - "UAC elevation is not used for routine operations"
    - "registry access scope is minimized"
    - "per-user versus per-machine installation is intentional"
    - "AppData, LocalAppData, ProgramData, and installation directories are used correctly"
    - "MSIX capabilities are minimized"
    - "Windows Defender and SmartScreen implications are considered"
    - "COM registration and cleanup are correct where used"
    - "URI and file association registration is reversible"
    - "Windows service installation requires explicit justification"
    - "named pipes and local IPC are access-controlled"
    - "long-path support is considered"
    - "high-DPI declarations match runtime behavior"
    - "Authenticode signing is validated"

  macOS:
    - "application sandbox status is explicit"
    - "entitlements are minimized"
    - "hardened runtime is enabled where required"
    - "code-signing identity and designated requirements are correct"
    - "notarization and stapling are validated"
    - "temporary exception entitlements are avoided"
    - "user-selected file access uses appropriate security-scoped access where required"
    - "Keychain access groups are minimized"
    - "network, camera, microphone, accessibility, automation, and file permissions are justified"
    - "privacy usage descriptions match actual behavior"
    - "launch agents and login items are explicitly approved"
    - "App Transport Security exceptions are minimized"
    - "bundle identifiers remain stable"
    - "quarantine and Gatekeeper behavior are tested"
    - "universal binary architecture support is validated"

  Linux:
    - "XDG directories are used appropriately"
    - "package format behavior is validated"
    - "desktop entry and MIME registration are reversible"
    - "Wayland and X11 behavior is considered"
    - "sandbox integration is reviewed for Flatpak or Snap"
    - "DBus interfaces are access-controlled"
    - "filesystem permission assumptions are portable"
    - "system package dependencies are declared"
    - "user-level and system-level installation are not mixed unexpectedly"
    - "desktop environment differences are handled gracefully"

  native_plugins:
    - "plugin trust model is explicit"
    - "plugin discovery locations are controlled"
    - "plugins are signed or verified where security requires"
    - "plugin API compatibility is versioned"
    - "plugins run with minimum required privileges"
    - "untrusted plugins are isolated where practical"
    - "plugin loading failures do not prevent safe startup"
    - "plugin unload and cleanup behavior is defined"
    - "plugins cannot bypass application authorization"
    - "plugin updates follow trusted delivery controls"
    - "plugin output and IPC payloads are validated"

  local_data:
    - "application data location is platform-appropriate"
    - "user documents are not mixed with internal application state"
    - "sensitive data is minimized"
    - "sensitive data is encrypted when required"
    - "encryption keys use platform credential storage where appropriate"
    - "tokens and credentials are not stored in plaintext"
    - "file permissions restrict other users"
    - "local databases use safe locking and transaction behavior"
    - "schema versions are explicit"
    - "corrupt data has recovery behavior"
    - "multiple running instances cannot corrupt shared state"
    - "portable mode data behavior is explicit"
    - "logout and account removal clean sensitive state"
    - "uninstall behavior for user data is documented"

  settings:
    - "settings have stable keys and types"
    - "defaults are safe"
    - "unknown settings do not cause startup failure"
    - "settings writes are atomic"
    - "concurrent settings updates are coordinated"
    - "settings migrations are versioned"
    - "deprecated settings have removal strategy"
    - "sensitive settings use protected storage"
    - "settings corruption has recovery behavior"
    - "user-modifiable configuration is validated"
    - "enterprise-managed settings precedence is documented where applicable"

  data_migration:
    - "migration source and target versions are explicit"
    - "migrations are ordered and idempotent where practical"
    - "migration is restartable or safely recoverable"
    - "backup is created before destructive migration where needed"
    - "migration failure does not leave partially valid state"
    - "older application versions cannot silently corrupt migrated data"
    - "forward and backward compatibility are considered"
    - "downgrade behavior is explicit"
    - "large migrations show progress and remain cancellable only when safe"
    - "migration telemetry avoids sensitive contents"
    - "migration is tested with representative historical versions"

  import_export:
    - "imported files are untrusted"
    - "schema and version are validated"
    - "archive extraction prevents traversal"
    - "size, file count, and nesting are bounded"
    - "import does not overwrite existing data without clear policy"
    - "partial import behavior is explicit"
    - "exported data excludes secrets and internal-only fields"
    - "export files have stable version metadata"
    - "sensitive exports require explicit user action"
    - "temporary import and export files are cleaned up"

  authentication:
    - "local authentication state is protected"
    - "browser-based login uses secure callback handling"
    - "OAuth state, nonce, and PKCE behavior are correct where applicable"
    - "tokens are stored in platform-protected credential storage"
    - "refresh and expiry behavior is defined"
    - "logout revokes or removes credentials appropriately"
    - "multiple account state remains isolated"
    - "deep links cannot complete authentication without state validation"
    - "embedded web login is avoided when system browser is required"
    - "offline access behavior is explicit"

  privacy:
    - "telemetry and crash reporting are disclosed appropriately"
    - "sensitive local paths and filenames are minimized in diagnostics"
    - "clipboard, recent-files, notifications, and logs do not expose private data unexpectedly"
    - "analytics identifiers are scoped and rotated appropriately"
    - "user consent and opt-out behavior are respected where required"
    - "screen capture and accessibility permissions are justified"
    - "privacy-sensitive permissions are requested only when needed"
    - "data deletion behavior is documented"
    - "diagnostic bundles allow user review or safe redaction where practical"

  network:
    - "TLS verification is enabled"
    - "certificate pinning is used only with a safe rotation strategy"
    - "proxy behavior is compatible with supported enterprise environments"
    - "offline and intermittent connectivity are handled"
    - "request timeouts are configured"
    - "retry is bounded and idempotent"
    - "large downloads are streamed"
    - "partial downloads resume or restart safely"
    - "download integrity is verified where required"
    - "network calls do not block UI execution"
    - "authentication headers and payloads are not logged"
    - "local network discovery is explicitly approved"
    - "server certificate and hostname errors fail safely"

  offline_behavior:
    - "offline capabilities are explicit"
    - "cached data freshness is communicated"
    - "queued offline work is bounded"
    - "reconnection does not duplicate operations"
    - "conflict resolution behavior is defined"
    - "offline edits cannot silently overwrite newer remote state"
    - "authentication expiry while offline is handled"
    - "recovery after long offline periods is tested"
    - "sensitive cached data remains protected"

  auto_update:
    - "update metadata and packages are cryptographically verified"
    - "update channel is explicit"
    - "stable, beta, enterprise, and internal channels do not mix"
    - "update source uses trusted transport"
    - "update signing keys have rotation and recovery plans"
    - "updates cannot downgrade security unintentionally"
    - "rollback or roll-forward behavior is defined"
    - "failed updates leave a runnable application"
    - "partial downloads are handled safely"
    - "update installation does not corrupt user data"
    - "update checks have timeout and retry behavior"
    - "forced-update policy is justified"
    - "update prompts do not interrupt unsafe workflow states"
    - "background update behavior is visible and supportable"
    - "minimum supported version enforcement is coordinated with backend compatibility"
    - "updater privileges are minimized"
    - "update packages are not writable by untrusted users"

  downgrade:
    - "downgrade support is explicit"
    - "older versions do not open incompatible data silently"
    - "settings and database version checks prevent corruption"
    - "server compatibility with older clients is understood"
    - "rollback package remains trusted and available"
    - "downgrade limitations are communicated"
    - "emergency rollback does not require destructive user-data deletion"

  signing:
    - "application binaries are signed"
    - "installer and update artifacts are signed"
    - "all nested binaries and helper tools are signed where required"
    - "signing identity matches distribution requirements"
    - "signature verification is automated"
    - "signing credentials are protected"
    - "signing occurs in a controlled CI or release environment"
    - "timestamping is configured where applicable"
    - "certificate expiration is monitored"
    - "certificate rotation does not break updates"
    - "unsigned development artifacts cannot be promoted accidentally"

  notarization:
    - "notarization is required for applicable macOS distribution"
    - "notarization result is verified"
    - "ticket stapling is performed where appropriate"
    - "all nested code satisfies hardened runtime and signing requirements"
    - "entitlement changes are reviewed before notarization"
    - "notarization credentials are protected"
    - "notarized package is the exact artifact distributed"

  sandbox_and_entitlements:
    - "sandbox policy is explicit"
    - "permissions follow least privilege"
    - "new entitlement or capability has a documented user-facing requirement"
    - "temporary or broad entitlements require approval"
    - "filesystem access scopes are narrow"
    - "network client and server permissions are distinct"
    - "camera, microphone, location, accessibility, automation, and screen access are requested only when required"
    - "permission denial behavior is usable"
    - "permission request occurs in context"
    - "permission changes include upgrade behavior"
    - "sandbox exceptions do not create hidden privileged channels"

  installer:
    - "installer scope is explicit"
    - "per-user installation is preferred unless machine-wide installation is required"
    - "administrative privileges are not requested unnecessarily"
    - "install location is appropriate"
    - "installer does not overwrite unrelated files"
    - "installer validates available disk space"
    - "installer handles locked files and running instances"
    - "installer upgrade path preserves user data"
    - "installer downgrade behavior is explicit"
    - "installer failure rolls back partial installation where possible"
    - "uninstall removes owned binaries, services, protocol registrations, and shortcuts"
    - "uninstall does not remove user-created data without explicit policy"
    - "repair and reinstall behavior is defined where supported"
    - "multiple installed channels and versions do not conflict"
    - "silent installation parameters are secure and documented"
    - "enterprise deployment compatibility is considered"

  packaging:
    - "package includes only required files"
    - "debug artifacts and development secrets are excluded"
    - "source maps and symbols follow release policy"
    - "native binaries match target architecture"
    - "licenses and notices are included"
    - "package identifiers and versions are correct"
    - "package contents are reproducible where practical"
    - "package size impact is reviewed"
    - "runtime dependencies are included or declared"
    - "package metadata matches displayed application identity"
    - "install and update artifacts are immutable"
    - "release artifact provenance is retained"

  versioning:
    - "application versioning strategy is consistent"
    - "package, binary, updater, and displayed versions agree"
    - "build number and semantic version responsibilities are explicit"
    - "data migration uses a separate explicit schema version where appropriate"
    - "update ordering compares versions correctly"
    - "pre-release versions do not replace stable releases unintentionally"
    - "server compatibility rules reference client version safely"
    - "version parsing is not locale-dependent"

  startup:
    - "startup path is bounded"
    - "critical configuration and local data are validated"
    - "network access does not block initial UI indefinitely"
    - "startup work is deferred when not required for first interaction"
    - "migration and recovery states are visible"
    - "corrupt configuration does not create a crash loop"
    - "single-instance lock behavior is safe"
    - "startup from file association, protocol handler, login item, and normal launch is tested"
    - "crash during previous startup has safe recovery behavior"
    - "startup performance regressions are measured for material changes"

  shutdown:
    - "new work stops before resource teardown"
    - "unsaved work behavior is explicit"
    - "background tasks receive bounded completion or cancellation time"
    - "listeners, timers, workers, watchers, sockets, clients, databases, and processes are closed"
    - "telemetry flush is bounded"
    - "shutdown order is safe"
    - "forced shutdown behavior is understood"
    - "shutdown is idempotent"
    - "tray and background modes do not bypass required cleanup"
    - "operating-system shutdown and logout events are handled"

  suspend_resume:
    - "timers and network assumptions survive suspend and resume"
    - "stale authentication and connections are refreshed"
    - "sleep duration and clock jumps are considered"
    - "background operations do not assume continuous execution"
    - "sensitive views respond appropriately to lock and unlock"
    - "audio, camera, screen, and hardware resources are reacquired safely"
    - "resume does not duplicate listeners, workers, or scheduled tasks"
    - "long suspend does not cause uncontrolled retry bursts"

  crash_recovery:
    - "unexpected termination does not corrupt user data"
    - "atomic writes or journals protect critical state"
    - "crash loops are detected"
    - "safe mode or reset behavior is available where appropriate"
    - "recovery files have lifecycle and privacy controls"
    - "user-facing recovery guidance is actionable"
    - "failed plugin or extension loading can be isolated"
    - "crash during migration has recovery behavior"
    - "crash reporting preserves enough context without exposing sensitive data"

  resource_lifecycle:
    - "every file, stream, socket, database, handle, process, worker, timer, listener, observer, native object, and IPC channel has an owner"
    - "cleanup occurs on success, failure, cancellation, window close, application shutdown, and process crash where possible"
    - "native handles are released deterministically"
    - "shared clients and pools are not recreated per operation"
    - "framework lifecycle hooks are used correctly"
    - "window recreation does not duplicate global listeners"
    - "reload and hot-restart behavior does not leak resources"
    - "cleanup is idempotent"
    - "garbage collection is not relied upon for operating-system resource release"
    - "resource counts return to baseline after repeated workflows"

  memory:
    - "long-running session memory reaches a stable state"
    - "window open-close cycles do not retain destroyed views"
    - "renderer or webview reload does not accumulate handlers"
    - "image and media decoding memory is bounded"
    - "large files and payloads are streamed"
    - "caches have maximum size and eviction"
    - "clipboard, drag-drop, recent-file, and preview caches are bounded"
    - "static or global objects do not retain user sessions or windows"
    - "native and GPU memory are considered in addition to managed heap"
    - "memory pressure behavior is defined"
    - "background and minimized states do not retain unnecessary large resources"
    - "heap, handle, thread, and process counts are observable for critical workflows"

  rendering_and_GPU:
    - "hardware acceleration behavior is intentional"
    - "GPU fallback behavior is usable"
    - "GPU crashes do not create an unrecoverable application loop"
    - "large textures, canvases, images, and video surfaces are disposed"
    - "rendering resources are released when windows close"
    - "animation and redraw frequency are bounded"
    - "high-resolution displays do not cause uncontrolled allocation"
    - "remote desktop and virtual machine rendering behavior is considered"
    - "disabling GPU acceleration requires evidence and documented impact"

  performance:
    - "startup time impact is reviewed"
    - "time to first usable interaction is reviewed"
    - "UI input latency remains acceptable"
    - "window creation time is reviewed"
    - "file open and save performance is reviewed"
    - "network and local database operations are profiled where material"
    - "CPU, memory, GPU, disk, and background usage are bounded while idle"
    - "minimized and background modes reduce unnecessary work"
    - "performance claims have measurement evidence"
    - "platform-specific performance is not inferred from one operating system"
    - "package size and update size impact are reviewed"

  power_and_battery:
    - "background polling is minimized"
    - "high-frequency timers are justified"
    - "idle CPU usage is low"
    - "network reconnect loops are bounded"
    - "GPU usage while idle is reviewed"
    - "prevent-sleep behavior requires explicit user value"
    - "battery-sensitive operations respond to platform state where appropriate"
    - "background mode does not perform unnecessary work"

  security:
    - "local execution is not treated as a trusted boundary"
    - "all files, URLs, deep links, clipboard data, IPC messages, plugin data, and imported content are untrusted"
    - "command injection is prevented"
    - "path traversal is prevented"
    - "unsafe deserialization is prohibited"
    - "web content is sandboxed and constrained"
    - "authentication and authorization are enforced for privileged actions"
    - "privilege escalation paths are reviewed"
    - "credentials use platform-protected storage"
    - "secrets are not embedded in binaries, packages, configuration, logs, crash reports, or source maps"
    - "TLS verification is enabled"
    - "sensitive temporary files are protected"
    - "updates, plugins, sidecars, and native binaries have integrity verification"
    - "operating-system permission prompts match actual usage"
    - "diagnostic interfaces are disabled or protected in production"
    - "debug ports are not exposed"
    - "local servers bind to loopback unless broader exposure is explicitly required"
    - "local server requests include authentication or unpredictable capability tokens where needed"
    - "cross-origin and origin validation are applied to embedded web content"

  local_server:
    - "local HTTP or socket server is justified"
    - "binding address is constrained"
    - "port selection avoids unsafe predictable exposure where relevant"
    - "requests are authenticated"
    - "origin and host headers are validated"
    - "CSRF and DNS rebinding risks are considered"
    - "request size and rate are bounded"
    - "server stops during shutdown"
    - "multiple application instances do not conflict"
    - "firewall prompts and network exposure are understood"

  logging:
    - "structured logs include application version, platform, operation, and outcome"
    - "logs avoid credentials, tokens, document contents, clipboard data, and sensitive paths"
    - "usernames and full local paths are redacted where not necessary"
    - "log rotation and retention are bounded"
    - "log location is platform-appropriate"
    - "debug logging is not enabled by default in production"
    - "multiple processes include process-role context"
    - "logs remain usable after partial startup failures"
    - "users can locate or export diagnostics safely"
    - "log collection does not require administrator access unnecessarily"

  crash_reporting:
    - "crash reporting is enabled only according to product and privacy policy"
    - "reports include application version, platform, architecture, and process role"
    - "reports exclude secrets and sensitive user content"
    - "native symbols and source maps match the released artifact"
    - "crash-report upload failure does not affect application stability"
    - "offline reports have bounded storage"
    - "user consent and opt-out behavior are respected where required"
    - "renderer, helper, plugin, and main-process crashes are distinguishable"
    - "crash reports correlate with update and migration versions"

  observability:
    - "startup, shutdown, update, migration, and crash events are observable"
    - "UI hangs and long-running operations are diagnosable"
    - "memory, handle, thread, process, and connection growth are observable where practical"
    - "update success, failure, rollback, and version adoption are measurable"
    - "installer success and failure are supportable"
    - "IPC failures are observable"
    - "background service and helper process state is observable"
    - "telemetry dimensions remain bounded"
    - "diagnostic collection is user- and privacy-safe"
    - "support documentation references log and diagnostic locations"

  testing:
    - "unit tests cover non-UI business logic"
    - "UI automation covers critical desktop workflows"
    - "manual smoke testing covers changed native integrations"
    - "fresh installation is tested"
    - "upgrade from supported previous versions is tested"
    - "downgrade or rollback is tested where supported"
    - "uninstall behavior is tested"
    - "signed packaged artifact is tested, not only development mode"
    - "supported operating systems and architectures receive representative testing"
    - "high-DPI and accessibility behavior are tested"
    - "offline and intermittent network behavior are tested"
    - "suspend and resume are tested where relevant"
    - "single-instance and multi-window behavior are tested"
    - "malformed file, URL, deep-link, IPC, and import payloads are tested"
    - "resource counts stabilize after repeated open-close or start-stop workflows"
    - "installer and update failure paths are tested"
    - "crash recovery and corrupted-local-state behavior are tested"

conditional_checks:

  - condition: "Electron application changes"
    checks:
      - "context isolation"
      - "Node.js integration boundary"
      - "sandbox configuration"
      - "preload API review"
      - "IPC allowlist and validation"
      - "navigation and external-link controls"
      - "content security policy"
      - "renderer reload leak test"
      - "Electron security hardening review"

  - condition: "Tauri application changes"
    checks:
      - "capability and permission review"
      - "command exposure review"
      - "filesystem and shell scope review"
      - "sidecar integrity"
      - "updater signing-key review"
      - "webview navigation restrictions"
      - "Rust resource and error-lifecycle review"

  - condition: ".NET WPF, WinUI, Windows Forms, or Avalonia changes"
    checks:
      - "dispatcher and UI-thread review"
      - "async void usage review"
      - "event-handler deregistration"
      - "IDisposable and IAsyncDisposable ownership"
      - "binding and observable-subscription cleanup"
      - "native handle lifecycle"
      - "MSIX or installer validation"
      - "Authenticode signature verification"

  - condition: "macOS SwiftUI or AppKit changes"
    checks:
      - "main-actor and UI-thread review"
      - "window and scene lifecycle"
      - "NotificationCenter observer cleanup"
      - "Combine task and subscription cleanup"
      - "AppKit bridge ownership"
      - "entitlement and sandbox review"
      - "code-signing and notarization validation"
      - "Apple silicon and universal binary testing"

  - condition: "Qt changes"
    checks:
      - "QObject parent ownership"
      - "signal and slot lifecycle"
      - "thread-affinity review"
      - "event-loop blocking review"
      - "native plugin deployment"
      - "platform plugin packaging"
      - "high-DPI behavior"
      - "object deletion and worker shutdown"

  - condition: "JavaFX changes"
    checks:
      - "JavaFX application thread review"
      - "Task and Service lifecycle"
      - "listener and binding cleanup"
      - "stage and scene lifecycle"
      - "native resource cleanup"
      - "jlink runtime validation"
      - "jpackage installer test"

  - condition: "file system, import, export, file association, or drag-and-drop changes"
    checks:
      - "path traversal"
      - "symbolic link and junction behavior"
      - "size and count limits"
      - "malformed input"
      - "atomic write behavior"
      - "permission and locking behavior"
      - "cleanup of temporary files"
      - "slow and remote filesystem behavior"

  - condition: "shell command, native process, sidecar, or helper changes"
    checks:
      - "direct process API instead of shell"
      - "argument separation"
      - "executable trust and integrity"
      - "environment-variable exposure"
      - "timeout and cancellation"
      - "output bounds"
      - "process-tree cleanup"
      - "privilege review"

  - condition: "IPC or deep-link changes"
    checks:
      - "schema validation"
      - "authentication and authorization"
      - "operation allowlist"
      - "payload bounds"
      - "replay behavior"
      - "startup queuing"
      - "error and timeout behavior"
      - "malicious payload tests"

  - condition: "installer or packaging changes"
    checks:
      - "fresh install"
      - "upgrade over supported previous version"
      - "uninstall"
      - "repair or reinstall where supported"
      - "running-application handling"
      - "signature verification"
      - "artifact content inspection"
      - "user-data preservation"
      - "partial failure rollback"

  - condition: "auto-update changes"
    checks:
      - "metadata signature verification"
      - "package signature verification"
      - "channel separation"
      - "partial download handling"
      - "failed installation recovery"
      - "rollback or roll-forward"
      - "signing-key rotation"
      - "migration compatibility"
      - "minimum supported version behavior"

  - condition: "code-signing, notarization, entitlement, sandbox, or permission changes"
    checks:
      - "least-privilege review"
      - "signature verification"
      - "nested binary validation"
      - "certificate expiry and rotation"
      - "notarization or platform trust validation"
      - "permission denial behavior"
      - "upgrade behavior"
      - "distribution-channel compatibility"

  - condition: "local database, settings, cache, or user-data changes"
    checks:
      - "schema and format versioning"
      - "backup"
      - "migration"
      - "rollback and downgrade"
      - "corruption recovery"
      - "multi-instance locking"
      - "credential and sensitive-data protection"
      - "representative historical-data tests"

  - condition: "long-running process, tray application, background service, or worker changes"
    checks:
      - "resource steady-state test"
      - "memory and native-handle profile"
      - "listener, timer, worker, and process cleanup"
      - "idle CPU and battery use"
      - "suspend and resume"
      - "network reconnect behavior"
      - "shutdown and operating-system logout behavior"

  - condition: "UI, window, menu, shortcut, tray, or accessibility changes"
    checks:
      - "keyboard-only navigation"
      - "screen-reader validation"
      - "high-DPI and scaling"
      - "multi-monitor behavior"
      - "theme and high-contrast behavior"
      - "focus restoration"
      - "platform shortcut conventions"
      - "window open-close leak test"

  - condition: "embedded web content or webview changes"
    checks:
      - "navigation allowlist"
      - "content security policy"
      - "origin isolation"
      - "privileged bridge exposure"
      - "download behavior"
      - "external URL handling"
      - "cookie and storage isolation"
      - "untrusted-content sandboxing"

  - condition: "public release or distribution change"
    checks:
      - "signed release artifact"
      - "notarization or platform trust verification"
      - "fresh-machine smoke test"
      - "installer and updater validation"
      - "version metadata verification"
      - "release provenance"
      - "crash-symbol or source-map publication"
      - "support and rollback readiness"

reject_if:
  - "UI or main thread performs blocking network, file, database, process, or heavy compute work"
  - "long-running user operation lacks cancellation or progress behavior"
  - "background task can update a destroyed window or component"
  - "window, view, renderer, webview, listener, timer, worker, process, or native handle can leak"
  - "resource ownership is ambiguous"
  - "application memory or native resource count grows monotonically during repeated representative workflows"
  - "shell command includes unsanitized or concatenated user-controlled input"
  - "untrusted executable path or PATH resolution is used for privileged process execution"
  - "child process can become orphaned or block indefinitely"
  - "IPC exposes generic command execution, reflection, filesystem, shell, or privileged capability"
  - "IPC, deep-link, file-open, clipboard, drag-drop, or plugin payload is trusted without validation"
  - "path traversal, archive traversal, symbolic-link escape, or unsafe overwrite is possible"
  - "application writes sensitive data with unsafe permissions"
  - "credential, token, key, or secret is stored in plaintext without approved justification"
  - "embedded web content can access privileged native APIs without isolation"
  - "Electron context isolation is disabled without explicit approved justification"
  - "Electron renderer enables Node.js integration for untrusted content"
  - "web security or TLS verification is disabled"
  - "local server binds publicly without explicit approval and authentication"
  - "custom protocol handler can directly trigger privileged action without validation and authorization"
  - "plugin or sidecar binary is loaded or updated without trust or integrity controls"
  - "application, installer, helper, updater, or nested executable lacks required signature"
  - "auto-update path is unsigned, unverifiable, or vulnerable to downgrade"
  - "update signing key has no rotation or recovery strategy"
  - "failed update can leave no runnable application"
  - "installer or updater change lacks upgrade and failure-recovery evidence"
  - "installer requests administrator access without necessity"
  - "uninstall removes user-created data without explicit documented behavior"
  - "data migration can leave partially valid or unrecoverable user state"
  - "older application version can silently corrupt newer migrated data"
  - "destructive migration has no backup, rollback, or compensation strategy"
  - "sandbox, entitlement, permission, or capability is broader than required"
  - "privacy-sensitive permission is requested without user-facing need"
  - "code-signing or notarization requirement is bypassed"
  - "release artifact tested differs from artifact distributed"
  - "debug port, DevTools, diagnostic server, or privileged development interface is exposed in production"
  - "logs, crash reports, telemetry, notifications, recent-files, or clipboard behavior exposes secrets or sensitive user data"
  - "file, database, socket, worker, or background-process operation can block application shutdown indefinitely"
  - "startup can enter an unrecoverable crash loop due to invalid local state"
  - "application claims cross-platform support without validating affected platform-specific behavior"
  - "installer, updater, signing, notarization, entitlement, or packaging validation is claimed without execution evidence"

preferred_patterns:
  - "thin platform adapters around native APIs"
  - "strict separation between privileged and unprivileged processes"
  - "typed and narrowly scoped IPC"
  - "allowlisted native commands"
  - "direct process execution without shell interpretation"
  - "platform-protected credential storage"
  - "atomic local-file writes"
  - "versioned local-data migrations"
  - "signed immutable installers and updates"
  - "per-user installation where machine-wide scope is unnecessary"
  - "least-privilege entitlements and capabilities"
  - "responsive UI with cancellable background work"
  - "deterministic resource cleanup"
  - "stable single-instance coordination"
  - "native platform menus, shortcuts, and accessibility"
  - "safe mode and crash recovery"
  - "bounded caches, workers, listeners, timers, and local queues"
  - "same signed artifact promoted through release channels"
  - "fresh-machine and upgrade-path testing"
  - "observable startup, migration, update, crash, and shutdown behavior"

deliverables:
  - "supported platform, architecture, runtime, and framework summary"
  - "desktop process and privilege-boundary summary"
  - "UI-thread and responsiveness assessment"
  - "window, navigation, tray, menu, shortcut, and accessibility assessment"
  - "filesystem, clipboard, deep-link, protocol, shell, process, and IPC security assessment"
  - "local settings, credentials, database, cache, and migration assessment"
  - "resource ownership, cleanup, memory, handle, worker, and process-lifecycle assessment"
  - "installer, package, signing, notarization, entitlement, and sandbox assessment"
  - "auto-update integrity, channel, migration, rollback, and recovery assessment"
  - "startup, shutdown, suspend, resume, crash, and single-instance behavior"
  - "platform-specific behavior and limitations"
  - "privacy, logging, crash-reporting, and supportability impact"
  - "build, test, package, installer, signature, notarization, update, and smoke-test evidence"
  - "release and rollback plan"
  - "unresolved risks, owners, and required approvals"

review_output:

  required_sections:
    - "Change summary"
    - "Platform and runtime detection"
    - "Architecture and process boundaries"
    - "UI responsiveness and accessibility"
    - "OS integrations"
    - "Filesystem, process, deep-link, and IPC security"
    - "Local data and migration"
    - "Resource lifecycle and long-running stability"
    - "Installer and packaging"
    - "Signing, notarization, sandbox, and permissions"
    - "Auto-update and rollback"
    - "Startup, shutdown, and crash recovery"
    - "Observability and supportability"
    - "Testing and distribution evidence"
    - "Unresolved risks"
    - "Decision"

  decision:
    allowed_values:
      - "APPROVE"
      - "APPROVE_WITH_CONDITIONS"
      - "REJECT"
      - "INCOMPLETE"

    requirements:
      - "cite source, configuration, build, package, signature, notarization, installer, update, runtime, test, or profiling evidence"
      - "do not claim a packaged application works based only on development-mode execution"
      - "do not claim signing, notarization, installer, updater, or platform behavior passed unless it was validated"
      - "identify every privileged process, IPC command, entitlement, capability, protocol handler, and shell execution path affected"
      - "identify the owner and cleanup path for every native resource, worker, listener, timer, window, process, and IPC channel affected"
      - "state which operating systems and architectures were actually tested"
      - "distinguish shared cross-platform behavior from platform-specific inference"
      - "identify upgrade, downgrade, rollback, and local-data compatibility limitations"
      - "require explicit human approval for release signing, publication, production update rollout, privileged installation, or destructive local-data migration"

