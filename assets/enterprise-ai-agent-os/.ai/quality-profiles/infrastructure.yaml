version: 1

id: infrastructure

name: Infrastructure Engineering Quality Profile

description: 
  Mandatory engineering standards for infrastructure-as-code, cloud resources,
  Kubernetes, containers, networking, identity, secrets, CI/CD, and runtime
  platform changes. Optimize for least privilege, reliability, reproducibility,
  drift control, cost efficiency, observability, and safe deployment.

applies_when:
  - "Terraform, OpenTofu, Terragrunt, CloudFormation, Pulumi, CDK, Bicep, Helm, Kustomize, Kubernetes, Docker, or cloud infrastructure changes"
  - "IAM, secrets, certificates, networking, DNS, load balancers, storage, queues, databases, caches, or runtime platform configuration changes"
  - "container images, orchestration, autoscaling, resource allocation, service discovery, ingress, egress, or environment wiring changes"
  - "CI/CD, GitOps, deployment automation, artifact promotion, environment protection, or release infrastructure changes"
  - "infrastructure plan, preview, apply, destroy, import, state migration, drift, rollback, or production behavior changes"

goals:
  - "least privilege"
  - "safe and reversible change"
  - "high availability"
  - "fault isolation"
  - "reproducible infrastructure"
  - "controlled drift"
  - "secure secret management"
  - "bounded cost and capacity"
  - "production observability"
  - "environment consistency"

detect:

  files:
    - "*.tf"
    - "*.tf.json"
    - "*.tfvars"
    - "*.tfvars.json"
    - ".terraform.lock.hcl"
    - "terragrunt.hcl"
    - "**/terragrunt.hcl"
    - "Pulumi.yaml"
    - "Pulumi.*.yaml"
    - "Pulumi.*.json"
    - "cdk.json"
    - "cdk.context.json"
    - "template.yaml"
    - "template.yml"
    - "cloudformation*.yaml"
    - "cloudformation*.yml"
    - "Chart.yaml"
    - "Chart.lock"
    - "values.yaml"
    - "values-*.yaml"
    - "kustomization.yaml"
    - "kustomization.yml"
    - "*.k8s.yaml"
    - "*.k8s.yml"
    - "Dockerfile"
    - "Dockerfile.*"
    - "docker-compose.yaml"
    - "docker-compose.yml"
    - "compose.yaml"
    - "compose.yml"
    - ".dockerignore"
    - ".github/workflows/*.yaml"
    - ".github/workflows/*.yml"
    - ".gitlab-ci.yml"
    - "Jenkinsfile"
    - "azure-pipelines.yaml"
    - "azure-pipelines.yml"
    - "argocd/*.yaml"
    - "argocd/*.yml"
    - "flux-system/**"
    - "policy/**"
    - "policies/**"

  tools:
    - "Terraform"
    - "OpenTofu"
    - "Terragrunt"
    - "Pulumi"
    - "AWS CDK"
    - "CloudFormation"
    - "AWS SAM"
    - "Azure Bicep"
    - "Kubernetes"
    - "Helm"
    - "Kustomize"
    - "Docker"
    - "Argo CD"
    - "Flux"
    - "GitHub Actions"
    - "GitLab CI"
    - "Jenkins"

  version_sources:
    - "Terraform required_version"
    - "Terraform required_providers"
    - ".terraform.lock.hcl"
    - "OpenTofu version configuration"
    - "Pulumi project and plugin versions"
    - "CDK package versions"
    - "CloudFormation transform version"
    - "Kubernetes apiVersion"
    - "Helm Chart.yaml apiVersion and dependencies"
    - "container base image tag or digest"
    - "CI action and runner versions"
    - "deployment platform version"
    - "cluster Kubernetes version"

preferred_commands:

  terraform:
    - "terraform fmt -check -recursive"
    - "terraform init -backend=false"
    - "terraform validate"
    - "terraform plan -out=<plan-file>"
    - "terraform show -json <plan-file>"
    - "terraform providers lock"

  opentofu:
    - "tofu fmt -check -recursive"
    - "tofu init -backend=false"
    - "tofu validate"
    - "tofu plan -out=<plan-file>"
    - "tofu show -json <plan-file>"

  terragrunt:
    - "terragrunt hclfmt --check"
    - "terragrunt validate"
    - "terragrunt plan"
    - "terragrunt run-all plan"

  cloudformation:
    - "aws cloudformation validate-template"
    - "cfn-lint"
    - "CloudFormation change set review"

  cdk:
    - "cdk synth"
    - "cdk diff"
    - "cdk-nag"

  pulumi:
    - "pulumi preview"
    - "pulumi policy validate"

  kubernetes:
    - "kubectl apply --dry-run=server"
    - "kubectl diff"
    - "kubeconform"
    - "kubeval"
    - "kube-linter"
    - "polaris audit"
    - "conftest test"

  helm:
    - "helm lint"
    - "helm dependency build"
    - "helm template"
    - "helm diff upgrade"
    - "helm unittest"

  kustomize:
    - "kustomize build"
    - "kubectl kustomize"
    - "kubectl apply --dry-run=server"

  containers:
    - "docker build"
    - "docker buildx build"
    - "hadolint"
    - "trivy image"
    - "grype"
    - "syft"
    - "docker scout"

  security:
    - "checkov"
    - "tfsec"
    - "terrascan"
    - "conftest"
    - "OPA policy checks"
    - "secret scanning"
    - "software composition analysis"

  cost:
    - "infracost"
    - "cloud provider cost estimate"
    - "quota and service-limit review"

  drift:
    - "terraform plan against current state"
    - "GitOps reconciliation status"
    - "cloud configuration drift detection"
    - "CloudFormation drift detection"

required_review:

  change_scope:
    - "affected resources, services, accounts, subscriptions, clusters, regions, and environments are identified"
    - "change scope is derived from plan or preview output where available"
    - "blast radius is explicit"
    - "production and non-production impact are separated"
    - "shared infrastructure dependencies are identified"
    - "downstream application and consumer impact is documented"
    - "cross-account and cross-region effects are reviewed"
    - "implicit changes caused by provider or module upgrades are identified"
    - "resource replacement, recreation, or forced update behavior is highlighted"
    - "uncertain or unknown plan values are called out explicitly"

  execution_safety:
    - "plan or preview is generated before apply"
    - "apply uses reviewed immutable artifacts where supported"
    - "production changes require explicit human authorization"
    - "apply scope is constrained to the intended environment"
    - "targeted apply is avoided except for documented recovery scenarios"
    - "parallelism settings do not overload providers or dependencies"
    - "maintenance window requirements are identified"
    - "deployment ordering is documented"
    - "partial apply behavior is considered"
    - "interrupted apply recovery is documented"
    - "manual console changes required by the rollout are prohibited or documented"
    - "change ownership and escalation path are defined"

  destructive_changes:
    - "destroy, replacement, recreation, data loss, and downtime risks are explicitly identified"
    - "deletion protection is enabled for critical resources"
    - "prevent_destroy or equivalent safeguards are considered"
    - "retention policies are reviewed"
    - "stateful resource replacement has a migration plan"
    - "database, storage, queue, and identity resource replacement is treated as high risk"
    - "resource rename and address movement use state migration where appropriate"
    - "create-before-destroy is considered when safe"
    - "downtime duration and user impact are documented"
    - "rollback limitations for destructive changes are explicit"

  rollback_and_recovery:
    - "rollback, roll-forward, or compensation strategy is documented"
    - "rollback does not assume deleted stateful data can be recreated"
    - "previous configuration and artifact versions are recoverable"
    - "database or data migrations are coordinated with infrastructure rollback"
    - "DNS, certificate, and networking rollback propagation delay is considered"
    - "failed deployment cleanup is documented"
    - "backup or snapshot availability is verified before high-risk changes"
    - "recovery steps have clear execution criteria"
    - "rollback is tested or rehearsed for critical infrastructure where practical"
    - "rollback ownership and approval requirements are defined"

  state_management:
    - "remote state is used for shared environments"
    - "state locking is enabled where supported"
    - "state backend availability and durability are appropriate"
    - "state is encrypted at rest and in transit"
    - "state access follows least privilege"
    - "state files are treated as sensitive"
    - "state is not committed to source control"
    - "state migration steps are documented"
    - "resource import and removal commands are reviewed"
    - "moved blocks or equivalent state migration mechanisms are preferred"
    - "workspace or environment selection cannot accidentally target production"
    - "state recovery and backup procedures exist"
    - "state drift and orphaned resources are reviewed"

  drift_and_reconciliation:
    - "desired state remains defined in version control"
    - "out-of-band changes are detected"
    - "manual changes are either reverted or imported into code"
    - "GitOps reconciliation behavior is understood"
    - "self-healing automation cannot undo emergency changes unexpectedly"
    - "ignored changes are minimized and justified"
    - "drift detection frequency is appropriate"
    - "provider defaults are not relied on when they can create drift"
    - "resource ownership conflicts between tools are prohibited"
    - "shared resources have one authoritative controller"

  identity_and_access:
    - "IAM follows least privilege"
    - "wildcard actions and resources are prohibited unless justified"
    - "administrative and privileged roles are tightly scoped"
    - "human and workload identities are separated"
    - "long-lived static credentials are avoided"
    - "temporary credentials and workload identity are preferred"
    - "service accounts are dedicated per workload where practical"
    - "role assumption trust policies are constrained"
    - "cross-account access is explicit"
    - "permission boundaries and organizational controls are considered"
    - "privilege escalation paths are reviewed"
    - "iam:PassRole or equivalent permissions are restricted"
    - "anonymous and unauthenticated access is prohibited unless explicitly approved"
    - "break-glass access is controlled and audited"
    - "access changes are auditable"

  secrets_and_keys:
    - "secret values are never committed to source control"
    - "secret values are not embedded in plans, logs, outputs, images, or CI artifacts"
    - "secret references are used instead of plaintext values"
    - "secret stores use encryption and access control"
    - "secret rotation behavior is documented"
    - "rotation does not require avoidable downtime"
    - "certificate and key expiry are monitored"
    - "private keys are not distributed unnecessarily"
    - "Kubernetes Secrets are not treated as encrypted merely because they are base64 encoded"
    - "secret mounts and environment variables are reviewed for exposure risk"
    - "Terraform outputs containing sensitive data are marked sensitive"
    - "KMS key policies follow least privilege"
    - "key deletion windows and rotation settings are reviewed"
    - "secret recovery and revocation procedures exist"

  networking:
    - "network exposure is private by default"
    - "public ingress requires explicit justification"
    - "ingress is restricted by source, port, protocol, and destination"
    - "egress is restricted where feasible"
    - "security groups and firewall rules avoid broad CIDR ranges"
    - "0.0.0.0/0 and ::/0 access is treated as high risk"
    - "network segmentation and trust boundaries are preserved"
    - "private endpoints are preferred for managed services"
    - "load balancer listener and target configuration are reviewed"
    - "TLS is enforced for external and sensitive internal traffic"
    - "DNS changes include TTL and propagation analysis"
    - "network ACL, route table, gateway, NAT, and proxy impacts are reviewed"
    - "IPv4 and IPv6 behavior is intentional"
    - "service mesh policy changes are reviewed"
    - "network policy exists for Kubernetes workloads where required"
    - "health-check source ranges and ports are allowed intentionally"
    - "SSRF and metadata-service exposure are considered"

  encryption:
    - "encryption at rest is enabled for stateful and sensitive resources"
    - "encryption in transit is enforced"
    - "customer-managed keys are used where policy requires"
    - "key ownership, rotation, deletion, and recovery are documented"
    - "unencrypted snapshots, backups, logs, and replicas are prohibited"
    - "TLS versions and cipher policies meet organizational standards"
    - "certificate hostname and trust-chain behavior are correct"
    - "internal plaintext traffic is justified where allowed"
    - "encryption changes account for existing data and replicas"

  availability_and_resilience:
    - "single points of failure are identified"
    - "availability zone distribution is intentional"
    - "regional dependency assumptions are documented"
    - "failure domains are isolated"
    - "autoscaling does not depend on a single unavailable metric"
    - "managed-service high-availability settings are reviewed"
    - "load balancer health checks reflect actual readiness"
    - "failover behavior and recovery time objectives are documented"
    - "recovery point objectives are documented for stateful systems"
    - "cross-zone, cross-region, or multi-cluster replication is justified by requirements"
    - "dependency outages degrade safely"
    - "thundering-herd behavior during recovery is considered"
    - "capacity exists during instance, zone, or node failure"
    - "chaos or failure testing is considered for critical services"

  backup_and_disaster_recovery:
    - "backup scope and schedule are defined"
    - "backup retention meets recovery and compliance requirements"
    - "backup encryption is enabled"
    - "backup access follows least privilege"
    - "restore procedures are documented"
    - "restore has been tested for critical systems"
    - "snapshots are application-consistent where required"
    - "cross-account or cross-region backup copies are considered"
    - "deletion of primary resources does not automatically delete all backups"
    - "disaster recovery dependencies are identified"
    - "infrastructure code can recreate required platform dependencies"
    - "RTO and RPO changes are documented"

  capacity_and_quotas:
    - "expected baseline and peak capacity are documented"
    - "service quotas are reviewed"
    - "regional and account-level limits are considered"
    - "resource requests and limits match observed workload behavior"
    - "autoscaling minimum, maximum, and target values are justified"
    - "scaling lag and cold-start impact are considered"
    - "scale-down behavior does not disrupt active workloads"
    - "queue, storage, connection, thread, and worker capacity are bounded"
    - "capacity supports failover scenarios"
    - "quota increase lead time is considered"
    - "resource exhaustion has alerts and operational response"

  cost:
    - "monthly and usage-based cost impact is estimated"
    - "large cost increases require explicit approval"
    - "cost drivers are identified"
    - "autoscaling has a defined upper bound"
    - "log, metric, trace, network egress, snapshot, and backup costs are reviewed"
    - "idle and orphaned resource risk is considered"
    - "reserved capacity, savings plans, or committed use are considered where appropriate"
    - "storage lifecycle and retention policies control long-term cost"
    - "cross-region and cross-zone traffic costs are reviewed"
    - "NAT gateway and public egress cost is reviewed"
    - "managed-service tier selection is justified"
    - "cost allocation tags or labels are present"
    - "cost anomaly detection is considered"

  tagging_and_metadata:
    - "required ownership tags are present"
    - "environment tags are present"
    - "application or service tags are present"
    - "cost-center tags are present where required"
    - "data classification tags are present where required"
    - "managed-by metadata identifies the authoritative tool"
    - "resource names and tags follow conventions"
    - "tags propagate to dependent resources where supported"
    - "temporary resources include expiration or cleanup metadata"

  observability:
    - "infrastructure health metrics exist"
    - "application and platform metrics are distinguishable"
    - "logs are enabled for security and operationally critical resources"
    - "log retention is defined"
    - "audit logging is enabled"
    - "network flow logging is considered"
    - "load balancer, gateway, DNS, IAM, and data-access logs are reviewed"
    - "metrics and logs do not expose secrets"
    - "alerts exist for availability, saturation, errors, and capacity"
    - "alerts are actionable and linked to runbooks"
    - "dashboard changes reflect new infrastructure behavior"
    - "telemetry cardinality and cost are bounded"
    - "monitoring exists before production traffic is introduced"
    - "deployment and configuration changes are traceable"

  operations:
    - "runbooks are updated when operational behavior changes"
    - "on-call ownership is clear"
    - "manual operational steps are minimized"
    - "operational commands are safe, scoped, and auditable"
    - "maintenance procedures are documented"
    - "known failure modes and recovery actions are documented"
    - "alerts have severity and escalation criteria"
    - "supporting dashboards and queries are referenced"
    - "production access requirements are explicit"
    - "routine operations do not require broad administrative access"

  environment_management:
    - "environment-specific values are isolated"
    - "shared modules remain environment-agnostic where practical"
    - "production configuration cannot be selected accidentally"
    - "non-production environments approximate production architecture where risk requires"
    - "intentional environment differences are documented"
    - "configuration promotion is traceable"
    - "environment overrides do not bypass security controls"
    - "test resources cannot access production data"
    - "account, subscription, project, and cluster boundaries are enforced"
    - "naming prevents cross-environment collisions"

  provider_and_module_management:
    - "provider versions are constrained"
    - "provider lock files are committed"
    - "provider upgrades are reviewed for behavior changes"
    - "module versions are pinned"
    - "module source is trusted"
    - "module upgrade changelogs are reviewed"
    - "modules expose safe defaults"
    - "module outputs do not expose sensitive data unnecessarily"
    - "modules do not create unrelated resources"
    - "forked or vendored modules have an ownership and update strategy"
    - "deprecated arguments and resources are removed through planned migration"
    - "provider aliases and account targeting are explicit"

  terraform_and_opentofu:
    - "resource addresses remain stable"
    - "for_each is preferred over count when identity must remain stable"
    - "count or collection reordering cannot cause unintended replacement"
    - "computed and unknown values are handled safely"
    - "depends_on is used only for real hidden dependencies"
    - "lifecycle ignore_changes is minimized and justified"
    - "data sources do not create unstable plans"
    - "sensitive outputs are marked"
    - "variables have types, descriptions, and validation where appropriate"
    - "locals improve clarity rather than hide complexity"
    - "dynamic blocks are used only when they improve maintainability"
    - "provider configuration is not duplicated unnecessarily"
    - "resource timeouts are reviewed for long-running operations"
    - "imports and moved blocks are included for existing resources"
    - "plan output is reviewed for create, update, replace, and destroy actions"

  kubernetes:
    - "supported apiVersion is used"
    - "deprecated Kubernetes APIs are not introduced"
    - "namespace ownership is explicit"
    - "CPU and memory requests are defined"
    - "CPU and memory limits are reviewed"
    - "startup, readiness, and liveness probes have correct semantics"
    - "liveness probes do not cause restart loops during dependency outages"
    - "PodDisruptionBudget is considered"
    - "replica count supports availability requirements"
    - "topology spread and pod anti-affinity are considered"
    - "node affinity, taints, and tolerations are intentional"
    - "HorizontalPodAutoscaler metrics and bounds are justified"
    - "VerticalPodAutoscaler interaction is reviewed where used"
    - "rolling update surge and unavailable values are safe"
    - "terminationGracePeriodSeconds matches shutdown behavior"
    - "preStop hooks do not exceed termination grace period"
    - "service account token mounting is disabled when unnecessary"
    - "securityContext follows least privilege"
    - "containers do not run as root unless approved"
    - "privileged mode and host namespace access are prohibited unless approved"
    - "read-only root filesystem is considered"
    - "Linux capabilities are dropped by default"
    - "seccomp profile is configured where supported"
    - "NetworkPolicy is reviewed"
    - "secrets are externally managed where appropriate"
    - "ConfigMap and Secret updates have known rollout behavior"
    - "emptyDir and ephemeral storage use is bounded"
    - "persistent volume access mode and reclaim policy are reviewed"
    - "ingress and gateway annotations are validated"
    - "resource names, selectors, and labels remain compatible"
    - "workloads have safe disruption and eviction behavior"

  helm:
    - "chart renders successfully for every supported environment"
    - "values schema is defined where practical"
    - "required values fail clearly"
    - "default values are safe"
    - "environment values do not contain secrets"
    - "template whitespace and indentation are valid"
    - "resource names remain stable"
    - "hooks are minimized and have cleanup policies"
    - "hook execution is idempotent"
    - "CRD installation and upgrade behavior is explicit"
    - "chart dependencies are pinned"
    - "rollback limitations are documented"
    - "helm diff is reviewed for production changes"

  containers:
    - "base images are pinned to immutable digest for production where practical"
    - "base image source is trusted"
    - "minimal runtime image is used"
    - "multi-stage builds separate build and runtime dependencies"
    - "container runs as a non-root user"
    - "privileged execution is prohibited unless approved"
    - "package manager caches and build artifacts are removed"
    - "secrets are not copied into image layers"
    - "build secrets use secure secret mounts"
    - "image contains only required runtime files"
    - "health check behavior is appropriate for the platform"
    - "signal handling and PID 1 behavior are correct"
    - "container shutdown is graceful"
    - "filesystem write requirements are explicit"
    - "image vulnerability findings are reviewed"
    - "critical and high vulnerabilities require remediation or documented exception"
    - "software bill of materials is generated where required"
    - "image provenance and signing are considered"
    - "image tag mutability is controlled"
    - ".dockerignore excludes unnecessary and sensitive files"

  ci_cd:
    - "pipeline permissions follow least privilege"
    - "CI uses workload identity or short-lived credentials"
    - "third-party actions and plugins are pinned"
    - "production deployment requires environment protection"
    - "plan and apply responsibilities are separated where appropriate"
    - "the reviewed plan artifact is the artifact applied"
    - "secrets are masked and scoped"
    - "forked pull requests cannot access production secrets"
    - "artifact provenance is preserved"
    - "build and deployment artifacts are immutable"
    - "promotion reuses the same artifact across environments"
    - "deployment concurrency is controlled"
    - "rollback workflow is documented"
    - "pipeline failure cannot leave locks or partial state indefinitely"
    - "manual approval cannot be bypassed through alternate workflows"
    - "branch and tag protections match release policy"

  gitops:
    - "Git is the authoritative desired-state source"
    - "direct production mutations are prohibited except documented emergencies"
    - "reconciliation scope is constrained"
    - "sync waves and dependency ordering are explicit"
    - "automatic pruning is reviewed carefully"
    - "self-heal behavior is intentional"
    - "secret integration does not store plaintext in Git"
    - "rollback uses version-controlled state"
    - "failed reconciliation is observable"
    - "emergency changes have a reconciliation and follow-up process"
    - "multiple controllers do not manage the same resource"

  data_and_stateful_services:
    - "data durability requirements are explicit"
    - "storage class and volume type match workload requirements"
    - "backup and restore are configured"
    - "encryption is enabled"
    - "replication and failover behavior are reviewed"
    - "maintenance and upgrade windows are considered"
    - "deletion protection is enabled"
    - "parameter and engine version changes are reviewed"
    - "connection and throughput limits are understood"
    - "storage autoscaling and maximum capacity are bounded"
    - "snapshot retention and final snapshot behavior are explicit"
    - "in-place upgrade versus replacement behavior is known"
    - "application compatibility is validated before engine upgrades"

  queues_and_event_platforms:
    - "retention period is appropriate"
    - "dead-letter handling is configured"
    - "redrive policy is bounded"
    - "visibility timeout or acknowledgement deadline matches processing behavior"
    - "ordering and partition assumptions are documented"
    - "encryption and access control are enabled"
    - "consumer lag and queue depth are observable"
    - "capacity and throughput quotas are reviewed"
    - "message loss and duplicate delivery expectations are explicit"
    - "cross-account publishing and consuming permissions are constrained"

  compliance_and_governance:
    - "resource locations comply with data residency requirements"
    - "retention policies meet legal and regulatory requirements"
    - "audit trails are enabled"
    - "mandatory encryption and key ownership controls are applied"
    - "public exposure exceptions are documented"
    - "policy-as-code exceptions have owner, reason, and expiration"
    - "data classification drives access and logging controls"
    - "infrastructure changes preserve required evidence"
    - "resource deletion follows retention and legal hold requirements"

  testing:
    - "syntax and static validation pass"
    - "plan, preview, diff, or rendered manifests are reviewed"
    - "policy-as-code checks pass"
    - "module or component tests cover critical logic"
    - "container image builds successfully"
    - "rendered Kubernetes manifests pass schema validation"
    - "non-production deployment is tested for high-risk changes"
    - "failure and rollback paths are tested where practical"
    - "backup restore is tested for critical stateful resources"
    - "autoscaling behavior is validated for critical workloads"
    - "security controls are validated, not only declared"
    - "production readiness checks are completed before traffic cutover"

conditional_checks:

  - condition: "Terraform or OpenTofu changes"
    checks:
      - "format validation"
      - "initialization without production backend access where possible"
      - "configuration validation"
      - "provider lockfile review"
      - "plan review"
      - "state and resource address impact"
      - "policy-as-code checks"
      - "cost estimate"

  - condition: "provider or module version changes"
    checks:
      - "release notes and upgrade guide review"
      - "deprecated and removed behavior review"
      - "lockfile change review"
      - "full environment plan"
      - "implicit default changes"
      - "rollback compatibility"

  - condition: "stateful resource changes"
    checks:
      - "backup verification"
      - "restore procedure"
      - "replacement and data-loss analysis"
      - "RTO and RPO impact"
      - "deletion protection"
      - "rollback limitation review"

  - condition: "IAM or access policy changes"
    checks:
      - "privilege escalation analysis"
      - "wildcard action and resource review"
      - "trust policy review"
      - "cross-account access review"
      - "permission boundary review"
      - "negative authorization tests"

  - condition: "networking, DNS, ingress, egress, firewall, or load balancer changes"
    checks:
      - "public exposure analysis"
      - "source and destination scope review"
      - "TLS configuration"
      - "DNS TTL and propagation plan"
      - "health-check behavior"
      - "rollback propagation timing"
      - "connectivity test"

  - condition: "Kubernetes workload changes"
    checks:
      - "server-side dry run"
      - "manifest schema validation"
      - "resource request and limit review"
      - "probe behavior"
      - "security context"
      - "rollout and disruption settings"
      - "autoscaling behavior"
      - "network policy"
      - "graceful termination"

  - condition: "Helm changes"
    checks:
      - "helm lint"
      - "template rendering for every supported environment"
      - "helm diff"
      - "values schema validation"
      - "hook behavior"
      - "rollback behavior"

  - condition: "container image changes"
    checks:
      - "Dockerfile lint"
      - "image build"
      - "vulnerability scan"
      - "secret and sensitive layer scan"
      - "SBOM generation"
      - "non-root execution"
      - "image size comparison"
      - "startup and shutdown test"

  - condition: "production-facing public endpoint changes"
    checks:
      - "explicit exposure approval"
      - "WAF or equivalent protection review"
      - "DDoS protection review"
      - "TLS and certificate validation"
      - "authentication and authorization review"
      - "rate-limit and abuse protection"
      - "access logging"
      - "external connectivity test"

  - condition: "autoscaling changes"
    checks:
      - "minimum and maximum capacity"
      - "metric availability and delay"
      - "scale-up and scale-down behavior"
      - "cost ceiling"
      - "dependency capacity"
      - "load or scaling test"

  - condition: "database, cache, queue, or managed data service changes"
    checks:
      - "version and parameter compatibility"
      - "backup and restore"
      - "encryption"
      - "failover behavior"
      - "quota and throughput"
      - "maintenance impact"
      - "application connection behavior"

  - condition: "CI/CD or GitOps changes"
    checks:
      - "credential scope"
      - "third-party action pinning"
      - "environment protection"
      - "artifact immutability"
      - "promotion strategy"
      - "production approval path"
      - "rollback workflow"
      - "controller ownership and reconciliation behavior"

  - condition: "high-risk or broad production change"
    checks:
      - "phased rollout"
      - "canary or blue-green strategy"
      - "maintenance window"
      - "rollback rehearsal"
      - "on-call coverage"
      - "post-deployment validation"
      - "enhanced monitoring window"

reject_if:
  - "secret, credential, token, private key, or sensitive value appears in source-controlled IaC or configuration"
  - "secret can be exposed through plan output, logs, outputs, container layers, or CI artifacts"
  - "production apply, destroy, import, state mutation, or cluster mutation is attempted autonomously"
  - "public network exposure lacks explicit approval and documented protection"
  - "0.0.0.0/0 or ::/0 ingress is introduced without explicit justification"
  - "privileged IAM wildcard lacks evidence-based justification"
  - "privilege escalation path is introduced"
  - "long-lived static cloud credentials are introduced without approved exception"
  - "destructive replacement lacks migration, backup, and rollback or compensation plan"
  - "critical stateful resource lacks deletion protection"
  - "state file is stored locally for a shared environment"
  - "remote state lacks required encryption or locking"
  - "state or resource ownership is shared by conflicting controllers"
  - "local Terraform replace directive is committed for production use"
  - "provider or module version is unbounded"
  - "production image uses an untrusted or mutable base image without justification"
  - "container runs privileged or as root without explicit approval"
  - "container image contains secrets or build credentials"
  - "critical or exploitable image vulnerability is unresolved without approved exception"
  - "Kubernetes workload lacks required CPU or memory requests"
  - "Kubernetes workload runs privileged, uses host namespaces, or mounts sensitive host paths without approval"
  - "service account has broader permissions than the workload requires"
  - "network policy or security group change breaks required segmentation"
  - "TLS verification is disabled"
  - "encryption is removed from sensitive or stateful resources"
  - "backup retention or restore capability is reduced without approval"
  - "resource, queue, cache, storage, log, or autoscaling growth is unbounded"
  - "cost increase has no estimate for a material production change"
  - "required service quota is insufficient"
  - "single point of failure is introduced for a highly available service"
  - "readiness or health checks can route traffic to an unusable workload"
  - "liveness behavior can create restart loops during dependency failure"
  - "rollback assumes deleted data can be recovered without verified backup"
  - "manual console change is required but not documented and reconciled"
  - "production deployment approval can be bypassed"
  - "CI workflow from untrusted code can access production credentials"
  - "third-party CI action uses an unpinned mutable reference in a privileged pipeline"
  - "GitOps pruning can delete critical resources without safeguards"
  - "policy-as-code violation is suppressed without owner, reason, and expiration"
  - "plan, preview, diff, or rendered output was not reviewed for a production change"
  - "a successful validation or scan is claimed without execution evidence"

preferred_patterns:
  - "immutable infrastructure"
  - "GitOps reconciliation"
  - "reviewed plan artifact promoted to apply"
  - "remote encrypted state with locking"
  - "version-pinned providers and modules"
  - "workload identity and short-lived credentials"
  - "private networking by default"
  - "least-privilege IAM"
  - "managed secret stores"
  - "customer-managed encryption keys when required"
  - "multi-stage container builds"
  - "non-root minimal container images"
  - "immutable image digests"
  - "Kubernetes requests, limits, probes, disruption budgets, and graceful termination"
  - "policy as code"
  - "phased, canary, or blue-green rollout"
  - "automated drift detection"
  - "automated backup with tested restore"
  - "cost allocation tags"
  - "bounded autoscaling"
  - "infrastructure modules with safe defaults"
  - "state migration using moved or import mechanisms"
  - "environment promotion using the same immutable artifact"
  - "observable infrastructure before traffic cutover"

deliverables:
  - "change and blast-radius summary"
  - "affected environments, accounts, regions, clusters, and resources"
  - "plan, preview, diff, or rendered manifest summary"
  - "create, update, replace, and destroy action summary"
  - "security and IAM assessment"
  - "secret, certificate, and encryption impact"
  - "network exposure and connectivity assessment"
  - "availability, capacity, quota, and failover assessment"
  - "backup, restore, and disaster recovery impact"
  - "state and drift impact"
  - "cost estimate and primary cost drivers"
  - "observability and runbook impact"
  - "deployment sequence"
  - "rollback, roll-forward, or compensation plan"
  - "validation, policy, scan, and test evidence"
  - "post-deployment verification steps"
  - "unresolved risks, owners, and required approvals"

review_output:

  required_sections:
    - "Change summary"
    - "Scope and blast radius"
    - "Plan or preview analysis"
    - "Security and IAM"
    - "Secrets and encryption"
    - "Networking"
    - "Reliability and disaster recovery"
    - "State and drift"
    - "Capacity, quota, and cost"
    - "Deployment and rollback"
    - "Observability and operations"
    - "Validation evidence"
    - "Unresolved risks"

  decision:
    allowed_values:
      - "APPROVE"
      - "APPROVE_WITH_CONDITIONS"
      - "REJECT"

    requirements:
      - "cite code, plan, preview, policy, scan, manifest, diff, or test evidence"
      - "do not claim a command, scan, preview, or plan passed unless it was executed"
      - "distinguish verified resource changes from inferred runtime impact"
      - "identify every destructive or replacement action"
      - "identify all public exposure and privileged-access changes"
      - "state whether production execution requires human approval"
      - "list unresolved risks with an owner and required mitigation"
      - "never execute production apply, destroy, import, state mutation, or cluster mutation autonomously"
