version: 1

id: web-app

name: Web Application Quality Profile

description: 
  Mandatory engineering standards for browser-based applications,
  server-rendered applications, single-page applications, progressive web apps,
  edge-rendered applications, and full-stack web systems.
  Optimize for security, accessibility, rendering correctness, responsive user
  experience, browser compatibility, performance, reliable state management,
  privacy, observability, and safe delivery.

applies_when:
  - "frontend routes, layouts, pages, views, components, forms, styles, assets, navigation, or browser runtime behavior change"
  - "SSR, SSG, ISR, hydration, streaming, server components, server actions, loaders, route handlers, middleware, or edge behavior changes"
  - "client-side state, data fetching, caching, invalidation, optimistic updates, offline behavior, or synchronization changes"
  - "authentication, authorization, sessions, cookies, browser storage, CORS, CSRF, CSP, OAuth, redirects, or user-facing API calls change"
  - "PWA manifests, service workers, push notifications, installation, background sync, or offline caches change"
  - "web build, deployment, CDN, cache headers, reverse proxy, compression, redirects, rewrites, security headers, or asset delivery changes"
  - "analytics, consent, privacy, third-party scripts, advertisements, experimentation, or feature flags change"

goals:
  - "secure browser and server execution"
  - "accessible user experience"
  - "correct server and client rendering"
  - "responsive and resilient interaction"
  - "bounded client and server resource usage"
  - "predictable state and cache behavior"
  - "fast startup and navigation"
  - "browser and device compatibility"
  - "privacy-preserving telemetry"
  - "observable and reversible delivery"
  - "search and machine discoverability for public website surfaces"

composes_when_publicly_discoverable:
  - ".ai/quality-profiles/seo-geo.yaml"
  - ".ai/rules/seo-geo.md"

composes_for_user_facing_visual_changes:
  - ".ai/quality-profiles/visual-design.yaml"
  - ".ai/rules/visual-design-integrity.md"

composes_when_material_animation_exists:
  - ".ai/quality-profiles/animation-motion.yaml"
  - ".ai/rules/animation-integrity.md"

detect:

  files:
    - "package.json"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "bun.lock"
    - "next.config.*"
    - "vite.config.*"
    - "webpack.config.*"
    - "astro.config.*"
    - "remix.config.*"
    - "svelte.config.*"
    - "nuxt.config.*"
    - "angular.json"
    - "vue.config.*"
    - "gatsby-config.*"
    - "index.html"
    - "src/**"
    - "app/**"
    - "pages/**"
    - "routes/**"
    - "public/**"
    - "static/**"
    - "middleware.*"
    - "manifest.json"
    - "manifest.webmanifest"
    - "service-worker.*"
    - "sw.*"
    - "workbox-config.*"
    - "vercel.json"
    - "netlify.toml"
    - "_headers"
    - "_redirects"

  frameworks:
    - "React"
    - "Next.js"
    - "Vue"
    - "Nuxt"
    - "Angular"
    - "Svelte"
    - "SvelteKit"
    - "Remix"
    - "Astro"
    - "SolidJS"
    - "Qwik"
    - "Gatsby"
    - "Lit"
    - "Web Components"
    - "PWA"

  version_sources:
    - "package.json engines"
    - "package manager declaration"
    - "framework package versions"
    - "TypeScript target and module configuration"
    - "browserslist"
    - "build tool configuration"
    - "CI runtime version"
    - "container build and runtime image"
    - "deployment platform runtime"
    - "edge runtime configuration"
    - "supported-browser documentation"

preferred_commands:

  repository:
    - "repository-defined dependency installation command"
    - "repository-defined build command"
    - "repository-defined type-check command"
    - "repository-defined lint command"
    - "repository-defined unit, component, integration, and end-to-end commands"

  build:
    - "production build"
    - "SSR or prerender build"
    - "static export validation"
    - "bundle analyzer"
    - "route manifest inspection"
    - "source-map inspection"
    - "production preview server"

  lint_and_type_check:
    - "TypeScript type check"
    - "ESLint"
    - "framework template compiler"
    - "Stylelint"
    - "HTML validation"
    - "dependency boundary checks"

  testing:
    - "unit tests"
    - "component tests"
    - "Playwright"
    - "Cypress"
    - "Web Test Runner"
    - "browser smoke test"
    - "visual regression tests"
    - "contract tests"

  accessibility:
    - "axe"
    - "Playwright accessibility checks"
    - "Storybook accessibility checks"
    - "Lighthouse accessibility"
    - "manual keyboard test"
    - "screen-reader smoke test"

  performance:
    - "Lighthouse"
    - "WebPageTest"
    - "browser performance trace"
    - "Core Web Vitals measurement"
    - "bundle size comparison"
    - "coverage and unused-code analysis"
    - "network waterfall inspection"
    - "memory and long-task profile"

  security:
    - "dependency vulnerability scan"
    - "secret scan"
    - "security header validation"
    - "CSP validation"
    - "cookie inspection"
    - "CORS and CSRF review"
    - "DOM XSS analysis"
    - "third-party script inventory"

  compatibility:
    - "supported-browser matrix test"
    - "mobile and desktop viewport test"
    - "SSR and client-navigation parity test"
    - "JavaScript-disabled or degraded-mode review where applicable"

required_review:

  platform_and_runtime:
    - "supported browsers, devices, viewport classes, and runtime environments are explicit"
    - "minimum browser versions match actual API and syntax usage"
    - "browser, server, serverless, and edge runtime boundaries are explicit"
    - "Node.js-specific APIs are not used in unsupported edge runtimes"
    - "browser-only APIs are guarded during server rendering"
    - "polyfills are intentional and minimal"
    - "unsupported browsers receive clear fallback behavior"
    - "framework, build, CI, container, and deployment runtime versions are aligned"
    - "development-only behavior is not assumed to match production"
    - "production mode is used for performance and rendering validation"

  architecture:
    - "presentation, domain, application, data-access, and platform concerns remain separated"
    - "components do not directly own unrelated transport or persistence concerns"
    - "server-only code is isolated from client code"
    - "client-only modules are not imported into server bundles unintentionally"
    - "shared modules avoid runtime-specific side effects"
    - "feature and route boundaries have clear ownership"
    - "global state is minimized"
    - "cross-feature dependencies do not create cycles"
    - "framework-specific code does not unnecessarily dominate domain logic"
    - "public browser APIs are isolated behind adapters where useful"
    - "privileged server behavior is never delegated solely to client code"

  routing:
    - "route ownership and hierarchy are clear"
    - "route parameters are validated"
    - "unknown routes return appropriate not-found behavior"
    - "unauthorized routes do not reveal protected content"
    - "navigation preserves or resets state intentionally"
    - "back and forward navigation behave predictably"
    - "redirect behavior is bounded and loop-free"
    - "redirect targets are validated"
    - "trailing slash, locale, tenant, and canonical URL behavior are consistent"
    - "dynamic routes do not create uncontrolled route generation"
    - "route changes preserve analytics and observability behavior"
    - "deep links load correctly through direct server entry and client navigation"

  navigation:
    - "client navigation and full-page navigation produce equivalent authorized outcomes"
    - "navigation state has a clear owner"
    - "pending navigation can be cancelled or superseded safely"
    - "rapid navigation does not commit stale data"
    - "focus moves appropriately after route changes"
    - "scroll restoration is intentional"
    - "unsaved form behavior is explicit"
    - "duplicate navigation is prevented where harmful"
    - "loading indicators do not hide indefinitely pending navigation"
    - "navigation failures are recoverable"
    - "external navigation is visibly and securely handled"

  user_experience:
    - "loading, empty, error, unauthorized, forbidden, offline, stale, and partial states are explicit"
    - "critical actions provide immediate feedback"
    - "duplicate submissions are prevented"
    - "optimistic updates have rollback behavior"
    - "errors preserve user-entered data where safe"
    - "user operations are cancellable when practical"
    - "long-running operations show progress"
    - "destructive actions require appropriate confirmation"
    - "success feedback does not appear before durable success"
    - "intermittent failure does not require a full page reload where recovery is practical"
    - "progressive enhancement is considered for critical flows"
    - "content remains understandable while scripts or data are loading"

  forms:
    - "every form has an explicit submission owner"
    - "client-side validation improves experience but does not replace server-side validation"
    - "validation messages are field-specific and actionable"
    - "server validation errors map safely to fields and form-level errors"
    - "invalid submissions preserve user input where appropriate"
    - "duplicate submission is prevented"
    - "submission state is visible"
    - "submission cancellation and timeout behavior are defined"
    - "autocomplete attributes are correct"
    - "password-manager compatibility is preserved"
    - "sensitive fields are not repopulated insecurely"
    - "file upload size, type, count, and failure behavior are explicit"
    - "forms remain keyboard- and screen-reader-accessible"
    - "multi-step forms preserve state safely"
    - "browser refresh and back navigation behavior is intentional"
    - "idempotency is used for retriable side-effecting submissions where needed"

  rendering:
    - "server-rendered, statically generated, streamed, and client-rendered boundaries are intentional"
    - "rendering strategy matches data freshness and personalization requirements"
    - "hydration input is deterministic"
    - "server and client markup remain compatible"
    - "time, locale, randomness, browser APIs, and generated identifiers do not create hydration mismatches"
    - "client-only behavior is isolated"
    - "streaming boundaries have useful loading and error states"
    - "partial rendering failure does not corrupt the entire page where isolation is possible"
    - "server rendering does not expose user-specific data through shared caches"
    - "rendering does not depend on mutable global request state"
    - "HTML output remains semantically valid"
    - "rendering errors are observable"

  SSR_and_server_components:
    - "server-only secrets remain on the server"
    - "server components do not accidentally serialize sensitive values"
    - "client boundaries are minimized and intentional"
    - "request-specific data is not stored in global module state"
    - "server actions validate authentication, authorization, and input independently"
    - "server action identifiers are not treated as authorization controls"
    - "server-side requests propagate cancellation and timeout"
    - "server rendering does not create uncontrolled downstream fan-out"
    - "per-request caches do not leak across users"
    - "shared server caches have correct tenant and authorization keys"
    - "stream cancellation releases server resources"
    - "server-rendered errors do not expose stack traces or internal details"

  static_generation:
    - "build-time data sources are stable and bounded"
    - "static generation does not enumerate unbounded dynamic paths"
    - "fallback behavior is intentional"
    - "generated pages do not contain stale secrets or environment-specific values"
    - "content invalidation behavior is explicit"
    - "build failures caused by unavailable external content are handled intentionally"
    - "static output is compatible with intended CDN and routing behavior"
    - "incremental regeneration or equivalent behavior has explicit freshness semantics"
    - "old generated pages remain safe during regeneration failure"

  hydration:
    - "hydration warnings are treated as correctness issues"
    - "server and client initial state is equivalent"
    - "browser storage is not read during server rendering"
    - "media-query and viewport-dependent output has a hydration-safe strategy"
    - "user-specific state does not appear briefly for the wrong user"
    - "event handlers attach exactly once"
    - "hydration does not duplicate network requests, subscriptions, or analytics events"
    - "deferred hydration does not make critical controls unusable"
    - "hydration failure has observable and recoverable behavior"
    - "client takeover does not erase valid server-rendered content unexpectedly"

  state_management:
    - "state has one authoritative owner"
    - "server state and client UI state are not conflated"
    - "derived state is computed rather than duplicated where practical"
    - "state updates are deterministic"
    - "stale asynchronous results cannot overwrite newer state"
    - "global state is reserved for genuinely global concerns"
    - "route state and URL state are used appropriately"
    - "state does not retain sensitive data longer than necessary"
    - "state reset behavior is explicit on logout, tenant switch, and account switch"
    - "state persistence is versioned when stored"
    - "state subscriptions are cleaned up"
    - "large state objects are not duplicated across components unnecessarily"

  data_fetching:
    - "data-fetch ownership is explicit"
    - "requests are bounded"
    - "requests support timeout and cancellation"
    - "duplicate requests are deduplicated where appropriate"
    - "parallel requests are bounded"
    - "dependent requests do not create avoidable waterfalls"
    - "pagination or incremental loading is used for large result sets"
    - "authorization-sensitive data is fetched only after trusted authorization"
    - "client requests do not expose server credentials"
    - "loading and partial-data behavior are explicit"
    - "stale requests cannot overwrite newer results"
    - "request retry is bounded and restricted to safe operations"
    - "request errors remain distinguishable"
    - "server and client fetching do not duplicate work unintentionally"

  caching:
    - "cache scope is explicit: browser, memory, service worker, server, edge, CDN, or origin"
    - "cache keys include all security-, tenant-, locale-, variant-, and personalization-relevant dimensions"
    - "private data is never stored in public shared caches"
    - "authenticated responses use appropriate Cache-Control behavior"
    - "cache freshness and staleness semantics are explicit"
    - "cache invalidation is defined"
    - "stale-while-revalidate behavior is safe"
    - "Vary behavior is correct and bounded"
    - "cache key cardinality is controlled"
    - "cache poisoning risks are reviewed"
    - "negative caching duration is bounded"
    - "cache failure does not create uncontrolled origin load"
    - "browser and application caches are cleared appropriately on logout or account change"
    - "CDN and server cache behavior remains consistent"

  mutations:
    - "mutations validate current authentication and authorization"
    - "mutations validate input on the server"
    - "duplicate mutation execution is considered"
    - "idempotency is supported where retries are possible"
    - "optimistic updates have reconciliation and rollback"
    - "partial success is explicit"
    - "mutation responses return authoritative state where useful"
    - "concurrent update conflicts are handled"
    - "client state invalidation occurs after mutation"
    - "failed mutation does not leave misleading UI state"
    - "mutation retry does not duplicate side effects"

  accessibility:
    - "semantic HTML is used"
    - "heading hierarchy is correct"
    - "landmark elements are present"
    - "interactive behavior uses native controls where practical"
    - "buttons are used for actions"
    - "links are used for navigation"
    - "form labels are associated correctly"
    - "keyboard-only navigation is supported"
    - "focus order is logical"
    - "focus indicators are visible"
    - "focus moves appropriately after navigation, modal, validation, and dynamic-content changes"
    - "dialogs trap and restore focus correctly"
    - "screen-reader names, roles, states, and values are correct"
    - "dynamic status changes are announced where appropriate"
    - "color is not the only indicator"
    - "contrast meets required accessibility level"
    - "reduced-motion preferences are respected"
    - "zoom and text scaling remain usable"
    - "custom widgets implement complete keyboard interaction"
    - "accessibility behavior is tested, not inferred only from markup"

  responsive_layout:
    - "layout works across supported mobile, tablet, laptop, and desktop widths"
    - "content does not require unintended horizontal scrolling"
    - "text does not clip or overlap"
    - "long labels, numbers, URLs, localization, and user-generated content are handled"
    - "touch targets are appropriately sized"
    - "safe areas and viewport insets are considered"
    - "browser zoom remains usable"
    - "orientation changes do not break critical flows"
    - "responsive behavior is content-driven rather than device-name-driven where practical"
    - "container queries or component-level responsive behavior are considered"
    - "sticky and fixed elements do not obscure content"
    - "virtual keyboards do not hide critical controls"
    - "large-screen layouts use available space intentionally"

  semantic_HTML:
    - "document language is declared"
    - "page title is meaningful and updated during navigation"
    - "heading structure reflects content hierarchy"
    - "main content appears once"
    - "lists, tables, forms, figures, and navigation use appropriate elements"
    - "table headers and captions are correct"
    - "interactive divs and spans are prohibited without strong justification"
    - "DOM nesting is valid"
    - "IDs are unique"
    - "ARIA supplements rather than replaces native semantics"
    - "hidden content is excluded from accessibility trees correctly"

  localization:
    - "user-visible text is externalized"
    - "pluralization uses locale-aware APIs"
    - "date, time, number, currency, and measurement formatting are locale-aware"
    - "timezone behavior is explicit"
    - "right-to-left layout is supported where required"
    - "text expansion does not break layout"
    - "language switch behavior is explicit"
    - "URLs and routing behave correctly across locales"
    - "localized metadata, titles, and descriptions are updated"
    - "hardcoded locale assumptions are avoided"
    - "server and client locale selection remain consistent"

  authentication:
    - "authentication is enforced on trusted server boundaries"
    - "client route guards are not treated as authorization"
    - "session initialization is deterministic"
    - "expired sessions are handled"
    - "refresh behavior is coordinated"
    - "concurrent refresh attempts do not create races"
    - "logout invalidates server and browser session state appropriately"
    - "tenant and account switching clears previous protected state"
    - "OAuth state, nonce, and PKCE are validated where applicable"
    - "callback URLs are tightly controlled"
    - "session fixation is prevented"
    - "authentication errors do not leak account existence unnecessarily"
    - "return-to URLs are validated"
    - "authentication state does not flash protected content"

  authorization:
    - "authorization is enforced server-side"
    - "object-level authorization is verified"
    - "tenant boundaries are enforced"
    - "UI visibility is not treated as protection"
    - "server loaders, route handlers, actions, APIs, and background requests enforce authorization independently"
    - "cached responses do not cross authorization boundaries"
    - "authorization changes invalidate relevant cached state"
    - "forbidden and unauthenticated states are distinguishable where safe"
    - "privileged controls are hidden for usability but protected independently"
    - "authorization failures are auditable where required"

  sessions:
    - "session identifiers are unpredictable"
    - "session expiration is explicit"
    - "idle and absolute expiration behavior is intentional"
    - "session renewal and rotation are safe"
    - "session storage is protected"
    - "session data size is bounded"
    - "revocation behavior is defined"
    - "concurrent-device behavior is intentional"
    - "logout-all and credential-change behavior are considered"
    - "session data does not contain unnecessary sensitive information"
    - "server-side session lookups are bounded and observable"

  cookies:
    - "authentication cookies use Secure"
    - "authentication cookies use HttpOnly"
    - "SameSite is selected intentionally"
    - "cookie Path and Domain are minimized"
    - "cookie names and prefixes follow security best practices where applicable"
    - "cookie lifetime matches session requirements"
    - "sensitive state is not stored directly in readable cookies"
    - "cookie size remains bounded"
    - "cross-subdomain cookie exposure is reviewed"
    - "environment-specific cookie behavior is correct"
    - "logout and account changes clear all relevant cookie variants"
    - "third-party cookie assumptions are avoided"

  browser_storage:
    - "secrets and long-lived credentials are not stored in localStorage, sessionStorage, IndexedDB, Cache Storage, or client-readable cookies"
    - "storage use has a clear purpose and owner"
    - "stored data has size and retention bounds"
    - "stored schema is versioned where needed"
    - "logout and account switching clear protected data"
    - "multi-tab behavior is coordinated"
    - "storage events and cross-tab synchronization are handled safely"
    - "storage quota failures are handled"
    - "private-browsing limitations are considered"
    - "stale persisted state is validated before use"
    - "browser storage is treated as user-controlled input"
    - "sensitive cached content is minimized"

  XSS:
    - "framework escaping is preserved"
    - "untrusted HTML is never rendered without sanitization"
    - "sanitization library and policy are appropriate for the rendering context"
    - "HTML, attribute, URL, CSS, JavaScript, and template contexts use correct encoding"
    - "dangerous DOM sinks are avoided"
    - "DOM-based XSS risks are reviewed"
    - "user-controlled URLs use protocol allowlists"
    - "rich-text rendering has an explicit security model"
    - "Markdown rendering disables or sanitizes embedded HTML appropriately"
    - "server-rendered data is serialized safely into HTML"
    - "CSP is defense-in-depth and does not replace output encoding"
    - "trusted types are considered for high-risk applications"

  CSRF:
    - "cookie-authenticated state-changing operations have CSRF protection"
    - "safe HTTP methods do not perform mutations"
    - "CSRF tokens are bound and validated correctly"
    - "SameSite cookies are not treated as the sole control where threat model requires stronger protection"
    - "custom headers are validated for same-origin API calls where appropriate"
    - "origin and referer validation is considered"
    - "cross-origin form and simple-request behavior is understood"
    - "GraphQL and server-action writes receive equivalent protection"
    - "logout and security-sensitive actions are protected from CSRF"
    - "token-authenticated APIs do not accidentally fall back to cookies"

  CORS:
    - "allowed origins are explicit"
    - "wildcard origins are not combined with credentials"
    - "origin reflection is validated against an allowlist"
    - "allowed methods and headers are minimal"
    - "preflight caching is intentional"
    - "exposed headers are minimal"
    - "CORS is not treated as authentication or authorization"
    - "null and opaque origins are handled intentionally"
    - "development origins cannot leak into production"
    - "cross-origin errors do not expose sensitive diagnostics"

  CSP:
    - "Content Security Policy is explicit where applicable"
    - "script-src avoids unsafe-inline and unsafe-eval where practical"
    - "nonces or hashes are generated and applied correctly"
    - "third-party script origins are minimized"
    - "frame-ancestors is defined"
    - "object-src is restricted"
    - "base-uri is restricted"
    - "form-action is restricted where appropriate"
    - "connect-src covers only required endpoints"
    - "reporting is configured where operationally useful"
    - "CSP behavior is validated in report-only mode before enforcement when needed"
    - "CSP exceptions have ownership and removal plans"
    - "framework-generated scripts remain compatible with the policy"

  security_headers:
    - "Strict-Transport-Security is configured for HTTPS deployments"
    - "X-Content-Type-Options is configured"
    - "Referrer-Policy is intentional"
    - "Permissions-Policy is restrictive"
    - "frame embedding policy is explicit"
    - "cross-origin isolation headers are reviewed where applicable"
    - "cache headers do not expose sensitive content"
    - "server identity and framework details are minimized"
    - "security headers are applied consistently across HTML, APIs, errors, and redirects"
    - "header values do not conflict across CDN, proxy, and application layers"

  redirects_and_rewrites:
    - "redirect destinations are validated"
    - "open redirects are prevented"
    - "redirect chains are minimized"
    - "redirect loops are prevented"
    - "permanent versus temporary status is intentional"
    - "method-preserving redirect status codes are used where required"
    - "authentication return paths use allowlists"
    - "rewrites do not bypass authorization or security middleware"
    - "host-header manipulation cannot change trusted destinations"
    - "legacy route compatibility is preserved where required"

  injection:
    - "server-side queries and commands use parameterized APIs"
    - "template injection is prevented"
    - "header injection is prevented"
    - "path traversal is prevented"
    - "server-side request forgery is reviewed"
    - "user-controlled values do not select arbitrary modules, files, templates, or server actions"
    - "GraphQL query cost and depth are bounded where applicable"
    - "regular expression denial-of-service is reviewed"
    - "untrusted serialized input is validated"
    - "client-side filtering is not relied upon for server security"

  privacy_and_consent:
    - "data collection is minimized"
    - "consent is collected before non-essential tracking where required"
    - "consent choices are persisted and respected"
    - "consent revocation stops future collection"
    - "analytics, advertising, chat, session replay, and personalization scripts are inventoried"
    - "third-party scripts do not load before required consent"
    - "session replay masks sensitive content"
    - "privacy notices match actual behavior"
    - "browser fingerprinting is avoided unless explicitly approved"
    - "user deletion and data export behavior are supported where required"
    - "sensitive form fields are excluded from analytics"
    - "privacy behavior is consistent across SSR and client navigation"

  third_party_scripts:
    - "every third-party script has an owner and business purpose"
    - "third-party origin and integrity controls are reviewed"
    - "Subresource Integrity is used where compatible"
    - "scripts load asynchronously or lazily where appropriate"
    - "scripts do not block critical rendering unnecessarily"
    - "failure of a third-party script does not break critical flows"
    - "third-party scripts do not receive unnecessary user data"
    - "consent requirements are enforced"
    - "version changes are reviewed"
    - "unused scripts are removed"
    - "tag-manager changes remain governed and auditable"
    - "script count and performance impact are bounded"

  browser_APIs:
    - "clipboard, camera, microphone, geolocation, notifications, file access, Bluetooth, USB, MIDI, sensors, and other browser APIs require product need"
    - "permissions are requested in context"
    - "denied, dismissed, revoked, and unsupported states are handled"
    - "feature detection is used"
    - "browser API access is not assumed during SSR"
    - "resources are released after use"
    - "sensitive data from device APIs is protected"
    - "permission requests are not triggered automatically on initial load"
    - "browser API usage has secure-origin requirements accounted for"
    - "fallback behavior exists where appropriate"

  PWA:
    - "web app manifest metadata is accurate"
    - "start URL and scope are correct"
    - "icons and display modes are valid"
    - "installation behavior is intentional"
    - "offline capability is explicit"
    - "update behavior is understandable"
    - "standalone mode does not break authentication, navigation, or redirects"
    - "platform-specific installation limitations are documented"
    - "PWA storage growth is bounded"
    - "application remains usable after service worker or cache failure"
    - "version transitions do not corrupt persisted state"

  service_workers:
    - "service worker scope is minimized"
    - "cache strategies are explicit per resource type"
    - "authenticated and private responses are not cached unsafely"
    - "cache names are versioned"
    - "old caches are removed safely"
    - "activation behavior does not break open sessions"
    - "update prompts or reload behavior protect unsaved work"
    - "fetch handlers fail safely"
    - "offline fallback does not return misleading content"
    - "background sync is idempotent and bounded"
    - "service worker errors are observable"
    - "service worker cannot indefinitely retain obsolete application versions"
    - "cache storage quota and eviction are considered"

  push_notifications:
    - "notification permission is requested in user context"
    - "push subscription lifecycle is handled"
    - "subscriptions are removed on logout where appropriate"
    - "notification payloads minimize sensitive data"
    - "notification clicks validate current authentication and authorization"
    - "duplicate notifications are controlled"
    - "notification actions are idempotent"
    - "push failure does not block core application behavior"
    - "service worker notification handlers validate payloads"
    - "tenant and account context are handled safely"

  offline_behavior:
    - "offline behavior is explicit"
    - "users can distinguish live, stale, cached, and unavailable data"
    - "offline actions have bounded queueing"
    - "queued mutations are idempotent"
    - "reconnect does not duplicate actions"
    - "conflict resolution is defined"
    - "authentication expiry while offline is handled"
    - "offline content does not bypass authorization"
    - "stale data is not presented as current without indication"
    - "long offline periods are tested"
    - "offline caches are cleared on logout where required"

  multi_tab_and_cross_context:
    - "authentication and logout propagate across tabs"
    - "account and tenant changes propagate safely"
    - "cross-tab storage and BroadcastChannel messages are validated"
    - "duplicate background work across tabs is controlled"
    - "leader-election behavior is bounded and recoverable where used"
    - "concurrent edits have conflict handling"
    - "stale tabs cannot overwrite newer state silently"
    - "service worker, shared worker, and tab ownership are explicit"
    - "closed tabs release listeners and locks"

  performance:
    - "Core Web Vitals impact is reviewed"
    - "Largest Contentful Paint is reviewed"
    - "Interaction to Next Paint is reviewed"
    - "Cumulative Layout Shift is reviewed"
    - "Time to First Byte is reviewed for server-rendered paths"
    - "long tasks are minimized"
    - "main-thread execution is bounded"
    - "route transitions remain responsive"
    - "server and client rendering work is not duplicated unnecessarily"
    - "performance is measured in production-equivalent mode"
    - "mobile and lower-powered devices are considered"
    - "performance claims require trace, benchmark, field metric, or controlled lab evidence"

  JavaScript_execution:
    - "large synchronous work is avoided on interaction paths"
    - "CPU-intensive work is chunked, deferred, or moved to workers where appropriate"
    - "JSON parsing and serialization size are bounded"
    - "recursive processing has bounded depth"
    - "microtask loops do not starve rendering"
    - "event handlers are efficient"
    - "passive listeners are used where appropriate"
    - "high-frequency input is throttled or debounced intentionally"
    - "idle callbacks are not relied upon for correctness"
    - "web workers have explicit lifecycle and message validation"

  bundle:
    - "bundle size impact is reviewed"
    - "initial JavaScript budget is enforced where configured"
    - "route and feature code splitting is intentional"
    - "server-only dependencies are excluded from browser bundles"
    - "tree shaking remains effective"
    - "side-effect declarations are correct"
    - "large dependencies are justified"
    - "duplicate dependency versions are reviewed"
    - "dynamic imports do not create harmful waterfalls"
    - "polyfill cost is reviewed"
    - "source maps follow release and privacy policy"
    - "bundle analysis distinguishes initial, deferred, shared, and vendor code"

  assets:
    - "assets are content-hashed or versioned"
    - "cache lifetime matches asset immutability"
    - "asset paths work under configured base path and CDN"
    - "unused assets are removed"
    - "large SVG, JSON, video, animation, and media files are reviewed"
    - "asset compression is enabled"
    - "MIME types are correct"
    - "cross-origin asset behavior is configured intentionally"
    - "asset failure has graceful fallback where required"
    - "user-provided assets are validated"

  images:
    - "images are appropriately sized"
    - "responsive image sources are used"
    - "intrinsic dimensions or aspect ratio prevent layout shift"
    - "modern formats are considered"
    - "above-the-fold images are prioritized intentionally"
    - "below-the-fold images are lazy-loaded"
    - "image decoding behavior is reviewed"
    - "large image transformations do not block interaction"
    - "remote image sources are allowlisted where required"
    - "user-controlled image URLs do not create SSRF in server-side optimizers"
    - "alt text behavior is correct"

  fonts:
    - "font count and weight variants are minimized"
    - "font subsets are used where practical"
    - "font-display behavior is intentional"
    - "preload is limited to critical fonts"
    - "font loading does not cause excessive layout shift"
    - "system font fallback is usable"
    - "cross-origin font loading is configured correctly"
    - "font licenses permit intended distribution"
    - "third-party font requests do not create unintended privacy exposure"

  CSS_and_rendering:
    - "CSS specificity remains manageable"
    - "design tokens and established design-system primitives are used"
    - "unused CSS is minimized"
    - "render-blocking CSS is bounded"
    - "layout thrashing is avoided"
    - "animations prefer transform and opacity where appropriate"
    - "expensive filters, shadows, and paint effects are reviewed"
    - "content visibility and containment are considered for large pages"
    - "z-index layering is intentional"
    - "reduced-motion behavior is supported"
    - "CSS does not expose sensitive data through generated content or URLs"

  network:
    - "network waterfalls are reviewed"
    - "duplicate requests are avoided"
    - "request priorities are intentional"
    - "connection reuse and HTTP protocol behavior are considered"
    - "compression is enabled"
    - "large responses are streamed or paginated"
    - "API payloads contain only required fields"
    - "timeouts are defined"
    - "cancellation propagates"
    - "retry is bounded"
    - "client network failures are recoverable"
    - "preload, prefetch, and preconnect are used conservatively"
    - "speculative loading does not expose private data or create excessive load"

  CDN_and_edge:
    - "CDN cache keys include all required dimensions"
    - "private and personalized responses are not publicly cached"
    - "origin failover behavior is explicit"
    - "edge redirects and rewrites preserve security controls"
    - "edge middleware has bounded execution and dependency usage"
    - "regional and consistency behavior is understood"
    - "stale content behavior is explicit"
    - "cache purge or invalidation is documented"
    - "header behavior is consistent between edge and origin"
    - "edge logs do not expose sensitive values"
    - "edge runtime limitations are respected"

  SEO_and_metadata:
    - "document title and description match page content"
    - "canonical URLs are correct"
    - "robots behavior is intentional"
    - "sitemaps remain valid and bounded"
    - "structured data is accurate"
    - "social metadata is correct"
    - "protected, private, staging, and preview content is not indexed"
    - "SSR or prerendering provides required crawlable content"
    - "redirect and status behavior supports search correctness"
    - "locale and alternate-language metadata are consistent"
    - "metadata does not expose sensitive information"

  error_handling:
    - "rendering, route, data, and mutation errors have clear boundaries"
    - "errors are not silently swallowed"
    - "user-facing errors are actionable"
    - "retryable and non-retryable failures are distinguishable"
    - "error boundaries do not hide persistent systemic failures"
    - "internal stack traces are not exposed"
    - "error recovery preserves valid user state where possible"
    - "fatal client failures have a safe reload or recovery path"
    - "server failures return appropriate status codes"
    - "partial page failures are isolated where practical"
    - "errors are observable with release and route context"

  memory_and_lifecycle:
    - "component, route, page, worker, and service-worker lifecycle ownership is explicit"
    - "listeners, observers, subscriptions, intervals, timers, sockets, streams, and workers are cleaned up"
    - "aborted routes and requests release resources"
    - "detached DOM nodes are not retained"
    - "global caches and registries are bounded"
    - "memoization does not retain unbounded keys"
    - "large data is released after navigation"
    - "object URLs are revoked"
    - "media, canvas, WebGL, and GPU resources are disposed"
    - "repeated navigation reaches stable memory usage"
    - "browser tabs do not accumulate background work"
    - "server rendering does not retain request-scoped state globally"

  observability:
    - "client and server errors include release, route, and operation context"
    - "distributed trace context propagates across browser and server boundaries where supported"
    - "Core Web Vitals and user-experience metrics are observable"
    - "analytics events use stable schemas"
    - "telemetry dimensions have bounded cardinality"
    - "session and user identifiers are privacy-safe"
    - "authentication, authorization, form, payment, navigation, cache, hydration, and API failures are observable"
    - "deployment markers correlate regressions with releases"
    - "source maps match deployed assets"
    - "sensitive values are redacted"
    - "telemetry failure does not affect user workflows"
    - "alerts are actionable"

  analytics:
    - "analytics events have explicit business purpose"
    - "event names and properties are stable"
    - "duplicate events are prevented across SSR, hydration, and client navigation"
    - "sensitive values are excluded"
    - "consent is respected"
    - "offline event queues are bounded"
    - "event cardinality is bounded"
    - "experimentation assignments are consistent"
    - "analytics failures do not block interactions"
    - "test and production analytics environments are isolated"

  feature_flags:
    - "flag owner and purpose are explicit"
    - "default behavior is safe"
    - "server and client evaluation remain consistent where required"
    - "authorization is not implemented solely through feature flags"
    - "flag evaluation failure has defined behavior"
    - "user and tenant targeting is privacy-safe"
    - "flag changes are auditable"
    - "stale flags have removal plans"
    - "mixed flag states do not corrupt persisted data"
    - "high-risk UI changes support controlled rollout where practical"
    - "flag payloads do not expose secrets or sensitive configuration"

  deployment:
    - "production build output is immutable"
    - "the tested artifact is the deployed artifact"
    - "environment-specific runtime configuration is explicit"
    - "public environment variables contain no secrets"
    - "preview and staging environments cannot access production data without authorization"
    - "cache invalidation and asset compatibility are considered"
    - "HTML and asset deployment ordering avoids version mismatch"
    - "rolling deployment supports mixed server versions where required"
    - "database and API compatibility support old and new frontend versions"
    - "post-deployment smoke checks exist"
    - "deployment rollback behavior is documented"
    - "production deployment requires intended approval"

  release_and_rollback:
    - "rollback or roll-forward strategy is documented"
    - "previous static assets remain available long enough for active sessions where required"
    - "service worker updates do not strand users on incompatible assets"
    - "backend compatibility supports cached or older frontend clients"
    - "feature flags or phased rollout are considered for high-risk changes"
    - "client-side persisted-state compatibility is reviewed"
    - "release monitoring includes user-experience and error metrics"
    - "rollback does not assume browser caches update immediately"
    - "emergency disablement paths are explicit"
    - "release notes identify user-visible behavior changes"

  compatibility:
    - "supported browser matrix is explicit"
    - "critical flows are tested on representative rendering engines"
    - "mobile Safari behavior is considered"
    - "touch, mouse, keyboard, and assistive input are considered"
    - "browser storage and cookie restrictions are considered"
    - "private-browsing behavior is considered"
    - "API, event, and serialized data compatibility is preserved"
    - "old browser tabs remain compatible during deployment where required"
    - "progressive enhancement or graceful fallback is provided where valuable"
    - "framework and browser deprecations are reviewed"

  testing:
    - "unit tests cover meaningful logic"
    - "component tests cover interaction and state behavior"
    - "integration tests cover routing, data fetching, mutations, and authentication"
    - "end-to-end or browser smoke tests cover critical user flows"
    - "direct URL entry and client navigation are both tested"
    - "SSR and hydration behavior are tested"
    - "loading, empty, error, unauthorized, forbidden, offline, and retry states are tested"
    - "form validation and duplicate submission are tested"
    - "authorization and tenant isolation are tested"
    - "cookie, CSRF, CORS, redirect, and session behavior are tested where applicable"
    - "accessibility testing includes automated and manual evidence appropriate to risk"
    - "responsive behavior is tested at representative widths"
    - "visual regression testing is used for material layout changes"
    - "supported-browser behavior is tested according to risk"
    - "performance-sensitive changes include production-mode evidence"
    - "critical flows are tested against release-equivalent artifacts"

conditional_checks:

  - condition: "React changes"
    checks:
      - "hook dependency review"
      - "stale closure review"
      - "effect cleanup"
      - "render and memoization behavior"
      - "error boundary behavior"
      - "server and client boundary review"
      - "concurrent rendering assumptions"
      - "component remount and key behavior"

  - condition: "Next.js changes"
    checks:
      - "server and client component boundary"
      - "route handler and server action authorization"
      - "cache and revalidation semantics"
      - "dynamic versus static rendering behavior"
      - "middleware and edge runtime compatibility"
      - "hydration and streaming behavior"
      - "metadata generation"
      - "image optimizer source and SSRF review"
      - "deployment asset compatibility"

  - condition: "Angular changes"
    checks:
      - "template type checking"
      - "change-detection impact"
      - "signal and observable lifecycle"
      - "subscription cleanup"
      - "route guard versus server authorization"
      - "SSR and hydration behavior"
      - "sanitization and trusted-value usage"
      - "bundle and lazy-route impact"

  - condition: "Vue or Nuxt changes"
    checks:
      - "reactive watcher and effect cleanup"
      - "server and client state separation"
      - "composable ownership"
      - "SSR and hydration behavior"
      - "route middleware authorization"
      - "payload serialization"
      - "cache and rendering mode"
      - "bundle impact"

  - condition: "Svelte or SvelteKit changes"
    checks:
      - "store and subscription cleanup"
      - "load function ownership"
      - "server and browser module separation"
      - "form action validation and CSRF"
      - "SSR and hydration behavior"
      - "route invalidation"
      - "progressive enhancement"
      - "bundle impact"

  - condition: "Remix changes"
    checks:
      - "loader and action authorization"
      - "form and mutation semantics"
      - "redirect validation"
      - "session and cookie handling"
      - "error and catch boundary behavior"
      - "nested-route data ownership"
      - "revalidation behavior"
      - "progressive enhancement"

  - condition: "Astro changes"
    checks:
      - "island hydration strategy"
      - "client directive necessity"
      - "server and static rendering behavior"
      - "cross-framework component boundary"
      - "asset and image optimization"
      - "server endpoint validation"
      - "client JavaScript budget"
      - "content rendering safety"

  - condition: "SSR, SSG, ISR, streaming, or hydration changes"
    checks:
      - "server-client output parity"
      - "request-specific state isolation"
      - "cache privacy"
      - "hydration mismatch test"
      - "direct-entry browser test"
      - "loading and error boundary behavior"
      - "stream cancellation"
      - "mixed-version deployment compatibility"

  - condition: "authentication, session, cookie, or OAuth changes"
    checks:
      - "server-side enforcement"
      - "session fixation and rotation"
      - "cookie attributes"
      - "CSRF protection"
      - "return URL validation"
      - "OAuth state, nonce, and PKCE"
      - "logout and cross-tab cleanup"
      - "cache isolation"
      - "protected-content flash review"

  - condition: "form, mutation, checkout, payment, or other side-effecting flow changes"
    checks:
      - "server-side validation"
      - "CSRF protection"
      - "duplicate submission prevention"
      - "idempotency"
      - "optimistic rollback"
      - "partial failure behavior"
      - "accessibility and focus management"
      - "browser refresh and back-navigation behavior"
      - "end-to-end browser test"

  - condition: "rich text, Markdown, CMS content, user-generated HTML, or template rendering changes"
    checks:
      - "sanitization"
      - "context-aware encoding"
      - "protocol allowlist"
      - "DOM XSS review"
      - "CSP compatibility"
      - "malformed-content tests"
      - "link and image source restrictions"
      - "server and client rendering parity"

  - condition: "service worker, PWA, offline cache, push, or background sync changes"
    checks:
      - "cache versioning"
      - "private-response caching review"
      - "activation and update behavior"
      - "offline fallback behavior"
      - "queue boundedness"
      - "idempotency"
      - "logout cleanup"
      - "multi-version compatibility"
      - "browser installation test"

  - condition: "CDN, edge, redirect, rewrite, header, or cache configuration changes"
    checks:
      - "cache-key review"
      - "private-data caching review"
      - "security headers"
      - "redirect-loop and open-redirect review"
      - "origin and edge behavior parity"
      - "cache invalidation"
      - "rollback propagation"
      - "production-like response inspection"

  - condition: "performance-sensitive route or critical user flow changes"
    checks:
      - "production-mode browser trace"
      - "Core Web Vitals assessment"
      - "bundle comparison"
      - "network waterfall"
      - "long-task analysis"
      - "image and font loading"
      - "mobile and lower-powered device review"
      - "before-and-after evidence"

  - condition: "layout, component, styling, or visual interaction changes"
    checks:
      - "responsive viewport testing"
      - "keyboard navigation"
      - "focus management"
      - "automated accessibility scan"
      - "manual accessibility rationale or test"
      - "text expansion and overflow"
      - "theme and contrast behavior"
      - "visual regression evidence"

  - condition: "third-party scripts, analytics, advertising, experimentation, chat, or session replay changes"
    checks:
      - "privacy and consent"
      - "script origin and integrity"
      - "performance impact"
      - "failure isolation"
      - "sensitive-data filtering"
      - "event duplication"
      - "production and test separation"
      - "owner and removal strategy"

  - condition: "browser storage, IndexedDB, persisted state, or client cache changes"
    checks:
      - "sensitive-data review"
      - "schema versioning"
      - "size and retention bounds"
      - "logout and account-switch cleanup"
      - "multi-tab synchronization"
      - "storage quota failure"
      - "stale-state validation"
      - "migration and rollback behavior"

  - condition: "browser or device API changes"
    checks:
      - "permission need and timing"
      - "feature detection"
      - "denied and revoked behavior"
      - "SSR guards"
      - "resource cleanup"
      - "privacy impact"
      - "secure-context requirement"
      - "supported-browser behavior"

  - condition: "public release or production deployment changes"
    checks:
      - "production build"
      - "release-equivalent browser smoke test"
      - "security header inspection"
      - "asset and HTML version compatibility"
      - "source-map and symbol validation"
      - "cache invalidation plan"
      - "rollback or mitigation plan"
      - "post-deployment monitoring"

reject_if:
  - "secret, private key, privileged token, server credential, or sensitive configuration is included in browser-visible code, assets, source maps, HTML, or storage"
  - "authentication or authorization is enforced only in client code"
  - "protected or tenant-specific data can be served from a shared cache to another user"
  - "unsafe HTML, Markdown, CMS content, or user-generated content is rendered without appropriate sanitization"
  - "dangerous DOM sink receives untrusted input"
  - "cookie-authenticated write lacks required CSRF protection"
  - "CORS permits unintended credentialed origins"
  - "open redirect is possible"
  - "OAuth state, nonce, PKCE, or callback validation is missing where required"
  - "authentication cookie lacks required Secure, HttpOnly, or appropriate SameSite behavior"
  - "long-lived credential or sensitive secret is stored in browser-readable storage"
  - "server action, loader, route handler, or API trusts client-provided authorization state"
  - "hydration mismatch is introduced on a critical route"
  - "server-rendered output can expose one user's data to another request"
  - "browser-only API executes unguarded during server rendering"
  - "critical route or flow performs unbounded client-side data loading"
  - "collection response or infinite scroll can grow memory without bounds"
  - "request, retry, queue, prefetch, or parallel data fetching is unbounded"
  - "side-effecting request can be duplicated without idempotency or duplicate protection where retries are possible"
  - "main thread performs sustained blocking work on a critical interaction"
  - "navigation or async race can display stale or unauthorized state"
  - "component, route, listener, observer, timer, socket, worker, subscription, object URL, media, canvas, WebGL, or service-worker resource can leak"
  - "service worker caches authenticated or sensitive response unsafely"
  - "service worker update can strand users on incompatible HTML and assets without mitigation"
  - "CSP, TLS, hostname verification, or browser security controls are weakened without explicit approval"
  - "third-party script receives sensitive user data without documented need and consent"
  - "critical accessibility blocker is introduced"
  - "critical flow cannot be completed by keyboard"
  - "responsive layout makes a critical flow unusable on a supported viewport"
  - "production build can use development, test, or staging endpoints unintentionally"
  - "source map exposes secrets or sensitive source unintentionally"
  - "deployed artifact differs from the tested artifact"
  - "HTML and immutable asset rollout can create incompatible mixed versions without mitigation"
  - "critical user flow changes without automated test or documented manual browser evidence"
  - "public release lacks rollback, roll-forward, feature flag, or mitigation strategy for a high-risk change"
  - "build, browser, accessibility, performance, security, or deployment validation is claimed without execution evidence"

preferred_patterns:
  - "server-side authentication and authorization"
  - "semantic HTML and native browser controls"
  - "progressive enhancement"
  - "clear server and client boundaries"
  - "minimal client JavaScript"
  - "route-level and feature-level code splitting"
  - "server state managed separately from UI state"
  - "request cancellation and stale-response protection"
  - "bounded pagination and virtualized rendering"
  - "idempotent mutations"
  - "optimistic updates with rollback"
  - "strict output encoding and vetted sanitization"
  - "secure HttpOnly cookies for browser sessions"
  - "explicit CSRF protection"
  - "restrictive CSP and security headers"
  - "private-by-default caching"
  - "content-hashed immutable assets"
  - "responsive images and optimized fonts"
  - "accessible loading, error, validation, and navigation behavior"
  - "production-mode browser testing"
  - "Core Web Vitals monitoring"
  - "staged rollout and feature flags for high-risk changes"
  - "same immutable artifact promoted through environments"
  - "observable client and server failures with privacy-safe telemetry"

deliverables:
  - "affected frameworks, runtimes, routes, browsers, and rendering modes"
  - "routing, navigation, form, and user-experience assessment"
  - "SSR, SSG, hydration, streaming, server-action, and client-boundary assessment"
  - "state ownership, data-fetching, mutation, cache, and invalidation assessment"
  - "authentication, authorization, session, cookie, CSRF, CORS, CSP, XSS, and redirect assessment"
  - "browser storage, privacy, consent, analytics, and third-party script assessment"
  - "accessibility, semantic HTML, responsive layout, localization, and browser compatibility assessment"
  - "bundle, JavaScript execution, asset, image, font, network, and Core Web Vitals impact"
  - "PWA, service worker, offline, push, and multi-tab assessment where applicable"
  - "memory, lifecycle, listener, worker, socket, media, and resource-cleanup assessment"
  - "CDN, edge, cache header, deployment, asset-versioning, and rollback assessment"
  - "unit, component, integration, end-to-end, browser, accessibility, visual, performance, and security evidence"
  - "tested browsers, viewports, routes, authentication states, and rendering modes"
  - "unresolved risks, owners, mitigations, and required approvals"

review_output:

  required_sections:
    - "Change summary"
    - "Framework, runtime, and browser detection"
    - "Routes and user experience"
    - "Rendering and hydration"
    - "State, data fetching, and caching"
    - "Authentication, authorization, and sessions"
    - "Browser and application security"
    - "Accessibility and responsive behavior"
    - "Performance and Core Web Vitals"
    - "Memory and resource lifecycle"
    - "PWA, offline, and browser integrations"
    - "Compatibility"
    - "Deployment, CDN, and rollback"
    - "Testing and validation evidence"
    - "Unresolved risks"
    - "Decision"

  decision:
    allowed_values:
      - "APPROVE"
      - "APPROVE_WITH_CONDITIONS"
      - "REJECT"
      - "INCOMPLETE"

    requirements:
      - "cite source, configuration, production build, rendered HTML, browser, accessibility, network, bundle, trace, test, security-header, cache, or deployment evidence"
      - "do not claim browser behavior passed based only on unit tests or source inspection"
      - "do not claim SSR or hydration correctness based only on client-side navigation"
      - "do not claim production performance based on development-mode execution"
      - "identify every affected route, rendering boundary, mutation, cache, cookie, browser-storage key, third-party script, redirect, and security header"
      - "identify ownership and cleanup paths for every affected listener, observer, timer, subscription, socket, stream, worker, service worker, media resource, and object URL"
      - "state which browsers, viewport classes, authentication states, rendering modes, and navigation entry paths were actually tested"
      - "distinguish lab performance evidence from field performance evidence"
      - "identify all mixed-version, cache-invalidation, persisted-state, service-worker, and backend compatibility limitations"
      - "require explicit human approval for production deployment, security-policy weakening, broad third-party tracking, destructive persisted-state migration, or high-risk forced rollout"
