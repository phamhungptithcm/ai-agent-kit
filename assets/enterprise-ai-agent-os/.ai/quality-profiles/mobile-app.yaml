version: 1

id: mobile-app

name: Mobile Application Quality Profile

description: 
  Mandatory engineering standards for iOS, Android, React Native,
  Flutter, Kotlin Multiplatform, mobile SDKs, device integrations,
  application lifecycle, local persistence, networking, security,
  accessibility, performance, release delivery, and store compliance.
  Optimize for lifecycle correctness, privacy, secure data handling,
  offline resilience, responsiveness, battery efficiency, memory safety,
  backward compatibility, and safe staged release.

applies_when:
  - "iOS, Android, React Native, Flutter, Kotlin Multiplatform, or mobile SDK source changes"
  - "application lifecycle, navigation, view state, background work, push notification, deep link, app link, or universal link behavior changes"
  - "permissions, local storage, authentication, biometrics, networking, offline sync, payments, camera, location, media, Bluetooth, NFC, contacts, photos, microphone, or sensor integration changes"
  - "mobile build, dependency, signing, provisioning, entitlement, flavor, scheme, environment configuration, packaging, release, or store metadata changes"
  - "crash reporting, analytics, attribution, privacy declaration, tracking, telemetry, feature flag, or remote configuration changes"
  - "minimum OS version, architecture, device support, orientation, accessibility, localization, or platform compatibility changes"

goals:
  - "lifecycle correctness"
  - "privacy and secure data handling"
  - "responsive user experience"
  - "offline and intermittent-network resilience"
  - "bounded battery, memory, storage, and network usage"
  - "accessible and localized user experience"
  - "safe device and platform integration"
  - "backward-compatible API and data evolution"
  - "store-ready delivery"
  - "observable and reversible release"

detect:

  files:
    - "ios/**"
    - "android/**"
    - "*.xcodeproj"
    - "*.xcworkspace"
    - "Info.plist"
    - "*.entitlements"
    - "PrivacyInfo.xcprivacy"
    - "Package.swift"
    - "Package.resolved"
    - "Podfile"
    - "Podfile.lock"
    - "*.pbxproj"
    - "AndroidManifest.xml"
    - "build.gradle"
    - "build.gradle.kts"
    - "settings.gradle"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "gradle/libs.versions.toml"
    - "proguard-rules.pro"
    - "consumer-rules.pro"
    - "pubspec.yaml"
    - "pubspec.lock"
    - "analysis_options.yaml"
    - "react-native.config.*"
    - "metro.config.*"
    - "babel.config.*"
    - "app.json"
    - "app.config.*"
    - "eas.json"
    - "fastlane/**"
    - "Gemfile"
    - "Gemfile.lock"
    - "firebase.json"
    - "google-services.json"
    - "GoogleService-Info.plist"

  frameworks:
    - "SwiftUI"
    - "UIKit"
    - "AppKit Catalyst"
    - "Jetpack Compose"
    - "Android Views"
    - "React Native"
    - "Expo"
    - "Flutter"
    - "Kotlin Multiplatform"
    - "Kotlin Multiplatform Mobile"
    - "Capacitor"
    - "Cordova"
    - ".NET MAUI"

  version_sources:
    - "iOS deployment target"
    - "Xcode project and Swift tools version"
    - "Android minSdk, targetSdk, and compileSdk"
    - "Android Gradle Plugin version"
    - "Gradle wrapper version"
    - "Kotlin version"
    - "Java toolchain"
    - "React Native version"
    - "Expo SDK version"
    - "Flutter SDK constraint"
    - "Dart SDK constraint"
    - "Kotlin Multiplatform plugin version"
    - "CI build image"
    - "Fastlane configuration"
    - "App Store and Play Store release configuration"

preferred_commands:

  repository:
    - "repository-defined build command"
    - "repository-defined unit and integration test command"
    - "repository-defined lint and static-analysis command"
    - "repository-defined packaging or archive command"

  ios:
    - "xcodebuild build"
    - "xcodebuild test"
    - "swift build"
    - "swift test"
    - "swiftlint"
    - "swiftformat --lint"
    - "Xcode Analyze"
    - "simulator smoke test"
    - "archive validation"
    - "codesign and entitlement inspection"

  android:
    - "./gradlew assemble"
    - "./gradlew test"
    - "./gradlew connectedCheck"
    - "./gradlew lint"
    - "./gradlew detekt"
    - "./gradlew ktlintCheck"
    - "./gradlew dependencyUpdates"
    - "./gradlew bundleRelease"
    - "emulator smoke test"
    - "APK or AAB inspection"

  flutter:
    - "flutter pub get"
    - "flutter analyze"
    - "flutter test"
    - "flutter test --coverage"
    - "flutter build ios"
    - "flutter build appbundle"
    - "integration_test"
    - "DevTools memory and performance profile"

  react_native:
    - "npm ci or repository-defined immutable install"
    - "type check"
    - "lint"
    - "unit tests"
    - "iOS build"
    - "Android build"
    - "Metro bundle validation"
    - "native module compatibility test"
    - "release-mode smoke test"

  kotlin_multiplatform:
    - "./gradlew build"
    - "./gradlew allTests"
    - "./gradlew lint"
    - "shared-module API compatibility check"
    - "platform-specific integration tests"

  release:
    - "Fastlane validation"
    - "archive or bundle validation"
    - "signing and provisioning verification"
    - "store pre-check"
    - "staged-release configuration review"
    - "symbol and source-map upload validation"

  performance:
    - "cold-start measurement"
    - "frame rendering profile"
    - "memory profile"
    - "network profile"
    - "battery or energy profile"
    - "APK, AAB, IPA, bundle, and download-size comparison"

required_review:

  platform_and_version:
    - "supported OS versions and devices are explicit"
    - "minimum OS version matches actual API usage"
    - "deprecated platform APIs are not introduced"
    - "runtime availability checks guard newer APIs"
    - "target SDK and platform policy requirements are current"
    - "platform-specific implementations are validated separately"
    - "phone, tablet, foldable, desktop-mode, and multi-window support are intentional"
    - "supported CPU architectures are explicit"
    - "simulator-only behavior is not assumed to work on physical devices"
    - "development and release runtime behavior are compared where relevant"
    - "framework, toolchain, CI, and store configuration versions are aligned"

  architecture:
    - "presentation, application, domain, data, and platform concerns remain separated"
    - "business logic remains testable without UI or device startup"
    - "platform APIs are isolated behind explicit interfaces"
    - "shared code does not hide platform-specific security or lifecycle behavior"
    - "navigation and feature ownership are clear"
    - "global mutable state is minimized"
    - "dependency injection scopes match lifecycle"
    - "UI components do not directly own unrelated networking or persistence behavior"
    - "cross-feature dependencies do not create cyclic ownership"
    - "native bridges expose narrow typed APIs"

  lifecycle:
    - "application lifecycle state transitions are handled"
    - "foreground, inactive, background, suspended, and terminated behavior is defined"
    - "process death and activity or scene recreation are considered"
    - "state restoration is intentional"
    - "background-to-foreground refresh behavior is safe"
    - "lifecycle callbacks do not duplicate subscriptions or tasks"
    - "work is cancelled when its lifecycle owner is destroyed"
    - "long-running work is not tied only to a short-lived view lifecycle"
    - "application startup and initialization are bounded"
    - "shutdown or termination does not leave partially written local state"
    - "multi-window and multi-scene lifecycle is considered where supported"
    - "time changes, timezone changes, locale changes, and device reboot behavior are reviewed"

  process_death_and_restoration:
    - "critical state survives process recreation when required"
    - "transient UI state is not assumed to remain in memory"
    - "restored data is validated before use"
    - "navigation restoration does not duplicate side effects"
    - "pending submissions are recoverable or safely discarded"
    - "restoration does not reuse expired credentials or stale permissions"
    - "large objects are not stored in restoration bundles"
    - "saved-state limits are respected"
    - "process restart behavior is tested"

  UI_thread:
    - "main-thread blocking is avoided"
    - "network, file, database, cryptographic, image decoding, and heavy serialization work runs off the main thread"
    - "background results return to the UI safely"
    - "UI state updates occur on the correct executor, actor, dispatcher, or scheduler"
    - "synchronous bridge calls do not block rendering"
    - "expensive recomposition, layout, measure, and drawing work is minimized"
    - "long-running user actions support cancellation"
    - "progress and disabled states prevent duplicate actions"
    - "ANR and watchdog termination risk is reviewed"
    - "UI freezes are measurable and diagnosable"

  navigation:
    - "navigation state has a single authoritative owner"
    - "back-stack behavior is predictable"
    - "duplicate destinations are prevented where unintended"
    - "tab and nested navigation state is preserved intentionally"
    - "authentication transitions clear protected routes correctly"
    - "logout removes sensitive navigation history"
    - "deep-link navigation validates prerequisites"
    - "navigation does not trigger duplicate API calls or submissions"
    - "modal and sheet lifecycle is correct"
    - "orientation and configuration changes do not corrupt navigation state"
    - "state restoration does not reopen unsafe or expired flows"

  UI_state:
    - "loading, success, empty, offline, stale, permission-denied, and error states are explicit"
    - "state is immutable or consistently synchronized"
    - "stale async results cannot overwrite newer state"
    - "one-time events are not replayed unintentionally"
    - "UI state survives expected lifecycle recreation"
    - "error recovery does not require application restart"
    - "optimistic updates have rollback behavior"
    - "duplicate taps and rapid navigation are handled"
    - "forms preserve or discard user input intentionally"
    - "screen state does not retain large data unnecessarily"

  background_execution:
    - "background execution uses platform-approved APIs"
    - "background limits and quotas are respected"
    - "work has explicit constraints"
    - "background work is idempotent"
    - "duplicate scheduling is prevented"
    - "retry count and backoff are bounded"
    - "work survives process death only when required"
    - "foreground-service usage is justified and user-visible where required"
    - "background work stops when authorization or permission is revoked"
    - "battery-sensitive constraints are used where appropriate"
    - "work scheduling does not assume exact execution time unless platform guarantees it"
    - "background work does not create uncontrolled wakeups"
    - "failed work is observable"

  tasks_and_concurrency:
    - "task and coroutine ownership is explicit"
    - "tasks are cancelled with their lifecycle owner"
    - "detached tasks require justification"
    - "shared mutable state is synchronized"
    - "race conditions around navigation, cache, authentication, and sync are reviewed"
    - "concurrency is bounded"
    - "task failures are observed"
    - "cancellation is propagated"
    - "timeouts are applied to potentially indefinite work"
    - "retries are idempotent"
    - "background callbacks do not update destroyed components"
    - "thread, dispatcher, actor, isolate, and queue selection matches workload"

  permissions:
    - "every permission has a documented product requirement"
    - "least-privilege permission scope is used"
    - "permission request occurs in user context"
    - "permission rationale is understandable"
    - "denied, restricted, limited, revoked, and permanently denied states are handled"
    - "application remains usable when optional permissions are denied"
    - "permission state is revalidated before protected operations"
    - "permissions are not requested at startup without immediate need"
    - "unused permissions are removed"
    - "permission changes are reflected in store declarations"
    - "background permission requests are separately justified"
    - "platform-specific limited-access modes are supported"

  privacy:
    - "data collection is minimized"
    - "privacy manifests and store declarations match actual behavior"
    - "tracking behavior has required consent"
    - "analytics and attribution SDK behavior is understood"
    - "device identifiers are not used unnecessarily"
    - "advertising identifiers are handled according to platform policy"
    - "sensitive permissions and APIs have accurate purpose declarations"
    - "user deletion and account removal requirements are supported"
    - "clipboard, screenshots, notifications, logs, analytics, and crash reports do not expose sensitive data"
    - "third-party SDK data collection is reviewed"
    - "privacy choices are persisted and respected"
    - "privacy-related behavior remains correct offline"

  secure_storage:
    - "credentials, tokens, keys, and sensitive identifiers use platform-protected storage"
    - "plaintext shared preferences, user defaults, files, and databases are not used for secrets"
    - "storage access level matches lock-state and device-transfer requirements"
    - "biometric-protected secrets have fallback and invalidation behavior"
    - "secure-storage failures are handled"
    - "logout removes or invalidates credentials"
    - "backup and device migration behavior is intentional"
    - "rooted or jailbroken device assumptions are not relied upon for security"
    - "encryption keys are not hardcoded"
    - "key rotation and credential migration are supported where required"

  authentication:
    - "authentication state has a single authoritative owner"
    - "token expiry and refresh behavior is explicit"
    - "refresh concurrency is coordinated"
    - "failed refresh does not create retry loops"
    - "logout clears credentials, cached protected data, cookies, and session state"
    - "system-browser authentication is used where required"
    - "OAuth state, nonce, PKCE, and callback validation are correct"
    - "deep-link authentication callbacks are validated"
    - "multiple account state remains isolated"
    - "offline authentication behavior is explicit"
    - "biometric authentication is not treated as remote identity verification"
    - "authentication failures do not expose account existence unnecessarily"

  biometrics:
    - "biometrics are used only for local user-presence verification"
    - "biometric policy matches sensitivity"
    - "device credential fallback is intentional"
    - "biometric enrollment changes invalidate protected keys where required"
    - "lockout, unavailable, cancelled, and failed states are handled"
    - "sensitive operations require fresh authorization where appropriate"
    - "biometric prompts occur in clear user context"
    - "application does not infer biometric type or identity beyond platform guarantees"

  network_security:
    - "TLS verification is enabled"
    - "cleartext traffic is prohibited unless explicitly approved"
    - "network-security configuration follows least privilege"
    - "certificate pinning is used only with a safe rotation strategy"
    - "custom trust managers and hostname verifiers are reviewed"
    - "tokens and sensitive headers are not logged"
    - "request and response bodies are not logged when sensitive"
    - "proxy, captive portal, VPN, and enterprise-network behavior are considered"
    - "network errors remain distinguishable from server and validation failures"
    - "request size and response size are bounded"
    - "redirect behavior is controlled"
    - "download integrity is verified where required"

  networking:
    - "HTTP clients are reused"
    - "connect, read, write, call, and idle timeouts are explicit"
    - "cancellation propagates to network requests"
    - "retry is bounded"
    - "retry is restricted to safe or idempotent operations"
    - "retry uses backoff and jitter"
    - "duplicate submissions are prevented"
    - "intermittent connectivity is handled"
    - "network availability is not treated as proof of internet reachability"
    - "large payloads are streamed"
    - "pagination is used for large collections"
    - "upload and download progress is available where valuable"
    - "partial uploads and downloads have defined recovery behavior"
    - "connection pool and socket usage are bounded"

  offline_behavior:
    - "offline capability is explicit"
    - "screens communicate offline and stale-data state"
    - "offline actions have defined queueing behavior"
    - "offline queue size and retention are bounded"
    - "queued operations are idempotent"
    - "reconnect does not duplicate submissions"
    - "authentication expiry while offline is handled"
    - "cached data freshness is explicit"
    - "offline data remains protected"
    - "conflicting local and remote changes have a defined resolution policy"
    - "long offline periods are tested"
    - "offline behavior does not bypass authorization"

  synchronization:
    - "sync ownership and source of truth are explicit"
    - "sync direction is defined"
    - "conflict resolution is deterministic"
    - "last-write-wins is not used silently for critical data"
    - "server timestamps and device clock differences are considered"
    - "sync checkpoints are durable"
    - "partial sync can resume safely"
    - "duplicate events are tolerated"
    - "out-of-order changes are handled"
    - "deleted and tombstoned records are handled"
    - "large sync runs are paginated or chunked"
    - "sync does not monopolize network, battery, or memory"
    - "sync failure and lag are observable"

  local_persistence:
    - "database and file ownership is explicit"
    - "schema version is explicit"
    - "migrations are ordered"
    - "migrations are tested from supported historical versions"
    - "migration failure does not leave partially valid state"
    - "destructive migration requires explicit approval and backup or compensation behavior"
    - "database access is off the main thread"
    - "transactions preserve consistency"
    - "concurrent access is safe"
    - "large result sets are paginated or streamed"
    - "sensitive fields are encrypted where required"
    - "database and file size growth are bounded"
    - "corruption recovery is defined"
    - "app reinstall, device migration, backup, and restore behavior are intentional"

  cache:
    - "cache owner and purpose are explicit"
    - "maximum size and retention are defined"
    - "expiration and invalidation behavior are defined"
    - "cache keys have bounded cardinality"
    - "sensitive data is not cached unnecessarily"
    - "image and media caches are bounded"
    - "cache storage responds to low-storage conditions"
    - "cache clearing does not remove durable user data"
    - "cache misses do not create uncontrolled network bursts"
    - "multi-account cache data is isolated"

  files_and_media:
    - "user-selected files and media are treated as untrusted"
    - "file size, type, dimensions, duration, and count are bounded"
    - "content validation is not based only on file extension"
    - "large media is streamed"
    - "images are downsampled before full decode where possible"
    - "decompression-bomb risk is considered"
    - "temporary files are removed"
    - "media resources are released"
    - "EXIF and metadata privacy are reviewed"
    - "uploads do not expose unintended local metadata"
    - "photo-library limited-access behavior is supported"
    - "camera and microphone sessions stop when no longer needed"

  location:
    - "location access is necessary for the feature"
    - "foreground versus background location access is explicitly justified"
    - "precision level is minimized"
    - "location update frequency is bounded"
    - "location monitoring stops when not required"
    - "denied and reduced-accuracy modes are handled"
    - "location data retention is minimized"
    - "location data is protected in logs, analytics, local storage, and network payloads"
    - "geofencing limits and delivery behavior are understood"
    - "battery impact is reviewed"

  camera_microphone_and_sensors:
    - "hardware access occurs only during active feature use"
    - "sessions are stopped on backgrounding where required"
    - "permission loss is handled"
    - "capture interruption is handled"
    - "concurrent hardware access conflicts are handled"
    - "sensitive captured data is protected"
    - "temporary media is cleaned up"
    - "sensor update rate is bounded"
    - "sensor listeners are removed"
    - "hardware unavailability and emulator limitations are handled"

  push_notifications:
    - "push token lifecycle is handled"
    - "token refresh is synchronized with backend registration"
    - "duplicate device registrations are prevented"
    - "notification payloads do not include unnecessary sensitive data"
    - "notification permission denial is handled"
    - "foreground, background, and terminated delivery paths are reviewed"
    - "notification tap behavior validates current application state"
    - "deep-link destinations require authorization where applicable"
    - "silent or data pushes respect platform limits"
    - "notification channels and categories are versioned safely"
    - "unregister and logout behavior removes stale tokens"
    - "push processing is idempotent"

  deep_links:
    - "universal links, app links, and custom schemes are explicitly scoped"
    - "every deep-link payload is treated as untrusted"
    - "scheme, host, path, query, fragment, encoding, and size are validated"
    - "domain-association files are reviewed"
    - "deep links do not directly execute privileged or destructive actions"
    - "sensitive actions require authenticated and authorized state"
    - "deep links received during cold start are queued safely"
    - "deep links do not bypass onboarding, account selection, or tenant boundaries"
    - "replay behavior is considered"
    - "fallback web behavior is defined"
    - "multiple installed environments do not route unpredictably"

  device_integrations:
    - "device API usage is isolated behind explicit interfaces"
    - "device capability absence is handled"
    - "physical-device testing is performed for changed integrations"
    - "Bluetooth, NFC, Health, Wallet, CarPlay, Android Auto, wearable, and accessory permissions are minimized"
    - "connection lifecycle is bounded"
    - "device scanning is rate-limited"
    - "pairing and trust behavior are explicit"
    - "hardware identifiers are not used as stable identity without justification"
    - "device integration does not block UI execution"
    - "device resources are released on lifecycle changes"

  payments:
    - "platform payment rules are followed"
    - "store-managed digital purchase flows use required platform APIs"
    - "payment state is verified with a trusted backend"
    - "client success state is not treated as authoritative"
    - "duplicate purchase and submission behavior is handled"
    - "pending, cancelled, declined, refunded, restored, and interrupted states are handled"
    - "receipt and purchase-token validation is secure"
    - "sensitive payment data is not logged or stored"
    - "restore-purchase behavior is supported where required"
    - "server notifications and entitlement reconciliation are considered"
    - "idempotency protects backend fulfillment"
    - "sandbox and production configurations cannot be mixed"

  webviews:
    - "webview use is justified"
    - "navigation is allowlisted"
    - "JavaScript bridges expose minimal capabilities"
    - "bridge payloads are validated"
    - "untrusted content cannot invoke privileged native actions"
    - "mixed content is disabled"
    - "file access and universal access are restricted"
    - "cookies and storage are isolated appropriately"
    - "authentication tokens are not injected into untrusted pages"
    - "external links open through controlled behavior"
    - "downloads are validated"
    - "debugging is disabled in production"

  accessibility:
    - "screen-reader labels, roles, states, and values are correct"
    - "focus order is logical"
    - "dynamic type and font scaling are supported"
    - "text does not clip at supported accessibility sizes"
    - "touch targets meet platform guidance"
    - "color is not the only status indicator"
    - "contrast is sufficient"
    - "motion reduction preferences are respected"
    - "screen-reader navigation works across custom components"
    - "keyboard and switch-control input are supported where applicable"
    - "errors are announced accessibly"
    - "focus moves predictably after navigation, dialog, and validation events"

  responsive_layout:
    - "layout supports expected screen sizes and aspect ratios"
    - "safe areas and system insets are respected"
    - "orientation changes are supported where enabled"
    - "tablet, split-screen, foldable, and multi-window behavior is reviewed"
    - "keyboard appearance does not hide critical controls"
    - "system bars and display cutouts are handled"
    - "content does not clip with localization or font scaling"
    - "large screens do not simply stretch phone layouts without review"
    - "landscape behavior is intentional"
    - "responsive image and media sizes are used"

  localization:
    - "user-visible text is externalized"
    - "pluralization and grammatical variation use platform localization APIs"
    - "date, time, number, currency, and measurement formatting are locale-aware"
    - "right-to-left layout is supported where required"
    - "text expansion is considered"
    - "translated text does not clip"
    - "language change behavior is defined"
    - "hardcoded locale assumptions are avoided"
    - "server-provided user-visible text has localization strategy"
    - "store metadata and permission descriptions are synchronized"

  performance:
    - "cold start, warm start, and resume impact are reviewed"
    - "time to first usable screen is reviewed"
    - "critical-screen rendering is measured for material changes"
    - "main-thread work is bounded"
    - "frame drops and jank are reviewed"
    - "large lists use virtualization or lazy rendering"
    - "unnecessary recomposition, redraw, or layout work is minimized"
    - "network round trips are minimized"
    - "serialization and database work are bounded"
    - "image loading and transformation are optimized"
    - "release-mode performance is measured"
    - "performance claims require trace, benchmark, profile, or metric evidence"

  memory:
    - "view, controller, fragment, activity, scene, component, and widget lifecycles do not leak"
    - "retain cycles and strong-reference cycles are reviewed"
    - "listeners, observers, delegates, callbacks, timers, coroutines, tasks, streams, and subscriptions are cleaned up"
    - "long-lived singleton state does not retain views, contexts, activities, or sessions"
    - "large bitmaps, images, videos, and buffers are released"
    - "large lists are paginated or virtualized"
    - "caches have explicit limits"
    - "native and GPU memory are considered in addition to managed heap"
    - "repeated navigation reaches stable memory usage"
    - "backgrounding releases unnecessary resources"
    - "low-memory callbacks are handled"
    - "memory-sensitive changes include profiling evidence"

  battery_and_energy:
    - "background polling is minimized"
    - "high-frequency timers are justified"
    - "location, Bluetooth, sensors, network, and media usage are bounded"
    - "wake locks and background services are minimized"
    - "network batching is considered"
    - "retry loops do not cause continuous wakeups"
    - "animations and rendering stop when not visible"
    - "camera and microphone sessions stop when inactive"
    - "offline and sync behavior respects battery state where appropriate"
    - "energy-sensitive changes include profiling or measurement evidence"

  storage:
    - "application storage growth is bounded"
    - "cache and temporary-file cleanup exist"
    - "low-storage behavior is handled"
    - "large downloads validate available space"
    - "partial downloads and failed writes are cleaned up"
    - "documents and user-created content are not removed as cache"
    - "backup inclusion and exclusion are intentional"
    - "sensitive files use appropriate protection"
    - "uninstall and account-removal behavior is documented"
    - "logs and crash artifacts have bounded retention"

  security:
    - "mobile client is not treated as a trusted security boundary"
    - "authorization is enforced by trusted backend services"
    - "client-side checks are not the only protection"
    - "secrets are not embedded in source, resources, configuration, bundles, or native libraries"
    - "API keys are restricted where exposure is unavoidable"
    - "root or jailbreak detection is not used as the sole security control"
    - "debug menus, test endpoints, and developer settings are disabled or protected in production"
    - "release builds disable verbose sensitive logging"
    - "WebView and native bridge surfaces are constrained"
    - "intent, URL, activity, service, receiver, provider, and exported-component exposure is reviewed"
    - "Android exported components are explicitly configured"
    - "iOS entitlements and associated domains follow least privilege"
    - "tamper, replay, and automation risks are considered for high-risk flows"
    - "screen capture and app-switcher snapshot behavior are reviewed for sensitive screens"
    - "clipboard use for sensitive values is minimized"
    - "local server or loopback endpoints are authenticated and constrained"

  logging_and_telemetry:
    - "structured logs include application version, platform, operation, and outcome"
    - "logs do not contain credentials, tokens, payment data, health data, precise location, PII, or sensitive payloads"
    - "debug logs are disabled or reduced in production"
    - "analytics events have stable documented schemas"
    - "analytics dimensions have bounded cardinality"
    - "analytics consent and privacy choices are enforced"
    - "offline analytics queues are bounded"
    - "crash reports exclude sensitive user data"
    - "release symbols and source maps match distributed artifacts"
    - "telemetry failures do not affect user workflows"
    - "user and device identifiers are minimized"

  crash_and_error_handling:
    - "unexpected errors do not corrupt local state"
    - "user-facing errors are actionable"
    - "retryable and non-retryable failures are distinguishable"
    - "fatal errors do not create permanent crash loops"
    - "corrupt local state has recovery behavior"
    - "uncaught exceptions and fatal signals are captured where platform policy allows"
    - "crash reporting initializes safely"
    - "safe mode or reset behavior is considered for critical persistent failures"
    - "crash during migration or update has defined recovery"
    - "exceptions are not silently swallowed"

  dependencies_and_SDKs:
    - "new mobile SDKs are justified"
    - "SDK privacy and data collection are reviewed"
    - "SDK startup, memory, battery, network, and binary-size impact are reviewed"
    - "dependency versions are pinned according to repository policy"
    - "native transitive dependencies are reviewed"
    - "minimum OS compatibility is preserved"
    - "abandoned or unmaintained SDKs are avoided"
    - "known vulnerabilities are reviewed"
    - "SDK initialization does not block startup unnecessarily"
    - "optional SDKs fail safely when unavailable"
    - "dependency removal or disablement is possible"
    - "license requirements are satisfied"

  build_configuration:
    - "debug, test, staging, and production configurations are isolated"
    - "production builds cannot accidentally use test endpoints or keys"
    - "environment selection is explicit"
    - "configuration values are validated"
    - "secrets are injected securely"
    - "bundle identifiers and application IDs are correct"
    - "version name, version code, build number, and release version are consistent"
    - "release builds use production optimization and obfuscation settings"
    - "debuggable flags are disabled in production"
    - "unused permissions and entitlements are removed"
    - "build variants do not drift materially without documentation"
    - "CI uses the same release configuration as store delivery"

  signing_and_provisioning:
    - "release artifacts are signed"
    - "signing credentials are protected"
    - "signing occurs in controlled CI or release environments"
    - "certificate, key, and provisioning expiry are monitored"
    - "signing identity matches bundle or application identity"
    - "development signing cannot be promoted accidentally"
    - "Android upload and app-signing key responsibilities are clear"
    - "iOS provisioning profiles and entitlements match the released target"
    - "key rotation and recovery procedures exist"
    - "the exact distributed artifact is the artifact that was signed and validated"

  release:
    - "release scope and affected platforms are documented"
    - "store version and build metadata are correct"
    - "staged or phased rollout is considered"
    - "feature flags are considered for high-risk changes"
    - "rollback limitations are explicit"
    - "backend compatibility with old and new clients is verified"
    - "minimum supported client behavior is explicit"
    - "forced-update behavior is justified"
    - "release notes are accurate"
    - "support and incident ownership are clear"
    - "post-release monitoring is defined"
    - "release artifact provenance is retained"
    - "symbols, mapping files, and source maps are uploaded"

  store_compliance:
    - "privacy labels and data-safety declarations match actual collection"
    - "permission usage descriptions are accurate"
    - "tracking declarations are accurate"
    - "background-mode declarations are justified"
    - "payment behavior follows store policy"
    - "account deletion requirements are met"
    - "export-control and encryption declarations are reviewed"
    - "target SDK and minimum policy deadlines are met"
    - "screenshots, descriptions, age rating, and metadata match actual behavior"
    - "review credentials and test instructions are safe and current"
    - "third-party SDK declarations are complete"
    - "store policy changes affecting the release are reviewed"

  backward_compatibility:
    - "older supported clients remain compatible with backend changes"
    - "new clients tolerate older backend behavior during rollout where required"
    - "local-data migrations preserve supported upgrade paths"
    - "deep-link and notification payload compatibility is preserved"
    - "serialized cache and persisted state compatibility is reviewed"
    - "shared SDK public APIs remain source and binary compatible where required"
    - "minimum OS changes require explicit product and release approval"
    - "device capability differences have fallback behavior"
    - "feature flags support mixed-version populations safely"

  observability:
    - "crash-free sessions and users are observable"
    - "startup, screen rendering, network, sync, and error performance are observable"
    - "release version, platform, OS, device class, and feature-flag context are available with bounded cardinality"
    - "permission, authentication, payment, deep-link, push, and migration failures are observable"
    - "offline queue size and sync lag are observable where applicable"
    - "memory warnings, OOM indicators, ANRs, watchdog terminations, and frozen frames are monitored"
    - "battery and network regressions can be investigated"
    - "store rollout health is monitored by version"
    - "alerts are actionable"
    - "sensitive telemetry is redacted"

  testing:
    - "unit tests cover business logic"
    - "integration tests cover persistence, networking, authentication, and platform adapters"
    - "UI tests cover critical user flows"
    - "simulator or emulator smoke testing covers changed flows"
    - "physical-device testing is performed for hardware-dependent behavior"
    - "release-mode builds are tested"
    - "minimum and current supported OS versions receive representative testing"
    - "phone and tablet or large-screen behavior is tested where supported"
    - "offline, intermittent, slow, and failed-network behavior is tested"
    - "permission denied, revoked, limited, and restricted states are tested"
    - "process death and restoration are tested"
    - "background and foreground transitions are tested"
    - "push and deep-link cold-start paths are tested"
    - "migration from supported historical versions is tested"
    - "resource cleanup and repeated navigation are tested"
    - "accessibility and localization are tested"
    - "store-signed or release-equivalent artifacts are validated before approval"

conditional_checks:

  - condition: "SwiftUI or UIKit changes"
    checks:
      - "MainActor and main-thread correctness"
      - "view, view-controller, scene, and task lifecycle"
      - "Combine subscription cleanup"
      - "NotificationCenter observer cleanup"
      - "retain-cycle review"
      - "state restoration"
      - "privacy manifest and entitlement review"
      - "Instruments memory, energy, and performance review"

  - condition: "Jetpack Compose or Android Views changes"
    checks:
      - "lifecycle-aware collection"
      - "coroutine scope ownership"
      - "configuration-change and process-death behavior"
      - "recomposition and state-hoisting review"
      - "Activity, Fragment, View, Context, and listener leak review"
      - "ANR review"
      - "manifest exported-component review"
      - "Android profiler evidence"

  - condition: "React Native changes"
    checks:
      - "native and JavaScript lifecycle alignment"
      - "effect and subscription cleanup"
      - "bridge or TurboModule boundary validation"
      - "JS-thread and UI-thread blocking review"
      - "Hermes compatibility"
      - "native module platform parity"
      - "bundle size and source-map review"
      - "release-mode device testing"

  - condition: "Flutter changes"
    checks:
      - "widget and State disposal"
      - "BuildContext lifetime"
      - "stream, animation controller, focus node, and text controller cleanup"
      - "isolate usage"
      - "rebuild and repaint behavior"
      - "platform-channel validation"
      - "shader and rendering performance"
      - "DevTools memory and frame analysis"

  - condition: "Kotlin Multiplatform changes"
    checks:
      - "shared and platform-specific responsibility review"
      - "coroutine dispatcher compatibility"
      - "freezing and concurrency semantics where relevant"
      - "Swift and Objective-C interoperability"
      - "public shared API compatibility"
      - "native resource ownership"
      - "platform-specific test coverage"

  - condition: "permission or privacy-sensitive API changes"
    checks:
      - "product requirement"
      - "least-privilege scope"
      - "request timing and rationale"
      - "denied and revoked behavior"
      - "store declaration"
      - "privacy manifest or data-safety update"
      - "data retention review"
      - "physical-device validation"

  - condition: "background work changes"
    checks:
      - "platform-approved scheduler"
      - "constraints and quotas"
      - "idempotency"
      - "retry and backoff"
      - "process-death behavior"
      - "battery impact"
      - "cancellation"
      - "observability"

  - condition: "local database, file, cache, or settings changes"
    checks:
      - "schema or format versioning"
      - "migration from historical versions"
      - "encryption and secure storage"
      - "corruption recovery"
      - "size and retention bounds"
      - "backup and restore behavior"
      - "logout and account-deletion cleanup"
      - "main-thread access review"

  - condition: "authentication or biometric changes"
    checks:
      - "token lifecycle"
      - "refresh concurrency"
      - "OAuth state, nonce, and PKCE"
      - "secure credential storage"
      - "biometric invalidation and fallback"
      - "logout cleanup"
      - "offline behavior"
      - "deep-link callback validation"

  - condition: "push notification or deep-link changes"
    checks:
      - "cold, warm, and foreground entry paths"
      - "payload validation"
      - "authorization before navigation"
      - "duplicate and replay behavior"
      - "token registration lifecycle"
      - "privacy review"
      - "backward payload compatibility"
      - "multi-account and tenant isolation"

  - condition: "camera, media, image, location, Bluetooth, NFC, or sensor changes"
    checks:
      - "permission lifecycle"
      - "physical-device testing"
      - "resource acquisition and release"
      - "background behavior"
      - "battery and memory impact"
      - "malformed or oversized input"
      - "privacy and metadata handling"
      - "hardware unavailable and interrupted states"

  - condition: "payment or purchase changes"
    checks:
      - "platform policy compliance"
      - "trusted server verification"
      - "idempotent fulfillment"
      - "pending, cancelled, refunded, restored, and interrupted states"
      - "sandbox and production separation"
      - "receipt or token verification"
      - "duplicate submission tests"
      - "sensitive logging review"

  - condition: "WebView, native bridge, or embedded web content changes"
    checks:
      - "navigation allowlist"
      - "bridge capability minimization"
      - "origin and payload validation"
      - "mixed-content and file-access restrictions"
      - "cookie and token handling"
      - "external-link handling"
      - "production debugging disablement"
      - "malicious-page testing"

  - condition: "performance-sensitive UI or startup changes"
    checks:
      - "release-mode cold-start measurement"
      - "frame-time and jank analysis"
      - "main-thread trace"
      - "memory profile"
      - "battery or energy profile"
      - "before-and-after evidence"
      - "minimum supported device review"

  - condition: "build, signing, release, or store configuration changes"
    checks:
      - "release build"
      - "bundle or archive validation"
      - "signing and provisioning verification"
      - "environment and endpoint verification"
      - "store policy review"
      - "symbol, mapping, and source-map upload"
      - "staged rollout and monitoring plan"
      - "rollback or mitigation plan"

  - condition: "minimum OS or target SDK changes"
    checks:
      - "affected user and device population"
      - "API compatibility"
      - "dependency compatibility"
      - "store policy deadline"
      - "migration and communication plan"
      - "test matrix update"
      - "backend mixed-version compatibility"

reject_if:
  - "permission is requested without a documented product need"
  - "permission scope is broader than required"
  - "optional permission denial makes the application unusable without justification"
  - "privacy manifest, privacy label, data-safety declaration, or permission purpose is inconsistent with behavior"
  - "sensitive data, token, credential, key, payment data, health data, or precise location is stored outside approved secure storage"
  - "secret is embedded in source, mobile bundle, resources, native library, configuration, or release artifact"
  - "authentication or authorization relies only on the mobile client"
  - "OAuth callback, deep link, notification, IPC, or native-bridge payload is trusted without validation"
  - "main thread performs blocking network, database, file, image, cryptographic, or heavy compute work"
  - "critical interaction can produce an ANR, watchdog termination, or sustained UI freeze"
  - "background work lacks lifecycle ownership, idempotency, cancellation, bounded retry, or platform-compliant scheduling"
  - "task, coroutine, subscription, observer, timer, listener, controller, view, activity, fragment, context, worker, media session, or native resource can leak"
  - "async result can update a destroyed screen or overwrite newer state"
  - "cache, offline queue, database, file storage, retry backlog, media buffer, or in-memory collection can grow without bound"
  - "large image, media, file, response, or dataset is fully materialized without evidence of safe memory use"
  - "location, camera, microphone, sensor, Bluetooth, or media resource remains active when no longer needed"
  - "network request lacks bounded timeout where indefinite waiting is possible"
  - "retry is unbounded or can duplicate a non-idempotent operation"
  - "TLS verification or hostname verification is disabled"
  - "cleartext traffic is introduced without explicit approval"
  - "WebView or native bridge exposes generic privileged execution"
  - "debug, test, staging, or developer endpoints can be used by a production build"
  - "production build remains debuggable without approved justification"
  - "local-data migration can leave partially valid or unrecoverable state"
  - "destructive migration lacks backup, rollback, compensation, or explicit approval"
  - "older supported app version can silently corrupt newer local or remote state"
  - "payment success is trusted only from the client"
  - "push, notification, offline queue, or sync processing is non-idempotent where duplicates are possible"
  - "release configuration changes lack build, signing, provisioning, environment, or artifact evidence"
  - "distributed artifact differs from the tested and validated artifact"
  - "signing key, certificate, provisioning profile, or store credential handling is insecure"
  - "store declaration is known to be inaccurate"
  - "minimum OS or target SDK changes without compatibility and user-impact analysis"
  - "release has no monitoring, staged rollout, feature flag, rollback, or mitigation strategy for a high-risk change"
  - "performance, memory, battery, crash, or store-validation result is claimed without execution evidence"

preferred_patterns:
  - "unidirectional data flow"
  - "lifecycle-aware state and task ownership"
  - "immutable UI state"
  - "platform adapters around device APIs"
  - "structured concurrency"
  - "cancellable background work"
  - "secure platform credential storage"
  - "offline-first only where business requirements justify it"
  - "idempotent sync and submission"
  - "versioned local-data migrations"
  - "streaming and pagination"
  - "bounded image, cache, storage, and queue usage"
  - "system browser for OAuth"
  - "universal links and app links over custom schemes where practical"
  - "least-privilege permissions requested in context"
  - "release-mode profiling"
  - "physical-device validation for device integrations"
  - "staged store rollout"
  - "feature flags with ownership and removal plans"
  - "backward-compatible backend evolution for mixed mobile versions"
  - "symbols and source maps tied to immutable release artifacts"

deliverables:
  - "affected platforms, OS versions, devices, architectures, and frameworks"
  - "application lifecycle, process-death, and state-restoration assessment"
  - "UI-thread, concurrency, cancellation, and responsiveness assessment"
  - "navigation and UI-state assessment"
  - "permission, privacy, and store-declaration assessment"
  - "authentication, biometrics, secure-storage, and sensitive-data assessment"
  - "networking, offline, sync, retry, and idempotency assessment"
  - "local database, cache, file, migration, and retention assessment"
  - "push notification, deep-link, WebView, and native-bridge assessment"
  - "device API, media, location, sensor, and hardware-lifecycle assessment"
  - "performance, memory, battery, network, and storage impact"
  - "accessibility, localization, responsive layout, and device compatibility assessment"
  - "build, signing, provisioning, environment, release, and store-readiness assessment"
  - "crash reporting, analytics, observability, and post-release monitoring impact"
  - "commands, builds, tests, emulator, simulator, physical-device, and profile evidence"
  - "staged rollout, rollback, feature flag, or mitigation plan"
  - "unresolved risks, owners, and required approvals"

review_output:

  required_sections:
    - "Change summary"
    - "Platform and version detection"
    - "Architecture and lifecycle"
    - "UI responsiveness and state"
    - "Permissions and privacy"
    - "Authentication and secure storage"
    - "Networking, offline, and sync"
    - "Local data and migrations"
    - "Push, deep links, and device integrations"
    - "Performance, memory, battery, and storage"
    - "Accessibility and localization"
    - "Build, signing, and release"
    - "Store compliance"
    - "Observability and crash reporting"
    - "Testing and profiling evidence"
    - "Unresolved risks"
    - "Decision"

  decision:
    allowed_values:
      - "APPROVE"
      - "APPROVE_WITH_CONDITIONS"
      - "REJECT"
      - "INCOMPLETE"

    requirements:
      - "cite source, configuration, build, archive, bundle, signature, entitlement, manifest, test, simulator, emulator, physical-device, profile, or store evidence"
      - "do not claim device-specific behavior passed based only on unit tests or simulator execution"
      - "do not claim release readiness based only on debug builds"
      - "identify every affected permission, entitlement, exported component, deep-link route, background task, device API, SDK, and native bridge"
      - "identify lifecycle owner and cleanup path for every task, coroutine, listener, observer, timer, subscription, media session, worker, and native resource"
      - "state which platforms, OS versions, device classes, and architectures were actually tested"
      - "distinguish verified native behavior from shared-code inference"
      - "identify all local-data migration, backend compatibility, mixed-version, and rollback limitations"
      - "require explicit human approval for signing-key changes, production store submission, phased rollout, forced-update activation, destructive migration, or permission expansion"

