project_doc_max_bytes = 32768
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
hooks = true

[agents]
max_threads = 5
max_depth = 1

[mcp_servers.codegraph]
enabled = true
command = "codegraph"
args = ["serve", "--mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.cocoindex-code]
enabled = true
command = "ccc"
args = ["mcp"]
startup_timeout_sec = 20
tool_timeout_sec = 120
